id: btrfs-stats
host: true
live: true
privileged: true
read:
  exec-from:
    each: mounts.active
    keep: {properties: {filesystem: {const: btrfs}}}
    argv: [/usr/bin/btrfs, device, stats, '{key}']
    split: true
parse: {plugin: formats, op: kv, with: {separator: whitespace}}
into: btrfs.stats
