id: apparmor-profiles
live: true
privileged: true
read:
  files: [/sys/kernel/security/apparmor/profiles]
parse:
  plugin: formats
  op: match
  with:
    pattern: '^(?P<key>.+) \((?P<mode>[a-z]+)\)$'
into: apparmor.profiles
