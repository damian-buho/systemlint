id: kernel-modules-shipped
host: true
read:
  files: [/lib/modules/*/modules.order]
parse:
  plugin: formats
  op: match
  with: {pattern: '^(?:\S*/)?(?P<key>[^/\s]+?)\.ko'}
into: kernel.shipped
