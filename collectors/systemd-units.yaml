id: systemd-units
read:
  files: [/etc/systemd/system/*.service, /etc/systemd/system/*.service.d/*.conf, /run/systemd/system/*.service, /run/systemd/system/*.service.d/*.conf, /usr/local/lib/systemd/system/*.service, /usr/local/lib/systemd/system/*.service.d/*.conf, /usr/lib/systemd/system/*.service, /usr/lib/systemd/system/*.service.d/*.conf, /lib/systemd/system/*.service, /lib/systemd/system/*.service.d/*.conf]
  stat: [/etc/systemd/system/*.service, /etc/systemd/system/*.service.d/*.conf, /run/systemd/system/*.service, /run/systemd/system/*.service.d/*.conf, /usr/local/lib/systemd/system/*.service, /usr/local/lib/systemd/system/*.service.d/*.conf, /usr/lib/systemd/system/*.service, /usr/lib/systemd/system/*.service.d/*.conf, /lib/systemd/system/*.service, /lib/systemd/system/*.service.d/*.conf]
parse: {plugin: systemd, op: units}
into: systemd.units
