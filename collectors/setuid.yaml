id: setuid
privileged: true
read:
  stat: [/usr/**, /bin/**, /sbin/**, /lib/**, /lib64/**, /opt/**]
  stat-keep:
    properties: {kind: {const: file}}
    anyOf:
      - {properties: {setuid: {const: true}}}
      - {properties: {setgid: {const: true}}}
parse: {plugin: formats, op: stat}
into: setuid
