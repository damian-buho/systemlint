id: ports-owners-udp
live: true
privileged: true
read:
  exec: [/usr/bin/ss, -Hulpn]
parse:
  plugin: formats
  op: match
  with: {pattern: '^\S+\s+\d+\s+\d+\s+\S+:(?P<key>\d+)\s+\S+\s+users:\(\("(?P<program>[^"]+)"'}
into: ports-owners.udp
