id: sysctl-apparmor
host: true
privileged: true
read:
  exec: [/usr/sbin/sysctl, --all, --pattern, '^kernel\.apparmor_restrict_unprivileged_']
parse:
  - {plugin: formats, op: kv, with: {repeat: last, swap: /., strip: "-"}}
  - {nest: "."}
into: sysctl.apparmor
