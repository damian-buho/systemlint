id: sysctl-apparmor
privileged: true
read:
  exec: [/usr/sbin/sysctl, --all, --pattern, '^kernel\.apparmor_restrict_unprivileged_']
parse:
  plugin: formats
  op: kv
  with: {repeat: last, nest: ".", swap: /, strip: "-"}
into: sysctl.apparmor
