id: sudo-defaults
read:
  exec-from:
    each: accounts.passwd
    keep: {properties: {uid: {not: {const: 0}}}}
    argv: [/usr/bin/sudo, --list, '--other-user={key}']
    split: true
parse:
  plugin: formats
  op: kv
  with: {section: Matching Defaults entries, records: ",", negate: "!", repeat: last}
into: sudo.defaults
privileged: true
