id: journald-main
read:
  files: ['/etc/systemd/journald.con?', '/run/systemd/journald.con?', '/usr/local/lib/systemd/journald.con?', '/usr/lib/systemd/journald.con?']
  order: drop-in
parse: {plugin: formats, op: kv, with: {comments: ["#", ";", "["], repeat: last}}
into: journald.main
