id: kernel-modules
read:
  files: [/etc/modprobe.d/*.conf, /run/modprobe.d/*.conf, /usr/local/lib/modprobe.d/*.conf, /usr/lib/modprobe.d/*.conf, /lib/modprobe.d/*.conf, /lib/modules/*/modules.order, /lib/modules/*/modules.builtin]
parse: {plugin: formats, op: modprobe}
into: kernel.modules
