id: coredump-drop-ins
read:
  files: [/etc/systemd/coredump.conf.d/*.conf, /run/systemd/coredump.conf.d/*.conf, /usr/local/lib/systemd/coredump.conf.d/*.conf, /usr/lib/systemd/coredump.conf.d/*.conf]
  order: drop-in
parse: {plugin: formats, op: kv, with: {comments: ["#", ";", "["], repeat: last}}
into: coredump.conf.drop-ins
