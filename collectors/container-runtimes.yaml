id: container-runtimes
read:
  stat:
    - /usr/*bin/dockerd
    - /usr/*bin/containerd
    - /usr/*bin/podman
    - /usr/*bin/crio
    - /usr/*bin/kubelet
    - /usr/*bin/lxc-start
    - /usr/*bin/lxd
    - /usr/libexec/incus/incusd
    - /usr/local/bin/dockerd
    - /usr/local/bin/containerd
    - /usr/local/bin/k3s
    - /usr/local/bin/rke2
    - /snap/bin/docker
    - /snap/bin/lxd
    - /snap/bin/microk8s
parse: {plugin: formats, op: stat}
into: runtimes.containers
