id: chrony-sources
read:
  files-from: ['{chrony.conf.*.sourcedir}/*.sources', '{chrony.conf.*.confdir}/*.conf']
parse: {plugin: formats, op: words, with: {comments: ['#', '!', ';', '%'], directives: [server, pool], repeat: append}}
into: chrony.sources
