id: mounts-fstab
read:
  files: [/etc/fstab]
parse:
  plugin: formats
  op: words
  with: {columns: [source, mountpoint, filesystem, options, dump, pass], required: 3, lists: [options], toggles: [options], key: mountpoint, repeat: last, octal: true}
into: mounts.fstab
