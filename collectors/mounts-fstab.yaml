id: mounts-fstab
host: true
read:
  files: [/etc/fstab]
parse:
  plugin: formats
  op: words
  with: {columns: [source, mountpoint, filesystem, options, dump, pass], required: 3, lists: [options], toggles: [options], implies: {user: [noexec, nosuid, nodev], users: [noexec, nosuid, nodev], owner: [nosuid, nodev], group: [nosuid, nodev]}, key: mountpoint, repeat: last, octal: true}
into: mounts.fstab
