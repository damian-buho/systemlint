id: files-libraries
read:
  stat: [/usr/lib, /usr/lib/*.so*, /usr/lib64, /usr/lib64/*.so*, /usr/lib/*-linux-gnu*, /usr/lib/*-linux-gnu*/*.so*]
  stat-keep: {properties: {kind: {enum: [file, directory]}}}
parse: {plugin: formats, op: stat}
into: files.libraries
