id: journald-files
read:
  stat: [/var/log/journal, /var/log/journal/**, /run/log/journal, /run/log/journal/**]
  stat-keep: {properties: {kind: {enum: [file, directory]}}}
parse: {plugin: formats, op: stat}
into: journald.files
