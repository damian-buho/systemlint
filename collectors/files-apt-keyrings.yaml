id: files-apt-keyrings
read:
  stat: [/etc/apt/trusted.gpg, /etc/apt/trusted.gpg.d, /etc/apt/trusted.gpg.d/*, /etc/apt/keyrings, /etc/apt/keyrings/*, /usr/share/keyrings, /usr/share/keyrings/*]
parse: {plugin: formats, op: stat}
into: files.apt-keyrings
