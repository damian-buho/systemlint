id: ssh-authorized-keys
read:
  files-from: [ssh.authorized-key-files.*]
  stat-from: [ssh.authorized-key-files.*]
parse: {plugin: sshd, op: authorized-keys}
into: ssh.authorized-keys
privileged: true
