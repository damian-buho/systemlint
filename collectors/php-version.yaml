id: php-version
read:
  exec: [/usr/bin/php, -v]
parse:
  plugin: formats
  op: match
  with: {pattern: '^PHP (?P<version>\d+\.\d+\.\d+)(?P<extra>\S*) \((?P<key>[a-z-]+)\)'}
into: php.version
