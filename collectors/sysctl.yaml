id: sysctl
ttl: 3600
host: true
read:
  files: [/etc/sysctl.d/*.conf, /run/sysctl.d/*.conf, /usr/local/lib/sysctl.d/*.conf, /usr/lib/sysctl.d/*.conf, /lib/sysctl.d/*.conf, /etc/sysctl.conf]
  order: drop-in
  exec: [/usr/sbin/sysctl, -a]
  prefer: exec
  unset-is-default: true
parse:
  - {plugin: formats, op: kv, with: {comments: ["#", ";"], repeat: last, swap: /., strip: "-"}}
  - {nest: "."}
  - {split: whitespace, fields: [allocated, free, max], at: fs.file-nr}
  - {split: whitespace, fields: [min, max], at: net.ipv4.ip_local_port_range}
  - {ranges: ",", at: net.ipv4.ip_local_reserved_ports}
into: sysctl.settings
