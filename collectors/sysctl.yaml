id: sysctl
read:
  files: [/etc/sysctl.conf, /etc/sysctl.d/*.conf, /run/sysctl.d/*.conf, /usr/local/lib/sysctl.d/*.conf, /usr/lib/sysctl.d/*.conf, /lib/sysctl.d/*.conf]
  exec: [/usr/sbin/sysctl, -a]
parse: {plugin: formats, op: sysctl}
into: sysctl
