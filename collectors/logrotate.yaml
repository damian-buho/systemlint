id: logrotate
read:
  files: [/etc/logrotate.conf, /etc/logrotate.d/*]
parse:
  plugin: formats
  op: words
  with:
    blocks: {scripts: {postrotate: endscript, prerotate: endscript, firstaction: endscript, lastaction: endscript, preremove: endscript}}
    repeat: last
into: logrotate
