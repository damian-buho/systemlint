id: redis-protected-mode
read:
  files: [/etc/redis/redis.conf, /etc/redis.conf]
parse:
  plugin: formats
  op: match
  with: {pattern: '^\s*(?P<key>protected-mode)\s+(?P<value>yes|no)\s*$'}
into: redis.protected-mode
