id: snmp-communities
read:
  files: [/etc/snmp/snmpd.conf, /etc/snmp/snmpd.conf.d/*.conf]
parse:
  plugin: formats
  op: match
  with: {pattern: '^\s*(?:com2sec6?\s+\S+\s+\S+|r[ow]community6?)\s+(?P<key>public|private)(\s|$)'}
into: snmp.communities
