id: interfaces-flags
live: true
read:
  exec: [/usr/sbin/ip, -o, link, show]
parse:
  plugin: formats
  op: match
  with: {pattern: '^[0-9]+: (?P<key>[^:@ ]+)[^<]*<(?P<flags>[^>]*)>'}
into: interfaces.flags
