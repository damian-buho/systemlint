id: sudo-grants
read:
  exec-from:
    each: accounts.passwd
    keep: {properties: {uid: {not: {const: 0}}}}
    argv: [/usr/bin/sudo, --list, '--other-user={key}']
    split: true
parse:
  plugin: formats
  op: match
  with: {pattern: '^    (?P<key>\((?P<runas>[^)]*)\) (?P<commands>.+))$'}
into: sudo.grants
privileged: true
