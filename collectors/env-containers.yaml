id: env-containers
live: true
privileged: true
containers: true
read:
  files: [/proc/*/environ, /proc/*/cgroup, /proc/*/stat, /var/lib/docker/containers/*/config.v2.json]
parse: {plugin: env, op: containers}
into: env.containers
