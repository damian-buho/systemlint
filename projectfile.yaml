---
# SPDX-FileCopyrightText: 2026 Damián Búho <damian.buho@proton.me>
#
# SPDX-License-Identifier: AGPL-3.0-only
$schema: https://projectfile.org/schema/v1.json
identity:
  created: "2026-11-11"
  name: systemlint
  namespace: me.dbuho
  summary:
    en: Linter for operating systems, from apt sources to file permissions
    es: Linter para sistemas operativos, desde las fuentes de apt hasta los permisos de archivos
    uk: Лінтер для операційних систем — від джерел apt до прав доступу до файлів
  title: Systemlint
  description:
    en: |-
      Systemlint collects facts about a host, a root filesystem or a container image, then judges them with declarative rules. Collecting and judging are separate steps, so one saved facts document serves any number of policies.

      The core reads every file and runs every command; each plugin is a separate static binary that only turns those bytes into facts. Written in Rust.
    es: |-
      Systemlint recopila datos sobre un equipo, un sistema de archivos raíz o una imagen de contenedor y los evalúa con reglas declarativas. Recopilar y evaluar son pasos separados, así que un mismo documento de datos guardado sirve para cualquier número de políticas.

      El núcleo lee cada archivo y ejecuta cada orden; cada complemento es un binario estático aparte que solo convierte esos bytes en datos. Escrito en Rust.
    uk: |-
      Systemlint збирає факти про хост, кореневу файлову систему чи образ контейнера, а потім оцінює їх декларативними правилами. Збирання й оцінювання — окремі кроки, тож один збережений документ фактів слугує будь-якій кількості політик.

      Ядро читає кожен файл і виконує кожну команду; кожен плагін — окремий статичний бінарний файл, який лише перетворює ці байти на факти. Написаний на Rust.
  visibility: private
  version: 0.3.0
  released: "2026-11-13"
kind: SoftwareSourceCode
keywords:
  - linter
  - compliance
  - hardening
  - apt
  - sshd
  - file-permissions
  - rust
license:
  covers: project
  spdx: AGPL-3.0-only
links:
  - label:
      en: Repository on kiota.ch
      es: Repositorio en kiota.ch
      uk: Репозиторій на kiota.ch
    preferred: true
    priority: 10
    type: source-code
    url: https://kiota.ch/damian-buho/systemlint
org:
  projectfile:
    images:
      RUST_TOOL_IMAGE:
        libc: musl
    artifacts:
      cargo-binary:
        command: systemlint
        executable: dist/systemlint
        path: dist/systemlint
    architecture:
      - amd64
      - arm64
    operating-system:
      - linux
    ci:
      env:
        TARGET_ARCH: amd64
        TARGET_OS: linux
      nodes:
        binaries-are-built:
          needs:
            build-binaries: true
          matrix:
            axes:
              TARGET_ARCH:
                - amd64
                - arm64
              TARGET_OS:
                - linux
      tools:
        gh-release:
          set-env:
            RELEASE_PATH: ${org.projectfile.artifacts{kind=binary}.path}
        build-binaries:
          artifact: dist
          env:
            - TARGET_OS
            - TARGET_ARCH
            - GITHUB_REF_NAME
            - M6E_RELEASE_TAG
          guard: Cargo.toml
          image: RUST_TOOL_IMAGE
          m6e:
            prefer-local: true
          run: .scripts/build-binaries.sh
          description: Build every binary crate as a static musl binary for the OS/arch cell
          tags: [publish]
        install-binary:
          forgejo: false
          gha: false
          run: .scripts/install-binary.sh
          description: Build the host-native archive, unpack it into ~/.systemlint and link systemlint into ~/.local/bin
    attributes:
      shell:
        exclude:
          - fixtures/**
    ignores:
      git:
        include:
          - /mutants.out/
          - /mutants.out.old/
      textlint:
        include:
          - fixtures/sshd/sshd-T.txt
          - fixtures/sshd/accounts/
          - fixtures/*/apt-config-dump.txt
          - fixtures/sudo/sudo.ws/
          - fixtures/sudo/sudo-rs/
      fd:
        include:
          - fixtures/sshd/sshd-T.txt
          - fixtures/sshd/accounts/
          - fixtures/*/apt-config-dump.txt
          - fixtures/sudo/sudo.ws/
          - fixtures/sudo/sudo-rs/
    readme:
      download: latest/download
      installation:
        - name: release-archive
          priority: 5
          title:
            en: Prebuilt archive
            es: Archivo precompilado
            uk: Готовий архів
          prefix:
            en: "Download the archive for your architecture and unpack it into `/usr/local`:"
            es: "Descarga el archivo para tu arquitectura y descomprímelo en `/usr/local`:"
            uk: "Завантажте архів для своєї архітектури й розпакуйте його в `/usr/local`:"
          syntax: sh
          commands:
            - curl --fail --location ${org.projectfile.forge.remotes.github.url}/releases/${org.projectfile.readme.download}/systemlint-linux-$(uname -m).tar.gz | sudo tar --extract --gzip --directory /usr/local
            - systemlint --version
          postfix:
            en: "The archive holds the core, its plugins, collectors and rulesets under `bin/`, `lib/systemlint/` and `share/systemlint/`."
            es: "El archivo contiene el núcleo, sus complementos, recolectores y conjuntos de reglas en `bin/`, `lib/systemlint/` y `share/systemlint/`."
            uk: "Архів містить ядро, його плагіни, збирачі та набори правил у `bin/`, `lib/systemlint/` і `share/systemlint/`."
      usage:
        - name: host
          priority: 20
          prefix:
            en: "Lint the host it runs on, read-only, as root with only the capability to read every file:"
            es: "Analiza el equipo en el que se ejecuta, en solo lectura, como root y solo con la capacidad de leer cualquier archivo:"
            uk: "Перевірте хост, на якому запускаєте, лише для читання, від root і лише з можливістю читати будь-який файл:"
          syntax: sh
          commands:
            - docker run --rm --network none --read-only --cap-drop ALL --cap-add DAC_READ_SEARCH --user 0 --volume /:/host:ro --entrypoint systemlint ${org.projectfile.artifacts{kind=image}.ref} check --root /host
        - name: image
          priority: 30
          prefix:
            en: "Lint a container image with its owners and modes intact (Docker 28 or later), as SARIF:"
            es: "Analiza una imagen de contenedor con sus propietarios y permisos intactos (Docker 28 o posterior), en SARIF:"
            uk: "Перевірте образ контейнера зі збереженими власниками й правами (Docker 28 або новіший), у форматі SARIF:"
          syntax: sh
          commands:
            - docker run --rm --network none --read-only --cap-drop ALL --cap-add DAC_READ_SEARCH --user 0 --mount type=image,source=ubuntu:26.04,target=/subject --entrypoint systemlint ${org.projectfile.artifacts{kind=image}.ref} check --root /subject --format sarif > systemlint.sarif
    conventions:
      fragments:
        parents:
          - url: ssh://git@kiota.ch/b19/ubuntu.git
    status: maintained
  systemlint: {}
repositories:
  - branch: main
    role: origin
    type: git
    url: ssh://git@kiota.ch/damian-buho/systemlint.git
includes:
  - .makefile/b19/ci.yaml
  - .makefile/b19/images/rust.yaml
  - .makefile/b19/images/ubuntu.yaml
  - .makefile/b19/traits/image/attested.yaml
  - .makefile/b19/traits/image/signed.yaml
  - .makefile/library/languages/rust.yaml
  - .makefile/library/traits/binary.yaml
  - .makefile/core/traits/release.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/include.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/traits/has-rules.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/traits/personal-image.yaml
technologies:
  - rust
