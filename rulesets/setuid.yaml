description: set-user-ID and set-group-ID files, and every directory above them, kept from other users
tags: [default]
rules:
  setuid/world-writable:
    title: Set-user-ID file or its directory writable by every user
    fact: setuid.*
    expect:
      if: {required: [world-writable], properties: {world-writable: {const: true}}}
      then: {required: [kind, mode], properties: {kind: {const: directory}, mode: {pattern: "^[1357]"}}}
    severity: error
    score: 9.0
    message: "{subject} is writable by every user, who can then swap a set-user-ID file below it for a program of their own"
    fix: chmod o-w it
    remedy: {chmod: o-w}
    docs: https://man7.org/linux/man-pages/man7/inode.7.html
    tags: [setuid]
  setuid/group-writable:
    title: Set-user-ID file or its directory writable by its group
    fact: setuid.*
    expect:
      if: {required: [group-writable], properties: {group-writable: {const: true}}}
      then: {required: [kind, mode], properties: {kind: {const: directory}, mode: {pattern: "^[1357]"}}}
    severity: warning
    score: 6.5
    message: "{subject} is writable by its group, whose every member can then swap a set-user-ID file below it for a program of their own"
    fix: chmod g-w it, or check that only administrators are in its group
    docs: https://man7.org/linux/man-pages/man7/inode.7.html
    tags: [setuid]
