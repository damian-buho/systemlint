description: Users the at command lets schedule one-off jobs
topic: Services
tags: [default, at]
rules:
  at/no-allow:
    title: at is open to users not named in at.allow
    fact: at.access.*.exists
    keys: {const: /etc/at.allow}
    when: {/at/access/~1usr~1bin~1at/exists: true}
    expect: {const: true}
    severity: info
    score: 1.0
    message: "{subject} does not exist, so every user at.deny leaves out may schedule jobs with at"
    rationale: any user not named in at.deny can schedule jobs that run later, unseen, under their own account
    fix:
      - Write the users allowed to schedule jobs to {subject}, one per line.
      - 'Then give it to root and its group:'
      - run: chown root:daemon {subject}
      - 'Then limit it to its owner and group:'
      - run: chmod 0640 {subject}
    docs: https://manpages.debian.org/unstable/at/at.allow.5.en.html
    tags: [at, cis-ubuntu-26.04:2.4.2.1, cis-controls-v8:3.3, hipaa:164.308(a)(3)(i), hipaa:164.308(a)(3)(ii)(A), hipaa:164.312(a)(1), iso-27001-2022:A5.10, iso-27001-2022:A5.15, iso-27001-2022:A8.3, iso-27001-2022:A8.4, nist-800-171-r2:3.1.1, nist-800-171-r2:3.1.2, nist-800-171-r2:3.8.2, nist-800-171-r3:03.01.01, nist-800-171-r3:03.01.02, nist-800-171-r3:03.01.03, nist-800-171-r3:3.8.2, nist-800-53:AC-3, nist-800-53:AC-5, nist-800-53:AC-6, nist-800-53:CA-3(6), nist-800-53:MP-2, pci-dss-4:1.3.1, pci-dss-4:7.1]
  at/access-mode:
    title: at.allow or at.deny is more open than 0640
    fact: at.access.*.mode
    keys: &access {enum: [/etc/at.allow, /etc/at.deny]}
    when: &exists {at.access.*.exists: true}
    expect: {pattern: "^0[0246][04]0$"}
    severity: info
    score: 1.0
    message: "{subject} has mode {got}; the benchmark asks 0640 or stricter, so only root changes who may schedule jobs"
    rationale: a user who can edit the list can add themselves and schedule jobs under their own account
    fix:
      - 'Give the file to the group the command reads it through:'
      - run: chgrp daemon {subject}
      - 'Then limit it to its owner and that group:'
      - run: chmod 0640 {subject}
    docs: https://manpages.debian.org/unstable/at/at.allow.5.en.html
    tags: [at, cis-ubuntu-26.04:2.4.2.1, cis-controls-v8:3.3, hipaa:164.308(a)(3)(i), hipaa:164.308(a)(3)(ii)(A), hipaa:164.312(a)(1), iso-27001-2022:A5.10, iso-27001-2022:A5.15, iso-27001-2022:A8.3, iso-27001-2022:A8.4, nist-800-171-r2:3.1.1, nist-800-171-r2:3.1.2, nist-800-171-r2:3.8.2, nist-800-171-r3:03.01.01, nist-800-171-r3:03.01.02, nist-800-171-r3:03.01.03, nist-800-171-r3:3.8.2, nist-800-53:AC-3, nist-800-53:AC-5, nist-800-53:AC-6, nist-800-53:CA-3(6), nist-800-53:MP-2, pci-dss-4:1.3.1, pci-dss-4:7.1]
  at/access-owner:
    title: at.allow or at.deny is not owned by root
    fact: at.access.*.uid
    keys: *access
    when: *exists
    expect: {const: 0}
    severity: info
    score: 1.0
    message: "{subject} is owned by uid {got}, not root, so that user decides who may schedule jobs"
    rationale: the owning user can add or remove names on the list, so a non-root account decides who may schedule jobs
    fix: run “chown root {subject}”
    remedy: {chown: 0}
    docs: https://manpages.debian.org/unstable/at/at.allow.5.en.html
    tags: [at, cis-ubuntu-26.04:2.4.2.1, cis-controls-v8:3.3, hipaa:164.308(a)(3)(i), hipaa:164.308(a)(3)(ii)(A), hipaa:164.312(a)(1), iso-27001-2022:A5.10, iso-27001-2022:A5.15, iso-27001-2022:A8.3, iso-27001-2022:A8.4, nist-800-171-r2:3.1.1, nist-800-171-r2:3.1.2, nist-800-171-r2:3.8.2, nist-800-171-r3:03.01.01, nist-800-171-r3:03.01.02, nist-800-171-r3:03.01.03, nist-800-171-r3:3.8.2, nist-800-53:AC-3, nist-800-53:AC-5, nist-800-53:AC-6, nist-800-53:CA-3(6), nist-800-53:MP-2, pci-dss-4:1.3.1, pci-dss-4:7.1]
  at/access-group:
    title: at.allow or at.deny is in a group other than root or daemon
    fact: at.access.*.gid
    keys: *access
    when: {at.access.*.exists: true, at.access.*.gid: {not: {const: 0}}}
    same: accounts.group.daemon.gid
    severity: info
    score: 1.0
    message: "{subject} belongs to gid {got}, not root or daemon (gid {same}), so the members of that group get the group’s access to the list of who may schedule at jobs"
    rationale: every member of an unexpected group can edit the list and so decide who may schedule jobs
    fix: run “chgrp daemon {subject}”
    docs: https://manpages.debian.org/unstable/at/at.allow.5.en.html
    tags: [at, cis-ubuntu-26.04:2.4.2.1, cis-controls-v8:3.3, hipaa:164.308(a)(3)(i), hipaa:164.308(a)(3)(ii)(A), hipaa:164.312(a)(1), iso-27001-2022:A5.10, iso-27001-2022:A5.15, iso-27001-2022:A8.3, iso-27001-2022:A8.4, nist-800-171-r2:3.1.1, nist-800-171-r2:3.1.2, nist-800-171-r2:3.8.2, nist-800-171-r3:03.01.01, nist-800-171-r3:03.01.02, nist-800-171-r3:03.01.03, nist-800-171-r3:3.8.2, nist-800-53:AC-3, nist-800-53:AC-5, nist-800-53:AC-6, nist-800-53:CA-3(6), nist-800-53:MP-2, pci-dss-4:1.3.1, pci-dss-4:7.1]
