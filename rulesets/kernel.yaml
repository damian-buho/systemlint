description: Kernel settings that hand unprivileged users memory layouts, kernel addresses or attack surface
topic: Boot and kernel
tags: [default]
rules:
  kernel/aslr:
    title: Address space randomization is weakened
    fact: sysctl.settings.kernel.randomize_va_space
    expect: {const: 2}
    severity: error
    score: 7.5
    message: "kernel.randomize_va_space is {got}, so stack, heap or mmap addresses are predictable, which makes memory corruption bugs easier to exploit"
    rationale: an attacker who finds a memory bug can aim at a known address, so a crash becomes code execution far more often
    remedy: {drop-in: {into: sysctl, name: kernel-aslr, lines: ["kernel.randomize_va_space = 2"]}}
    docs: https://docs.kernel.org/admin-guide/sysctl/kernel.html#randomize-va-space
    references:
      - {title: Lynis KRNL-6000, url: "https://cisofy.com/lynis/controls/KRNL-6000/"}
    tags: [kernel, sysctl, lynis]
  kernel/kptr-restrict:
    title: Kernel addresses are shown to every user
    fact: sysctl.settings.kernel.kptr_restrict
    expect: {minimum: 1}
    severity: warning
    score: 5.0
    message: "kernel.kptr_restrict is {got}, so /proc and other interfaces print kernel pointers to unprivileged users, which defeats kernel address randomization"
    rationale: any local user learns where the kernel sits in memory, which removes the guesswork from a kernel exploit
    remedy: {drop-in: {into: sysctl, name: kernel-kptr-restrict, lines: ["kernel.kptr_restrict = 1"]}}
    docs: https://docs.kernel.org/admin-guide/sysctl/kernel.html#kptr-restrict
    references:
      - {title: Lynis KRNL-6000, url: "https://cisofy.com/lynis/controls/KRNL-6000/"}
    tags: [kernel, sysctl, lynis]
  kernel/dmesg-restrict:
    title: The kernel log is readable by every user
    fact: sysctl.settings.kernel.dmesg_restrict
    expect: {const: 1}
    severity: warning
    score: 4.0
    message: "kernel.dmesg_restrict is {got}, so any user can read the kernel log, which can leak addresses and hardware details"
    rationale: any local user can read kernel messages that reveal memory addresses and hardware, material for planning a kernel exploit
    remedy: {drop-in: {into: sysctl, name: kernel-dmesg-restrict, lines: ["kernel.dmesg_restrict = 1"]}}
    docs: https://docs.kernel.org/admin-guide/sysctl/kernel.html#dmesg-restrict
    references:
      - {title: Lynis KRNL-6000, url: "https://cisofy.com/lynis/controls/KRNL-6000/"}
    tags: [kernel, sysctl, lynis]
  kernel/ptrace-scope:
    title: Any process may trace another of the same user
    fact: sysctl.settings.kernel.yama.ptrace_scope
    expect: {minimum: 1}
    severity: warning
    score: 5.0
    message: "kernel.yama.ptrace_scope is {got}, so one compromised process can read the memory and secrets of every other process its user runs"
    rationale: malware in one of a user’s programs can attach to their other programs and lift passwords, keys and session tokens from memory
    remedy: {drop-in: {into: sysctl, name: kernel-ptrace-scope, lines: ["kernel.yama.ptrace_scope = 1"]}}
    docs: https://docs.kernel.org/admin-guide/LSM/Yama.html
    references:
      - {title: Lynis KRNL-6000, url: "https://cisofy.com/lynis/controls/KRNL-6000/"}
    tags: [kernel, sysctl, lynis]
  kernel/unprivileged-bpf:
    title: Unprivileged users may load BPF programs
    fact: sysctl.settings.kernel.unprivileged_bpf_disabled
    expect: {minimum: 1}
    severity: warning
    score: 6.0
    message: "kernel.unprivileged_bpf_disabled is {got}, so any user can load BPF programs, a frequent path to kernel exploits"
    rationale: any local user can run their own code inside the kernel, a route that has been used again and again to become root
    remedy: {drop-in: {into: sysctl, name: kernel-unprivileged-bpf, lines: ["kernel.unprivileged_bpf_disabled = 2"]}}
    docs: https://docs.kernel.org/admin-guide/sysctl/kernel.html#unprivileged-bpf-disabled
    references:
      - {title: Lynis KRNL-6000, url: "https://cisofy.com/lynis/controls/KRNL-6000/"}
    tags: [kernel, sysctl, lynis]
  kernel/perf-events:
    title: Unprivileged users may profile the kernel
    fact: sysctl.settings.kernel.perf_event_paranoid
    expect: {minimum: 2}
    severity: warning
    score: 4.0
    message: "kernel.perf_event_paranoid is {got}, so unprivileged users can sample kernel activity through perf_event_open, which leaks kernel addresses and timing"
    rationale: any local user can watch kernel activity and timing, which reveals addresses and secrets that help an exploit or a side-channel attack
    remedy: {drop-in: {into: sysctl, name: kernel-perf-events, lines: ["kernel.perf_event_paranoid = 2"]}}
    docs: https://docs.kernel.org/admin-guide/sysctl/kernel.html#perf-event-paranoid
    references:
      - {title: Lynis KRNL-6000, url: "https://cisofy.com/lynis/controls/KRNL-6000/"}
    tags: [kernel, sysctl, lynis]
  kernel/tty-ldisc-autoload:
    title: Any user may load TTY line discipline modules
    fact: sysctl.settings.dev.tty.ldisc_autoload
    expect: {const: 0}
    severity: info
    score: 2.5
    message: "dev.tty.ldisc_autoload is {got}, so any user can make the kernel load a rarely used line discipline module, and with it that module’s bugs"
    rationale: any local user can make the kernel load an obscure driver, whose bugs have been used to gain root
    fix: set “dev.tty.ldisc_autoload = 0”, unless a serial device needs a line discipline loaded on demand
    docs: https://docs.kernel.org/admin-guide/sysctl/kernel.html
    references:
      - {title: Lynis KRNL-6000, url: "https://cisofy.com/lynis/controls/KRNL-6000/"}
    tags: [kernel, sysctl, lynis]
  kernel/apparmor-unconfined:
    title: Unconfined users may switch AppArmor profile to get user namespaces
    fact: sysctl.apparmor.kernel.apparmor_restrict_unprivileged_unconfined
    when: {sysctl.apparmor: {required: [kernel], properties: {kernel: {required: [apparmor_restrict_unprivileged_userns], properties: {apparmor_restrict_unprivileged_userns: {const: 1}}}}}}
    expect: {const: 1}
    severity: warning
    score: 5.0
    message: "kernel.apparmor_restrict_unprivileged_unconfined is {got}, so an unprivileged process can move itself into a permissive profile with aa-exec and create the user namespaces kernel.apparmor_restrict_unprivileged_userns denies it"
    rationale: a user can switch to a looser profile and regain a capability the confinement was meant to deny, which turns kernel bugs into root access
    fix: set “kernel.apparmor_restrict_unprivileged_unconfined = 1”
    docs: https://ubuntu.com/blog/ubuntu-23-10-restricted-unprivileged-user-namespaces
    tags: [kernel, sysctl, cis-ubuntu-26.04:1.3.1.4]
  kernel/sysrq:
    title: Magic SysRq keys are enabled
    fact: sysctl.settings.kernel.sysrq
    expect: {const: 0}
    severity: info
    score: 1.0
    message: "kernel.sysrq is {got}, so whoever reaches the console keyboard may reboot, kill processes or sync disks without logging in"
    rationale: anyone with keyboard access can reboot the machine, kill every process or sync disks without logging in
    remedy: {drop-in: {into: sysctl, name: kernel-sysrq, lines: ["kernel.sysrq = 0"]}}
    docs: https://docs.kernel.org/admin-guide/sysctl/kernel.html
    tags: [kernel, sysctl, dev-sec-linux-baseline:sysctl-30, '!default']
  kernel/stig-fips:
    title: The kernel runs outside FIPS mode
    fact: kernel.fips
    expect: {required: ["1"]}
    severity: info
    score: 1.0
    message: "/proc/sys/crypto/fips_enabled is 0 or absent, so the kernel and the libraries that follow it may use algorithms outside FIPS 140-3"
    rationale: the host may use cryptography that has not been validated, so encrypted data and connections can be weaker than a regulated user expects
    fix:
      - 'Enable FIPS mode through Ubuntu Pro:'
      - run: pro enable fips-updates
      - Then reboot.
    docs: https://ubuntu.com/security/certifications/docs/fips
    tags: [kernel, sysctl, stig-ubuntu-26.04:UBTU-24-600030, '!default']
