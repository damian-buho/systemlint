description: Account defaults in /etc/login.defs that hand new files to other users, hash passwords weakly or set new accounts’ password ageing
topic: Accounts and authentication
tags: [default]
when: {auth.login-defs: {minProperties: 1}, os.init: {not: {minProperties: 1, additionalProperties: {not: {contains: {enum: [systemd, init, openrc-init, runit]}}}}}}
vars:
  password-max-days: {default: 365, minimum: 1, maximum: 99999}
  password-min-days: {default: 1, minimum: 0, maximum: 99999}
  password-warn-days: {default: 7, minimum: 0, maximum: 99999}
rules:
  login-defs/umask:
    title: The login umask leaves new files open to other users
    fact: auth.login-defs
    expect: {required: [UMASK], properties: {UMASK: {type: string, pattern: "^0[0-7]?[2367]7$"}}}
    severity: warning
    score: 4.0
    message: "UMASK in /etc/login.defs is unset (022) or keeps group write or any other-user bit open, so every user’s new files are readable, or writable, by users who should not see them"
    rationale: files a user creates are readable by other users on the host, so private documents and keys are exposed
    remedy: {set-key: {file: login-defs, key: UMASK, value: "027"}}
    fix: set “UMASK 027” in “/etc/login.defs”, written in octal with its leading 0
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/login.defs.5.html
    references:
      - {title: Lynis AUTH-9328, url: "https://cisofy.com/lynis/controls/AUTH-9328/"}
    tags: [auth, cis-ubuntu-26.04:5.4.3.3, lynis, cis-controls-v8:3.3, hipaa:164.308(a)(3)(i), hipaa:164.308(a)(3)(ii)(A), hipaa:164.312(a)(1), iso-27001-2022:A5.10, iso-27001-2022:A5.15, iso-27001-2022:A8.3, iso-27001-2022:A8.4, nist-800-171-r2:3.1.1, nist-800-171-r2:3.1.2, nist-800-171-r2:3.8.2, nist-800-171-r3:03.01.01, nist-800-171-r3:03.01.02, nist-800-171-r3:03.01.03, nist-800-171-r3:3.8.2, nist-800-53:AC-3, nist-800-53:AC-5, nist-800-53:AC-6, nist-800-53:CA-3(6), nist-800-53:MP-2, pci-dss-4:1.3.1, pci-dss-4:7.1]
  login-defs/umask-077:
    title: The login umask lets the group read new files
    folds: [login-defs/umask]
    fact: auth.login-defs
    expect: {required: [UMASK], properties: {UMASK: {type: string, pattern: "^0[0-7]?77$"}}}
    severity: info
    score: 1.5
    message: "UMASK in /etc/login.defs is unset (022) or leaves a group bit open, where 077 is asked, so a user’s new files are readable by the members of their group"
    rationale: files a user creates can be read by every member of their group, so private documents and keys are exposed to people who need not see them
    remedy: {set-key: {file: login-defs, key: UMASK, value: "077"}}
    fix: set “UMASK 077” in “/etc/login.defs”
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/login.defs.5.html
    tags: [auth, stig-ubuntu-26.04:UBTU-24-300030, '!default']
  login-defs/encrypt-method:
    title: New passwords are hashed with a weak or unknown scheme
    fact: auth.login-defs
    expect: {required: [ENCRYPT_METHOD], properties: {ENCRYPT_METHOD: {enum: [SHA512, YESCRYPT]}}}
    severity: warning
    score: 4.5
    message: "ENCRYPT_METHOD in /etc/login.defs is unset or names a scheme other than SHA512 or YESCRYPT, written in capitals, so chpasswd, newusers and pam_unix with no hash option fall back to DES or MD5, whose hashes crack offline in hours"
    rationale: password hashes stored in the weak scheme can be cracked offline within hours once the hash file leaks
    remedy: {set-key: {file: login-defs, key: ENCRYPT_METHOD, value: YESCRYPT}}
    fix:
      - 'Set this line in “/etc/login.defs”, or “ENCRYPT_METHOD SHA512” where FIPS 140-3 applies:'
      - lines: ["ENCRYPT_METHOD YESCRYPT"]
      - Then have every user change their password so it is hashed again.
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/login.defs.5.html
    references:
      - {title: Lynis AUTH-9229, url: "https://cisofy.com/lynis/controls/AUTH-9229/"}
    tags: [auth, cis-ubuntu-26.04:5.4.1.4, lynis, cis-controls-v8:3.11, hipaa:164.312(a)(2)(iv), hipaa:164.312(e)(2)(ii), iso-27001-2022:A5.33, nist-800-171-r2:3.13.16, nist-800-171-r2:3.8.1, nist-800-171-r3:03.05.07, nist-800-171-r3:03.13.08, nist-800-53:AU-9(3), nist-800-53:IA-5(1), nist-800-53:SC-28, nist-800-53:SC-28(1), nist-csf-2:PR.DS-01, pci-dss-4:3.1.1, pci-dss-4:3.3.2, pci-dss-4:3.3.3, pci-dss-4:3.5.1, pci-dss-4:3.5.1.2, pci-dss-4:3.5.1.3, pci-dss-4:8.3.2]
  login-defs/encrypt-method-sha512:
    title: New passwords are hashed with a scheme other than SHA512
    folds: [login-defs/encrypt-method]
    fact: auth.login-defs
    expect: {required: [ENCRYPT_METHOD], properties: {ENCRYPT_METHOD: {const: SHA512}}}
    severity: info
    score: 1.0
    message: "ENCRYPT_METHOD in /etc/login.defs is {got}, where SHA512, the FIPS 140-3 approved scheme, is asked"
    rationale: password hashes may be stored in a scheme outside the approved set, which a regulated environment rejects and may be cracked faster
    remedy: {set-key: {file: login-defs, key: ENCRYPT_METHOD, value: SHA512}}
    fix:
      - 'Set this line in “/etc/login.defs”:'
      - lines: ["ENCRYPT_METHOD SHA512"]
      - Then have every user change their password so it is hashed again.
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/login.defs.5.html
    tags: [auth, stig-ubuntu-26.04:UBTU-24-400400, fips-140-3:UBTU-24-400400, '!default']
  login-defs/sha-rounds:
    title: SHA password hashes take fewer rounds than the default
    fact: auth.login-defs
    when: {auth.login-defs: {required: [ENCRYPT_METHOD], properties: {ENCRYPT_METHOD: {enum: [SHA256, SHA512]}}}}
    expect:
      anyOf:
        - {required: [SHA_CRYPT_MIN_ROUNDS], properties: {SHA_CRYPT_MIN_ROUNDS: {type: integer, minimum: 5000}}}
        - {not: {required: [SHA_CRYPT_MIN_ROUNDS]}, properties: {SHA_CRYPT_MAX_ROUNDS: {type: integer, minimum: 5000}}}
    severity: info
    score: 1.5
    message: "SHA_CRYPT_MIN_ROUNDS, or SHA_CRYPT_MAX_ROUNDS when it is the only one set, in /etc/login.defs is below 5000, the default, so new password hashes cost an offline attacker less than an unconfigured host’s"
    rationale: each password guess costs an attacker less to try, so a leaked hash file is cracked sooner
    fix: set “SHA_CRYPT_MIN_ROUNDS 5000” in “/etc/login.defs”, or remove both “SHA_CRYPT_*_ROUNDS” lines to get the default
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/login.defs.5.html
    references:
      - {title: Lynis AUTH-9230, url: "https://cisofy.com/lynis/controls/AUTH-9230/"}
    tags: [auth, lynis]
  login-defs/pass-max-days:
    title: New accounts get no maximum password age, or one above the maximum
    fact: auth.login-defs
    expect: {required: [PASS_MAX_DAYS], properties: {PASS_MAX_DAYS: {type: integer, minimum: 1, maximum: "${password-max-days}"}}}
    severity: info
    score: 2.0
    message: "PASS_MAX_DAYS in /etc/login.defs is unset or outside 1 to ${password-max-days}, so accounts made from now on get that maximum password age"
    rationale: new accounts keep one password forever, so a password stolen once stays useful to the thief indefinitely
    fix:
      - 'Set this line in “/etc/login.defs”:'
      - lines: ["PASS_MAX_DAYS ${password-max-days}"]
      - Then run “chage --maxdays ${password-max-days}” for existing accounts.
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/login.defs.5.html
    references:
      - {title: Lynis AUTH-9286, url: "https://cisofy.com/lynis/controls/AUTH-9286/"}
    tags: [auth, cis-ubuntu-26.04:5.4.1.1, lynis, cis-controls-v8:5.2, iso-27001-2022:A5.17, nist-800-171-r2:3.5.7, nist-800-171-r3:03.05.07, nist-800-53:IA-5(1), pci-dss-4:2.2.2, pci-dss-4:8.3.5, pci-dss-4:8.3.6, pci-dss-4:8.6.3, '!default']
    conflicts: [login-defs/pass-rotation]
  login-defs/pass-rotation:
    title: New accounts must change their password on a schedule
    fact: auth.login-defs
    expect:
      anyOf:
        - {not: {required: [PASS_MAX_DAYS]}}
        - {properties: {PASS_MAX_DAYS: {anyOf: [{type: integer, minimum: 99999}, {enum: [-1, "-1"]}]}}}
    severity: info
    score: 2.0
    message: "PASS_MAX_DAYS in /etc/login.defs is {got}, so accounts made from now on must change their password on a schedule, which steers people to predictable successors of the old one"
    rationale: forced regular changes push people to pick small variations of the old password, which an attacker can guess from a leaked one
    fix: set “PASS_MAX_DAYS 99999” in “/etc/login.defs”, and force a change only on evidence of compromise
    docs: https://pages.nist.gov/800-63-4/sp800-63b.html#passwordver
    references:
      - {title: NIST SP 800-63B-4 3.1.1.2, url: "https://pages.nist.gov/800-63-4/sp800-63b.html#passwordver"}
    tags: [auth, nist-sp-800-63b-4:3.1.1.2]
    conflicts: [login-defs/pass-max-days]
  login-defs/pass-min-days:
    title: New accounts can change their password again before the minimum age
    fact: auth.login-defs
    expect: {required: [PASS_MIN_DAYS], properties: {PASS_MIN_DAYS: {type: integer, minimum: "${password-min-days}"}}}
    severity: info
    score: 1.5
    message: "PASS_MIN_DAYS in /etc/login.defs is unset or below ${password-min-days}, so on accounts made from now on a forced password change can be undone at once"
    rationale: a user can change the password straight back to the old one, so a forced change on a possibly leaked password achieves nothing
    fix:
      - 'Set this line in “/etc/login.defs”:'
      - lines: ["PASS_MIN_DAYS ${password-min-days}"]
      - Then run “chage --mindays ${password-min-days}” for existing accounts.
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/login.defs.5.html
    references:
      - {title: Lynis AUTH-9286, url: "https://cisofy.com/lynis/controls/AUTH-9286/"}
    tags: [auth, cis-ubuntu-26.04:5.4.1.2, lynis, stig-ubuntu-26.04:UBTU-24-400300, cis-controls-v8:5.2, iso-27001-2022:A5.17, nist-800-171-r2:3.5.7, nist-800-171-r3:03.05.07, nist-800-53:IA-5(1), pci-dss-4:2.2.2, pci-dss-4:8.3.5, pci-dss-4:8.3.6, pci-dss-4:8.6.3, '!default']
  login-defs/pass-warn-age:
    title: New accounts get less password expiry warning than asked
    fact: auth.login-defs
    expect: {required: [PASS_WARN_AGE], properties: {PASS_WARN_AGE: {type: integer, minimum: "${password-warn-days}"}}}
    severity: info
    score: 1.0
    message: "PASS_WARN_AGE in /etc/login.defs is unset or below ${password-warn-days}, so accounts made from now on get less warning before their password expires"
    rationale: users learn too late that their password is about to expire and can be locked out of the host or caught off guard
    fix:
      - 'Set this line in “/etc/login.defs”:'
      - lines: ["PASS_WARN_AGE ${password-warn-days}"]
      - Then run “chage --warndays ${password-warn-days}” for existing accounts.
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/login.defs.5.html
    tags: [auth, cis-ubuntu-26.04:5.4.1.3, cis-controls-v8:5.2, iso-27001-2022:A5.17, nist-800-171-r2:3.5.7, nist-800-171-r3:03.05.07, nist-800-53:IA-5(1), pci-dss-4:2.2.2, pci-dss-4:8.3.5, pci-dss-4:8.3.6, pci-dss-4:8.6.3, '!default']
