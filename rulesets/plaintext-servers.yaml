description: NIS, TFTP, telnet, rsh and inetd services that serve the network in plain text with little or no authentication
topic: Services
tags: [default]
rules:
  plaintext-servers/nis-unit:
    title: A NIS server is enabled or running
    fact: systemd.state.*
    keys: {enum: [ypserv.service, yppasswdd.service, ypxfrd.service]}
    expect: &off
      anyOf:
        - {properties: {masked: {const: true}}, required: [masked]}
        - properties:
            enabled: {const: false}
            active: {not: {enum: [active, activating, reloading]}}
    severity: error
    score: 7.0
    message: "{subject} is enabled or running, so any host that guesses the NIS domain name can fetch its maps, password hashes included, in plain text"
    rationale: anyone on the network can read the account database, including password hashes, and crack them offline
    fix: run “systemctl disable --now {subject}”, and move the accounts it serves to LDAP over TLS or to local files
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/ypserv.8.html
    references:
      - {title: Lynis INSE-8316, url: "https://cisofy.com/lynis/controls/INSE-8316/"}
    tags: [services, cis-ubuntu-26.04:2.1.10, dev-sec-linux-baseline:package-05, lynis, cis-controls-v8:4.8, iso-27001-2022:A8.9, nist-800-171-r2:3.4.7, nist-800-171-r3:03.04.06, nist-800-53:CM-6, nist-800-53:CM-7, pci-dss-4:1.2.5, pci-dss-4:2.2.4, pci-dss-4:6.4.1]
  plaintext-servers/tftp-unit:
    title: A TFTP server is enabled or running
    fact: systemd.state.*
    keys: {enum: [tftpd-hpa.service, atftpd.service, atftpd.socket, tftp.service, tftp.socket]}
    expect: *off
    severity: warning
    score: 5.0
    message: "{subject} is enabled or running, so anyone who reaches UDP port 69 reads, and where it allows writes, the files it serves with no password at all"
    rationale: anyone on the network can read, and sometimes overwrite, the served files without logging in
    fix: run “systemctl disable --now {subject}”, unless the host boots others over the network, and then bind it to that network alone
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/in.tftpd.8.html
    references:
      - {title: Lynis INSE-8320, url: "https://cisofy.com/lynis/controls/INSE-8320/"}
    tags: [services, cis-ubuntu-26.04:2.1.17, dev-sec-linux-baseline:package-06, lynis, cis-controls-v8:4.8, iso-27001-2022:A8.9, nist-800-171-r2:3.4.7, nist-800-171-r3:03.04.06, nist-800-53:CM-6, nist-800-53:CM-7, pci-dss-4:1.2.5, pci-dss-4:2.2.4, pci-dss-4:6.4.1]
  plaintext-servers/login-unit:
    title: A telnet, rsh, rlogin or rexec server is enabled or running
    fact: systemd.state.*
    keys: {enum: [telnet.socket, rsh.socket, rlogin.socket, rexec.socket]}
    expect: *off
    severity: error
    score: 7.5
    message: "{subject} is enabled or running, so logins and their passwords cross the network in plain text, and rsh and rlogin trust whole hosts"
    rationale: anyone watching the network can read passwords as they are typed, and trusted hosts can log in without one
    fix: run “systemctl disable --now {subject}”, and log in over SSH instead
    docs: https://manpages.ubuntu.com/manpages/resolute/man1/ssh.1.html
    references:
      - {title: Lynis INSE-8304, url: "https://cisofy.com/lynis/controls/INSE-8304/"}
      - {title: Lynis INSE-8322, url: "https://cisofy.com/lynis/controls/INSE-8322/"}
    tags: [services, cis-ubuntu-26.04:2.1.16, stig-ubuntu-26.04:UBTU-24-100030, stig-ubuntu-26.04:UBTU-24-100040, dev-sec-linux-baseline:package-02, dev-sec-linux-baseline:package-03, lynis, cis-controls-v8:4.8, iso-27001-2022:A8.9, nist-800-171-r2:3.4.7, nist-800-171-r3:03.04.06, nist-800-53:CM-6, nist-800-53:CM-7, pci-dss-4:1.2.5, pci-dss-4:2.2.4, pci-dss-4:6.4.1]
  plaintext-servers/inetd:
    title: inetd serves a plain-text or debugging service
    fact: inetd.services.*.path
    keys: {pattern: "^(.*:)?(telnet|login|shell|exec|tftp|talk|ntalk|echo|discard|chargen|daytime|time)$"}
    when:
      systemd.state:
        anyOf:
          - required: [inetd.service]
            properties:
              inetd.service: &running
                anyOf:
                  - {properties: {enabled: {const: true}}, required: [enabled]}
                  - {properties: {active: {const: active}}, required: [active]}
          - {required: [openbsd-inetd.service], properties: {openbsd-inetd.service: *running}}
          - {required: [inetutils-inetd.service], properties: {inetutils-inetd.service: *running}}
    expect: {not: {}}
    severity: error
    score: 7.0
    message: "{subject} is switched on in {got} and inetd runs, so anyone who reaches its port talks to it in plain text: telnet, rlogin, rsh and rexec carry passwords, tftp has none, and chargen, echo and the other debugging services reflect floods at a third host"
    rationale: anyone watching the network can read passwords as they are typed, and the host can be used to flood others with traffic
    fix:
      - Comment the line out in {got}, as “update-inetd --disable {subject}” does.
      - Then run “systemctl reload” on the inetd unit.
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/update-inetd.8.html
    references:
      - {title: Lynis INSE-8002, url: "https://cisofy.com/lynis/controls/INSE-8002/"}
      - {title: Lynis INSE-8016, url: "https://cisofy.com/lynis/controls/INSE-8016/"}
    tags: [services, cis-ubuntu-26.04:2.1.16, cis-ubuntu-26.04:2.1.17, stig-ubuntu-26.04:UBTU-24-100030, stig-ubuntu-26.04:UBTU-24-100040, dev-sec-linux-baseline:package-01, dev-sec-linux-baseline:package-02, dev-sec-linux-baseline:package-03, dev-sec-linux-baseline:package-06, lynis, cis-controls-v8:4.8, iso-27001-2022:A8.9, nist-800-171-r2:3.4.7, nist-800-171-r3:03.04.06, nist-800-53:CM-6, nist-800-53:CM-7, pci-dss-4:1.2.5, pci-dss-4:2.2.4, pci-dss-4:6.4.1]
  plaintext-servers/xinetd:
    title: xinetd serves a plain-text or debugging service
    fact: xinetd.services.*
    when:
      xinetd.services.*.service: {contains: {pattern: "^(chargen|daytime|discard|echo|time)(-dgram|-stream|-udp)?$|^(ntalk|talk|rexec|rlogin|rsh|login|shell|exec|telnet|tftp)$"}}
      xinetd.conf: {additionalProperties: {not: {anyOf: [{required: [enabled]}, {required: [disabled]}]}}}
      systemd.state: {required: [xinetd.service], properties: {xinetd.service: *running}}
    expect: {properties: {disable: {contains: {const: "yes"}}}, required: [disable]}
    severity: error
    score: 7.0
    message: "{subject} lacks disable = yes and xinetd runs, so anyone who reaches its port talks to it in plain text: telnet, rlogin, rsh and rexec carry passwords, tftp has none, and chargen, echo and the other debugging services reflect floods at a third host"
    rationale: anyone watching the network can read passwords as they are typed, and the host can be used to flood others with traffic
    fix:
      - 'Set this line in {subject}, or delete it:'
      - lines: ["disable = yes"]
      - 'Then reload the service:'
      - run: systemctl reload xinetd.service
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/xinetd.conf.5.html
    references:
      - {title: Lynis INSE-8116, url: "https://cisofy.com/lynis/controls/INSE-8116/"}
    tags: [services, cis-ubuntu-26.04:2.1.16, cis-ubuntu-26.04:2.1.17, dev-sec-linux-baseline:package-01, lynis, cis-controls-v8:4.8, iso-27001-2022:A8.9, nist-800-171-r2:3.4.7, nist-800-171-r3:03.04.06, nist-800-53:CM-6, nist-800-53:CM-7, pci-dss-4:1.2.5, pci-dss-4:2.2.4, pci-dss-4:6.4.1]
