description: environment variables that inject code, turn off TLS checks, carry credentials or open the PATH, in system files, units, services and images
topic: Services
tags: [default]
rules:
  env/ld-preload:
    title: A library is preloaded into every program
    fact: env.*.*.vars
    expect: {properties: {LD_PRELOAD: false, LD_AUDIT: false}}
    severity: error
    score: 9.0
    message: "{subject} sets {field} to {got}, so every dynamically linked program started from it loads that library first"
    rationale: a library injected into every program can read every password and secret those programs handle, and change what they do
    fix: remove “{field}”, and preload a library for one program only, in its own unit
    docs: https://man7.org/linux/man-pages/man8/ld.so.8.html
    tags: [env]
  env/ld-library-path:
    title: A library search path reaches the current directory
    fact: env.*.*.library-path
    when: {env.*.*.vars: {required: [LD_LIBRARY_PATH]}}
    expect: {items: {pattern: "^/"}}
    severity: warning
    score: 6.0
    message: "{subject} puts {got} in LD_LIBRARY_PATH, an empty or relative entry, so programs started from it load libraries from whatever directory is current"
    rationale: anyone who can drop a file in the current directory gets their own library loaded into the program, and with it that program’s rights
    fix: drop the entry from “LD_LIBRARY_PATH”, a trailing colon included, or make it absolute
    docs: https://man7.org/linux/man-pages/man8/ld.so.8.html
    tags: [env]
  env/python-path:
    title: A Python module path reaches the current directory
    fact: env.*.*.python-path
    when: {env.*.*.vars: {required: [PYTHONPATH]}}
    expect: {items: {pattern: "^/"}}
    severity: warning
    score: 5.5
    message: "{subject} puts {got} in PYTHONPATH, an empty or relative entry, so Python imports modules from whatever directory is current"
    rationale: anyone who can drop a file named like a standard module in the current directory gets their code run by Python
    fix: drop the entry from “PYTHONPATH”, or make it absolute
    docs: https://docs.python.org/3/using/cmdline.html#envvar-PYTHONPATH
    tags: [env]
  env/interpreter-injection:
    title: An interpreter loads code from an extra place
    fact: env.*.*.vars
    expect:
      properties:
        NODE_OPTIONS: {not: {pattern: "(^|\\s)(--require|--import|--loader|--experimental-loader|-r)(=|\\s|$)"}}
        PYTHONSTARTUP: false
        PERL5OPT: false
        RUBYOPT: false
        JAVA_TOOL_OPTIONS: false
        BASH_ENV: false
        PROMPT_COMMAND: false
    severity: warning
    score: 5.5
    message: "{subject} sets {field}, so the interpreter runs code from the place it names before the program’s own"
    rationale: the interpreter runs code from a location other than the program’s own, so whoever can write there runs commands as that program
    fix: remove “{field}”, or set it in the one unit that needs it
    docs: https://attack.mitre.org/techniques/T1574/
    tags: [env]
  env/tls-verify:
    title: TLS certificate checks are turned off
    fact: env.*.*.vars
    expect:
      properties:
        NODE_TLS_REJECT_UNAUTHORIZED: {not: {const: "0"}}
        PYTHONHTTPSVERIFY: {not: {const: "0"}}
        GIT_SSL_NO_VERIFY: false
    severity: error
    score: 8.5
    message: "{subject} sets {field} to {got}, which turns off TLS certificate checks for every program that reads it"
    rationale: anyone on the network path can impersonate the server, so passwords and data go to an attacker unnoticed
    fix:
      - Remove “{field}”.
      - Add the missing CA to the system store instead.
    docs: https://nodejs.org/api/cli.html#node_tls_reject_unauthorizedvalue
    tags: [env]
  env/ca-override:
    title: The TLS trust store is overridden
    fact: env.*.*.vars
    expect: {properties: {CURL_CA_BUNDLE: false, SSL_CERT_FILE: false, SSL_CERT_DIR: false, REQUESTS_CA_BUNDLE: false}}
    severity: info
    score: 2.5
    message: "{subject} sets {field} to {got}, so TLS trusts those certificates instead of the system store"
    rationale: the system’s trusted authorities are bypassed, so whoever holds a key for one of those certificates can impersonate any server
    fix:
      - Add the CA to “/usr/local/share/ca-certificates”.
      - 'Then update the system store:'
      - run: update-ca-certificates
      - Then remove “{field}”.
    docs: https://curl.se/docs/sslcerts.html
    tags: [env]
  env/proxy-http:
    title: A proxy is reached over plain HTTP
    fact: env.*.*.vars
    expect:
      patternProperties:
        "(?i)^(https?|all)_proxy$": {not: {allOf: [{pattern: "^(?i:http)://"}, {not: {pattern: "^(?i:http)://([^@/]*@)?(localhost|127\\.|\\[::1\\])"}}]}}
    severity: info
    score: 3.0
    message: "{subject} sends traffic through the proxy {got} over plain HTTP, so plain requests and any proxy password cross the network readable"
    rationale: anyone on the path to the proxy can read the requests and steal any proxy password sent
    fix: point “{field}” at an “https://” proxy, or at one on localhost
    docs: https://everything.curl.dev/usingcurl/proxies/env.html
    tags: [env]
  env/secret-name:
    title: A credential is set in configuration
    fact: env.*.*.vars
    when: {env.*.*.kind: {enum: [file, unit, image]}}
    expect:
      patternProperties:
        "(?i)(secret|token|passw(or)?d|api_?key|private_?key|access_?key|credential)": {pattern: "^(?i:|true|false|yes|no|on|off|0|1)$"}
    severity: warning
    score: 6.5
    message: "{subject} sets {field}, a credential, in configuration that services, logs and image pulls read in full"
    rationale: any service, log or image pull that reads the configuration also sees the credential, so it can leak to places it was never meant to reach
    fix: move “{field}” to a systemd credential (“LoadCredential=”), a 0600 file read at start, or a secret store
    docs: https://systemd.io/CREDENTIALS/
    tags: [env]
  env/path-entry:
    title: A PATH entry is relative or empty
    fact: env.*.*.path
    when: {env.*.*.vars: {required: [PATH]}}
    expect: {items: {pattern: "^/"}}
    severity: warning
    score: 6.0
    message: "{subject} puts {got} in PATH, a relative or empty entry, so a command runs from whatever directory is current"
    rationale: anyone who can drop a file in the current directory can plant a program that runs in place of a real command such as ls or sudo
    fix: drop the entry from “PATH”, or make it absolute
    docs: https://pubs.opengroup.org/onlinepubs/9799919799/basedefs/V1_chap08.html
    tags: [env]
