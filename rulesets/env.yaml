description: environment variables that inject code, turn off TLS checks, carry credentials or open the PATH, in system files, units, services and images
rules:
  env/ld-preload:
    fact: env.*.*.vars
    expect: {properties: {LD_PRELOAD: false, LD_AUDIT: false}}
    severity: error
    message: "{subject} sets {field} to {got}, so every dynamically linked program started from it loads that library first"
    fix: remove {field} from {subject}; preload a library for one program only, in its own unit
    docs: https://man7.org/linux/man-pages/man8/ld.so.8.html
    tags: [env]
  env/ld-library-path:
    fact: env.*.*.vars
    expect: {properties: {LD_LIBRARY_PATH: false}}
    severity: warning
    message: "{subject} sets LD_LIBRARY_PATH to {got}, so programs started from it load libraries from there before the system’s"
    fix: remove LD_LIBRARY_PATH from {subject}; register the directory in /etc/ld.so.conf.d, or set it for one program only
    docs: https://man7.org/linux/man-pages/man8/ld.so.8.html
    tags: [env]
  env/interpreter-injection:
    fact: env.*.*.vars
    expect:
      properties:
        NODE_OPTIONS: {not: {pattern: "(^|\\s)(--require|--import|--loader|--experimental-loader|-r)(=|\\s|$)"}}
        PYTHONPATH: false
        PYTHONSTARTUP: false
        PERL5OPT: false
        RUBYOPT: false
        JAVA_TOOL_OPTIONS: false
        BASH_ENV: false
        PROMPT_COMMAND: false
    severity: warning
    message: "{subject} sets {field}, so the interpreter runs code from the place it names before the program’s own"
    fix: remove {field} from {subject}, or set it in the one unit that needs it
    docs: https://attack.mitre.org/techniques/T1574/
    tags: [env]
  env/tls-verify:
    fact: env.*.*.vars
    expect:
      properties:
        NODE_TLS_REJECT_UNAUTHORIZED: {not: {const: "0"}}
        PYTHONHTTPSVERIFY: {not: {const: "0"}}
        GIT_SSL_NO_VERIFY: false
    severity: error
    message: "{subject} sets {field} to {got}, which turns off TLS certificate checks for every program that reads it"
    fix: remove {field} from {subject}, and add the missing CA to the system store instead
    docs: https://nodejs.org/api/cli.html#node_tls_reject_unauthorizedvalue
    tags: [env]
  env/ca-override:
    fact: env.*.*.vars
    expect: {properties: {CURL_CA_BUNDLE: false, SSL_CERT_FILE: false, SSL_CERT_DIR: false, REQUESTS_CA_BUNDLE: false}}
    severity: info
    message: "{subject} sets {field} to {got}, so TLS trusts those certificates instead of the system store"
    fix: add the CA to /usr/local/share/ca-certificates and run update-ca-certificates, then remove {field} from {subject}
    docs: https://curl.se/docs/sslcerts.html
    tags: [env]
  env/proxy-http:
    fact: env.*.*.vars
    expect:
      patternProperties:
        "(?i)^(https?|all)_proxy$": {not: {allOf: [{pattern: "^(?i:http)://"}, {not: {pattern: "^(?i:http)://([^@/]*@)?(localhost|127\\.|\\[::1\\])"}}]}}
    severity: info
    message: "{subject} sends traffic through the proxy {got} over plain HTTP, so plain requests and any proxy password cross the network readable"
    fix: point {field} at an https:// proxy, or one on localhost
    docs: https://everything.curl.dev/usingcurl/proxies/env.html
    tags: [env]
  env/secret-name:
    fact: env.*.*.vars
    when: {env.*.*.kind: {enum: [file, unit, image]}}
    expect:
      patternProperties:
        "(?i)(secret|token|passw(or)?d|api_?key|private_?key|access_?key|credential)": {const: ""}
    severity: warning
    message: "{subject} sets {field}, a credential, in configuration that services, logs and image pulls read in full"
    fix: move {field} to a systemd credential (LoadCredential=), a 0600 file read at start, or a secret store
    docs: https://systemd.io/CREDENTIALS/
    tags: [env]
  env/path-entry:
    fact: env.*.*.path
    when: {env.*.*.vars: {required: [PATH]}}
    expect: {items: {pattern: "^/"}}
    severity: warning
    message: "{subject} puts {got} in PATH, a relative or empty entry, so a command runs from whatever directory is current"
    fix: drop the entry from PATH in {subject}, or make it absolute
    docs: https://pubs.opengroup.org/onlinepubs/9799919799/basedefs/V1_chap08.html
    tags: [env]
