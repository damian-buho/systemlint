        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b64'}, {properties: {"-S": {contains: {const: open}}}}, {$ref: '#/$defs/eacces'}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b64'}, {properties: {"-S": {contains: {const: openat}}}}, {$ref: '#/$defs/eacces'}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b64'}, {properties: {"-S": {contains: {const: truncate}}}}, {$ref: '#/$defs/eacces'}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b64'}, {properties: {"-S": {contains: {const: ftruncate}}}}, {$ref: '#/$defs/eacces'}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b32'}, {properties: {"-S": {contains: {const: creat}}}}, {$ref: '#/$defs/eacces'}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b32'}, {properties: {"-S": {contains: {const: open}}}}, {$ref: '#/$defs/eacces'}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b32'}, {properties: {"-S": {contains: {const: openat}}}}, {$ref: '#/$defs/eacces'}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b32'}, {properties: {"-S": {contains: {const: truncate}}}}, {$ref: '#/$defs/eacces'}]}}}}
