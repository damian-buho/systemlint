    fact: audit.*
    expect:
      $defs: *defs
      allOf:
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b64'}, {properties: {"-S": {contains: {const: creat}}}}, {$ref: '#/$defs/eacces'}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b64'}, {properties: {"-S": {contains: {const: open}}}}, {$ref: '#/$defs/eacces'}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b64'}, {properties: {"-S": {contains: {const: openat}}}}, {$ref: '#/$defs/eacces'}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b64'}, {properties: {"-S": {contains: {const: truncate}}}}, {$ref: '#/$defs/eacces'}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b64'}, {properties: {"-S": {contains: {const: ftruncate}}}}, {$ref: '#/$defs/eacces'}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b32'}, {properties: {"-S": {contains: {const: creat}}}}, {$ref: '#/$defs/eacces'}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b32'}, {properties: {"-S": {contains: {const: open}}}}, {$ref: '#/$defs/eacces'}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b32'}, {properties: {"-S": {contains: {const: openat}}}}, {$ref: '#/$defs/eacces'}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b32'}, {properties: {"-S": {contains: {const: truncate}}}}, {$ref: '#/$defs/eacces'}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b32'}, {properties: {"-S": {contains: {const: ftruncate}}}}, {$ref: '#/$defs/eacces'}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b64'}, {properties: {"-S": {contains: {const: creat}}}}, {$ref: '#/$defs/eperm'}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b64'}, {properties: {"-S": {contains: {const: open}}}}, {$ref: '#/$defs/eperm'}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b64'}, {properties: {"-S": {contains: {const: openat}}}}, {$ref: '#/$defs/eperm'}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b64'}, {properties: {"-S": {contains: {const: truncate}}}}, {$ref: '#/$defs/eperm'}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b64'}, {properties: {"-S": {contains: {const: ftruncate}}}}, {$ref: '#/$defs/eperm'}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b32'}, {properties: {"-S": {contains: {const: creat}}}}, {$ref: '#/$defs/eperm'}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b32'}, {properties: {"-S": {contains: {const: open}}}}, {$ref: '#/$defs/eperm'}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b32'}, {properties: {"-S": {contains: {const: openat}}}}, {$ref: '#/$defs/eperm'}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b32'}, {properties: {"-S": {contains: {const: truncate}}}}, {$ref: '#/$defs/eperm'}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b32'}, {properties: {"-S": {contains: {const: ftruncate}}}}, {$ref: '#/$defs/eperm'}]}}}}
    severity: info
    score: 1.5
    message: "{subject}: no audit rule records creat, open, openat, truncate or ftruncate failing with EACCES or EPERM on both architectures, so such a change leaves no trace for an investigation"
    rationale: an intruder probing for files they may not touch leaves no sign of the attempts, so a break-in in progress goes unseen
    fix:
      - 'Add these lines to a file ending in “.rules” under “/etc/audit/rules.d/”:'
      - lines: ["-a always,exit -F arch=b64 -S creat,open,openat,truncate,ftruncate -F exit=-EACCES -k access", "-a always,exit -F arch=b32 -S creat,open,openat,truncate,ftruncate -F exit=-EACCES -k access", "-a always,exit -F arch=b64 -S creat,open,openat,truncate,ftruncate -F exit=-EPERM -k access", "-a always,exit -F arch=b32 -S creat,open,openat,truncate,ftruncate -F exit=-EPERM -k access"]
      - 'Load them now:'
      - run: augenrules --load
    docs: https://man7.org/linux/man-pages/man7/audit.rules.7.html
    tags: [audit, cis-ubuntu-26.04:6.2.3.11, stig-ubuntu-26.04:UBTU-24-900160, cis-controls-v8:8.5, iso-27001-2022:A5.28, iso-27001-2022:A8.15, nist-800-171-r3:03.03.02, nist-800-53:AU-12, nist-800-53:AU-3, nist-800-53:AU-3(1), nist-800-53:AU-7, nist-800-53:SI-4(20), pci-dss-4:10.199999999999999, pci-dss-4:10.2.1, pci-dss-4:10.2.1.2, pci-dss-4:10.2.1.5, pci-dss-4:9.4.5]
