        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b32'}, {properties: {"-S": {contains: {const: sethostname}}}}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b32'}, {properties: {"-S": {contains: {const: setdomainname}}}}]}}}}
