  audit/network-manager:
    title: NetworkManager configuration changes go unaudited
    fact: audit.*
    expect:
      $defs: *defs
      allOf:
        - not: {additionalProperties: {not: {contains: {anyOf: [{$ref: '#/$defs/watch-wa', properties: {"-w": {contains: {enum: [/etc/NetworkManager, /etc/NetworkManager/]}}}}, {$ref: '#/$defs/write', properties: {"-F": {contains: {enum: [dir=/etc/NetworkManager, dir=/etc/NetworkManager/]}}}}]}}}}
    severity: info
    score: 1.0
    message: "{subject}: no audit rule records writes to /etc/NetworkManager, so such a change leaves no trace for an investigation"
    rationale: changed NetworkManager settings can reroute or expose the host’s traffic with no record of who changed them
    fix:
      - 'Add these lines to a file ending in “.rules” under “/etc/audit/rules.d/”:'
      - lines: ["-a always,exit -F arch=b64 -F dir=/etc/NetworkManager -F perm=wa -k system-locale"]
      - 'Load them now:'
