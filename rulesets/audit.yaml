description: Kernel audit rules that leave security-relevant changes unrecorded, on disk and loaded
topic: Logging and auditing
tags: [default]
when: {auditd.binary: {minProperties: 1}}
rules:
  audit/sudoers:
    title: sudoers changes go unaudited
    fact: audit.*
    expect:
      $defs: &defs
        exit: {required: ["-a"], properties: {"-a": {allOf: [{contains: {const: always}}, {contains: {const: exit}}]}}}
        watch-wa: {required: ["-w", "-p"], properties: {"-p": {contains: {allOf: [{pattern: w}, {pattern: a}]}}}}
        write: {$ref: '#/$defs/exit', required: ["-F"], properties: {"-F": {contains: {allOf: [{pattern: '^perm=[rwxa]*w'}, {pattern: '^perm=[rwxa]*a'}]}}}}
        watch-x: {required: ["-w", "-p"], properties: {"-p": {contains: {pattern: x}}}}
        run: {$ref: '#/$defs/exit', required: ["-F"], properties: {"-F": {contains: {pattern: '^perm=[rwxa]*x'}}}}
        any: {$ref: '#/$defs/exit', required: ["-S"]}
        b64: {$ref: '#/$defs/exit', required: ["-F", "-S"], properties: {"-F": {contains: {const: arch=b64}}}}
        b32: {$ref: '#/$defs/exit', required: ["-F", "-S"], properties: {"-F": {contains: {const: arch=b32}}}}
        eacces: {properties: {"-F": {not: {contains: {allOf: [{pattern: '^exit='}, {not: {const: exit=-EACCES}}]}}}}}
        eperm: {properties: {"-F": {not: {contains: {allOf: [{pattern: '^exit='}, {not: {const: exit=-EPERM}}]}}}}}
      allOf:
        - not: {additionalProperties: {not: {contains: {anyOf: [{$ref: '#/$defs/watch-wa', properties: {"-w": {contains: {const: /etc/sudoers}}}}, {$ref: '#/$defs/write', properties: {"-F": {contains: {const: path=/etc/sudoers}}}}]}}}}
        - not: {additionalProperties: {not: {contains: {anyOf: [{$ref: '#/$defs/watch-wa', properties: {"-w": {contains: {enum: [/etc/sudoers.d, /etc/sudoers.d/]}}}}, {$ref: '#/$defs/write', properties: {"-F": {contains: {enum: [dir=/etc/sudoers.d, dir=/etc/sudoers.d/]}}}}]}}}}
    severity: info
    score: 2.0
    message: "{subject}: no audit rule records writes to /etc/sudoers or /etc/sudoers.d, so such a change leaves no trace for an investigation"
    fix:
      - 'Add these lines to a file ending in “.rules” under “/etc/audit/rules.d/”:'
      - lines: ["-a always,exit -F arch=b64 -F path=/etc/sudoers -F perm=wa -k scope", "-a always,exit -F arch=b64 -F dir=/etc/sudoers.d -F perm=wa -k scope"]
      - 'Load them now:'
      - run: augenrules --load
    docs: https://man7.org/linux/man-pages/man7/audit.rules.7.html
    tags: [audit, cis-ubuntu-26.04:6.2.3.1, stig-ubuntu-26.04:UBTU-24-900510, stig-ubuntu-26.04:UBTU-24-900520]
  audit/user-emulation:
    title: Commands run as another user go unaudited
    fact: audit.*
    expect:
      $defs: *defs
      allOf:
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b64'}, {properties: {"-S": {contains: {const: execve}}}}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b32'}, {properties: {"-S": {contains: {const: execve}}}}]}}}}
    severity: info
    score: 2.0
    message: "{subject}: no audit rule records execve on both architectures, so such a change leaves no trace for an investigation"
    fix:
      - 'Add these lines to a file ending in “.rules” under “/etc/audit/rules.d/”:'
      - lines: ["-a always,exit -F arch=b64 -S execve -k user_emulation", "-a always,exit -F arch=b32 -S execve -k user_emulation"]
      - 'Load them now:'
      - run: augenrules --load
    docs: https://man7.org/linux/man-pages/man7/audit.rules.7.html
    tags: [audit, cis-ubuntu-26.04:6.2.3.2, stig-ubuntu-26.04:UBTU-24-200580]
