    title: Clock changes go unaudited
    fact: audit.*
    expect:
      $defs: *defs
      allOf:
        - not: {additionalProperties: {not: {contains: {anyOf: [{$ref: '#/$defs/watch-wa', properties: {"-w": {contains: {const: /etc/localtime}}}}, {$ref: '#/$defs/write', properties: {"-F": {contains: {const: path=/etc/localtime}}}}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/any'}, {properties: {"-S": {contains: {const: adjtimex}}}}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/any'}, {properties: {"-S": {contains: {const: settimeofday}}}}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/any'}, {properties: {"-S": {contains: {const: clock_settime}}}}]}}}}
    severity: info
    score: 2.0
    message: "{subject}: no audit rule records adjtimex, settimeofday, clock_settime or writes to /etc/localtime, so such a change leaves no trace for an investigation"
    fix:
      - 'Add these lines to a file ending in “.rules” under “/etc/audit/rules.d/”:'
      - lines: ["-a always,exit -F arch=b64 -F path=/etc/localtime -F perm=wa -k time-change", "-a always,exit -F arch=b64 -S adjtimex,settimeofday,clock_settime -k time-change"]
      - 'Load them now:'
      - run: augenrules --load
    docs: https://man7.org/linux/man-pages/man7/audit.rules.7.html
    tags: [audit, cis-ubuntu-26.04:6.2.3.4]
