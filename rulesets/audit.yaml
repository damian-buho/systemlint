description: Kernel audit rules that leave security-relevant changes unrecorded, on disk and loaded
topic: Logging and auditing
tags: [default]
when: {auditd.binary: {minProperties: 1}}
rules:
  audit/sudoers:
    title: sudoers changes go unaudited
    fact: audit.*
    expect:
      $defs: &defs
        exit: {required: ["-a"], properties: {"-a": {allOf: [{contains: {const: always}}, {contains: {const: exit}}]}}}
        watch-wa: {required: ["-w", "-p"], properties: {"-p": {contains: {allOf: [{pattern: w}, {pattern: a}]}}}}
        write: {$ref: '#/$defs/exit', required: ["-F"], properties: {"-F": {contains: {allOf: [{pattern: '^perm=[rwxa]*w'}, {pattern: '^perm=[rwxa]*a'}]}}}}
        watch-x: {required: ["-w", "-p"], properties: {"-p": {contains: {pattern: x}}}}
        run: {$ref: '#/$defs/exit', required: ["-F"], properties: {"-F": {contains: {pattern: '^perm=[rwxa]*x'}}}}
        any: {$ref: '#/$defs/exit', required: ["-S"]}
        b64: {$ref: '#/$defs/exit', required: ["-F", "-S"], properties: {"-F": {contains: {const: arch=b64}}}}
        b32: {$ref: '#/$defs/exit', required: ["-F", "-S"], properties: {"-F": {contains: {const: arch=b32}}}}
        eacces: {properties: {"-F": {not: {contains: {allOf: [{pattern: '^exit='}, {not: {const: exit=-EACCES}}]}}}}}
        eperm: {properties: {"-F": {not: {contains: {allOf: [{pattern: '^exit='}, {not: {const: exit=-EPERM}}]}}}}}
      allOf:
        - not: {additionalProperties: {not: {contains: {anyOf: [{$ref: '#/$defs/watch-wa', properties: {"-w": {contains: {const: /etc/sudoers}}}}, {$ref: '#/$defs/write', properties: {"-F": {contains: {const: path=/etc/sudoers}}}}]}}}}
        - not: {additionalProperties: {not: {contains: {anyOf: [{$ref: '#/$defs/watch-wa', properties: {"-w": {contains: {enum: [/etc/sudoers.d, /etc/sudoers.d/]}}}}, {$ref: '#/$defs/write', properties: {"-F": {contains: {enum: [dir=/etc/sudoers.d, dir=/etc/sudoers.d/]}}}}]}}}}
    severity: info
    score: 1.8
    message: "{subject}: no audit rule records writes to /etc/sudoers or /etc/sudoers.d, so such a change leaves no trace for an investigation"
    rationale: an attacker who grants themselves root rights through sudoers leaves nothing in the logs to show who did it or when
    fix:
      - 'Add these lines to a file ending in “.rules” under “/etc/audit/rules.d/”:'
      - lines: ["-a always,exit -F arch=b64 -F path=/etc/sudoers -F perm=wa -k scope", "-a always,exit -F arch=b64 -F dir=/etc/sudoers.d -F perm=wa -k scope"]
      - 'Load them now:'
      - run: augenrules --load
    docs: https://man7.org/linux/man-pages/man7/audit.rules.7.html
    tags: [audit, cis-ubuntu-26.04:6.2.3.1, stig-ubuntu-26.04:UBTU-24-900510, stig-ubuntu-26.04:UBTU-24-900520, cis-controls-v8:8.5, iso-27001-2022:A5.28, iso-27001-2022:A8.15, nist-800-171-r3:03.03.02, nist-800-53:AU-12, nist-800-53:AU-3, nist-800-53:AU-3(1), nist-800-53:AU-7, nist-800-53:SI-4(20), pci-dss-4:10.199999999999999, pci-dss-4:10.2.1, pci-dss-4:10.2.1.2, pci-dss-4:10.2.1.5, pci-dss-4:9.4.5]
  audit/user-emulation:
    title: Commands run as another user go unaudited
    fact: audit.*
    expect:
      $defs: *defs
      allOf:
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b64'}, {properties: {"-S": {contains: {const: execve}}}}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b32'}, {properties: {"-S": {contains: {const: execve}}}}]}}}}
    severity: info
    score: 1.8
    message: "{subject}: no audit rule records execve on both architectures, so such a change leaves no trace for an investigation"
    rationale: a command run as another user, root included, leaves no record of who really started it
    fix:
      - 'Add these lines to a file ending in “.rules” under “/etc/audit/rules.d/”:'
      - lines: ["-a always,exit -F arch=b64 -S execve -k user_emulation", "-a always,exit -F arch=b32 -S execve -k user_emulation"]
      - 'Load them now:'
      - run: augenrules --load
    docs: https://man7.org/linux/man-pages/man7/audit.rules.7.html
    tags: [audit, cis-ubuntu-26.04:6.2.3.2, stig-ubuntu-26.04:UBTU-24-200580, cis-controls-v8:8.5, iso-27001-2022:A5.28, iso-27001-2022:A8.15, nist-800-171-r3:03.03.02, nist-800-53:AU-12, nist-800-53:AU-3, nist-800-53:AU-3(1), nist-800-53:AU-7, nist-800-53:SI-4(20), pci-dss-4:10.199999999999999, pci-dss-4:10.2.1, pci-dss-4:10.2.1.2, pci-dss-4:10.2.1.5, pci-dss-4:9.4.5]
  audit/time:
    title: Clock changes go unaudited
    fact: audit.*
    expect:
      $defs: *defs
      allOf:
        - not: {additionalProperties: {not: {contains: {anyOf: [{$ref: '#/$defs/watch-wa', properties: {"-w": {contains: {const: /etc/localtime}}}}, {$ref: '#/$defs/write', properties: {"-F": {contains: {const: path=/etc/localtime}}}}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/any'}, {properties: {"-S": {contains: {const: adjtimex}}}}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/any'}, {properties: {"-S": {contains: {const: settimeofday}}}}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/any'}, {properties: {"-S": {contains: {const: clock_settime}}}}]}}}}
    severity: info
    score: 1.5
    message: "{subject}: no audit rule records adjtimex, settimeofday, clock_settime or writes to /etc/localtime, so such a change leaves no trace for an investigation"
    rationale: an attacker can move the clock to make log entries look older or newer than they are, and nothing shows it happened
    fix:
      - 'Add these lines to a file ending in “.rules” under “/etc/audit/rules.d/”:'
      - lines: ["-a always,exit -F arch=b64 -F path=/etc/localtime -F perm=wa -k time-change", "-a always,exit -F arch=b64 -S adjtimex,settimeofday,clock_settime -k time-change"]
      - 'Load them now:'
      - run: augenrules --load
    docs: https://man7.org/linux/man-pages/man7/audit.rules.7.html
    tags: [audit, cis-ubuntu-26.04:6.2.3.4, cis-controls-v8:8.5, iso-27001-2022:A5.28, iso-27001-2022:A8.15, nist-800-171-r3:03.03.02, nist-800-53:AU-12, nist-800-53:AU-3, nist-800-53:AU-3(1), nist-800-53:AU-7, nist-800-53:SI-4(20), pci-dss-4:10.199999999999999, pci-dss-4:10.2.1, pci-dss-4:10.2.1.2, pci-dss-4:10.2.1.5, pci-dss-4:9.4.5]
  audit/host-name:
    title: Host name changes go unaudited
    fact: audit.*
    expect:
      $defs: *defs
      allOf:
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b64'}, {properties: {"-S": {contains: {const: sethostname}}}}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b64'}, {properties: {"-S": {contains: {const: setdomainname}}}}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b32'}, {properties: {"-S": {contains: {const: sethostname}}}}]}}}}
        - not: {additionalProperties: {not: {contains: {allOf: [{$ref: '#/$defs/b32'}, {properties: {"-S": {contains: {const: setdomainname}}}}]}}}}
    severity: info
    score: 1.0
    message: "{subject}: no audit rule records sethostname or setdomainname on both architectures, so such a change leaves no trace for an investigation"
    rationale: a host renamed to look like another machine leaves no record, so logs from it can be mistaken for that machine’s
    fix:
      - 'Add these lines to a file ending in “.rules” under “/etc/audit/rules.d/”:'
      - lines: ["-a always,exit -F arch=b64 -S sethostname,setdomainname -k system-locale", "-a always,exit -F arch=b32 -S sethostname,setdomainname -k system-locale"]
      - 'Load them now:'
      - run: augenrules --load
    docs: https://man7.org/linux/man-pages/man7/audit.rules.7.html
    tags: [audit, cis-ubuntu-26.04:6.2.3.5, cis-controls-v8:8.5, iso-27001-2022:A5.28, iso-27001-2022:A8.15, nist-800-171-r3:03.03.02, nist-800-53:AU-12, nist-800-53:AU-3, nist-800-53:AU-3(1), nist-800-53:AU-7, nist-800-53:SI-4(20), pci-dss-4:10.199999999999999, pci-dss-4:10.2.1, pci-dss-4:10.2.1.2, pci-dss-4:10.2.1.5, pci-dss-4:9.4.5]
  audit/issue:
    title: Login banner changes go unaudited
    fact: audit.*
    expect:
      $defs: *defs
      allOf:
        - not: {additionalProperties: {not: {contains: {anyOf: [{$ref: '#/$defs/watch-wa', properties: {"-w": {contains: {const: /etc/issue}}}}, {$ref: '#/$defs/write', properties: {"-F": {contains: {const: path=/etc/issue}}}}]}}}}
        - not: {additionalProperties: {not: {contains: {anyOf: [{$ref: '#/$defs/watch-wa', properties: {"-w": {contains: {const: /etc/issue.net}}}}, {$ref: '#/$defs/write', properties: {"-F": {contains: {const: path=/etc/issue.net}}}}]}}}}
    severity: info
    score: 1.0
    message: "{subject}: no audit rule records writes to /etc/issue or /etc/issue.net, so such a change leaves no trace for an investigation"
    rationale: a changed login banner, such as a false notice or a fake prompt, leaves no record of who edited it
    fix:
      - 'Add these lines to a file ending in “.rules” under “/etc/audit/rules.d/”:'
      - lines: ["-a always,exit -F arch=b64 -F path=/etc/issue -F perm=wa -k system-locale", "-a always,exit -F arch=b64 -F path=/etc/issue.net -F perm=wa -k system-locale"]
      - 'Load them now:'
      - run: augenrules --load
    docs: https://man7.org/linux/man-pages/man7/audit.rules.7.html
    tags: [audit, cis-ubuntu-26.04:6.2.3.6, cis-controls-v8:8.5, iso-27001-2022:A5.28, iso-27001-2022:A8.15, nist-800-171-r3:03.03.02, nist-800-53:AU-12, nist-800-53:AU-3, nist-800-53:AU-3(1), nist-800-53:AU-7, nist-800-53:SI-4(20), pci-dss-4:10.199999999999999, pci-dss-4:10.2.1, pci-dss-4:10.2.1.2, pci-dss-4:10.2.1.5, pci-dss-4:9.4.5]
  audit/hosts:
