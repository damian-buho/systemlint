      allOf:
        - not: {additionalProperties: {not: {contains: {anyOf: [{$ref: '#/$defs/watch-wa', properties: {"-w": {contains: {const: /etc/hosts}}}}, {$ref: '#/$defs/write', properties: {"-F": {contains: {const: path=/etc/hosts}}}}]}}}}
        - not: {additionalProperties: {not: {contains: {anyOf: [{$ref: '#/$defs/watch-wa', properties: {"-w": {contains: {const: /etc/hostname}}}}, {$ref: '#/$defs/write', properties: {"-F": {contains: {const: path=/etc/hostname}}}}]}}}}
    severity: info
    score: 1.0
    message: "{subject}: no audit rule records writes to /etc/hosts or /etc/hostname, so such a change leaves no trace for an investigation"
    rationale: an edited hosts file can silently send a name such as a bank or update server to an attacker’s address, with no record of who did it
    fix:
      - 'Add these lines to a file ending in “.rules” under “/etc/audit/rules.d/”:'
      - lines: ["-a always,exit -F arch=b64 -F path=/etc/hosts -F perm=wa -k system-locale", "-a always,exit -F arch=b64 -F path=/etc/hostname -F perm=wa -k system-locale"]
      - 'Load them now:'
      - run: augenrules --load
    docs: https://man7.org/linux/man-pages/man7/audit.rules.7.html
    tags: [audit, cis-ubuntu-26.04:6.2.3.7, cis-controls-v8:8.5, iso-27001-2022:A5.28, iso-27001-2022:A8.15, nist-800-171-r3:03.03.02, nist-800-53:AU-12, nist-800-53:AU-3, nist-800-53:AU-3(1), nist-800-53:AU-7, nist-800-53:SI-4(20), pci-dss-4:10.199999999999999, pci-dss-4:10.2.1, pci-dss-4:10.2.1.2, pci-dss-4:10.2.1.5, pci-dss-4:9.4.5]
