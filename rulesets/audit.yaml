    title: audit rules stop loading at the first error
    fact: audit.rules
    expect: {not: {additionalProperties: {not: {contains: {required: ["-c"]}}}}}
    severity: info
    score: 2.0
    message: "no file in /etc/audit/rules.d holds -c, so one rule auditctl rejects keeps every rule after it from loading"
    rationale: a single rule the kernel rejects, such as after an update, leaves every later rule silently unloaded and large parts of the system unaudited
    fix:
      - 'Add this line to a file ending in “.rules” under “/etc/audit/rules.d/”, such as “/etc/audit/rules.d/01-initialize.rules”:'
      - lines: ["-c"]
      - 'Load it now:'
      - run: augenrules --load
    docs: https://man7.org/linux/man-pages/man8/auditctl.8.html
    tags: [audit, cis-ubuntu-26.04:6.2.3.34, cis-controls-v8:8.5, iso-27001-2022:A5.28, iso-27001-2022:A8.15, nist-800-171-r3:03.03.02, nist-800-53:AU-12, nist-800-53:AU-3, nist-800-53:AU-3(1), nist-800-53:AU-7, nist-800-53:SI-4(20), pci-dss-4:10.199999999999999, pci-dss-4:10.2.1, pci-dss-4:10.2.1.2, pci-dss-4:10.2.1.5, pci-dss-4:9.4.5]
  audit/immutable:
    title: Audit rules are left mutable
    fact: audit.rules
    expect:
      allOf:
        - not: {additionalProperties: {not: {contains: {required: ["-e"], properties: {"-e": {contains: {const: 2}}}}}}}
        - additionalProperties: {not: {contains: {required: ["-e"], properties: {"-e": {contains: {enum: [0, 1]}}}}}}
    severity: warning
    score: 4.0
    message: "no file in /etc/audit/rules.d locks the rules with -e 2, or one sets -e 0 or -e 1, so root can switch auditing off and back on without a reboot to hide what it did"
    rationale: an intruder with root can switch auditing off, act, and switch it back on, leaving a gap nobody can see
    fix:
      - Remove every “-e 0” and “-e 1” line from the files under “/etc/audit/rules.d/”.
      - 'Add this line as the last line of “/etc/audit/rules.d/99-finalize.rules”:'
      - lines: ["-e 2"]
      - 'Load the rules, then reboot, since locked rules change only at boot:'
