        - not: {additionalProperties: {not: {contains: {anyOf: [{$ref: '#/$defs/watch-wa', properties: {"-w": {contains: {enum: [/etc/network/interfaces.d, /etc/network/interfaces.d/]}}}}, {$ref: '#/$defs/write', properties: {"-F": {contains: {enum: [dir=/etc/network/interfaces.d, dir=/etc/network/interfaces.d/]}}}}]}}}}
        - not: {additionalProperties: {not: {contains: {anyOf: [{$ref: '#/$defs/watch-wa', properties: {"-w": {contains: {enum: [/etc/netplan, /etc/netplan/]}}}}, {$ref: '#/$defs/write', properties: {"-F": {contains: {enum: [dir=/etc/netplan, dir=/etc/netplan/]}}}}]}}}}
    severity: info
    score: 1.0
    message: "{subject}: no audit rule records writes to /etc/network/interfaces, /etc/network/interfaces.d or /etc/netplan, so such a change leaves no trace for an investigation"
