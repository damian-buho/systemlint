description: PAM authentication stacks that let a login through without a password or without limit
tags: [default]
when: {auth.pam: {minProperties: 1}}
vars:
  faillock-deny: {default: 5}
  faillock-unlock-time: {default: 900}
  faillock-root-unlock-time: {default: 60}
  pwhistory-remember: {default: 24}
rules:
  pam/permit-sufficient:
    title: pam_permit alone authenticates
    fact: auth.pam.*
    expect:
      not:
        contains:
          required: [type, module, control]
          properties:
            type: {pattern: "(?i)^-?auth$"}
            module: {pattern: "(^|/)pam_permit\\.so$"}
            control: {pattern: "(?i)^sufficient$|(^|\\s)success=done(\\s|$)"}
    severity: error
    score: 9.0
    message: "{subject} lets pam_permit, which always succeeds, settle its auth stack, so anyone who reaches a service using it logs in without a password"
    fix: remove the pam_permit auth line from {subject}, or make it required behind a module that checks a credential
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/pam_permit.8.html
    tags: [auth, pam]
  pam/nullok:
    title: pam_unix accepts an empty password
    fact: auth.pam.*
    expect:
      not:
        contains:
          required: [type, module, arguments]
          properties:
            type: {pattern: "(?i)^-?auth$"}
            module: {pattern: "(^|/)pam_unix\\.so$"}
            arguments: {contains: {enum: [nullok, nullok_secure]}}
    severity: warning
    score: 5.0
    message: "{subject} passes nullok to pam_unix, so an account whose password is empty logs in by pressing Enter"
    fix: remove nullok from the pam_unix auth line in {subject}
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/pam_unix.8.html
    tags: [auth, pam]
  pam/no-lockout:
    title: Password logins are never locked out
    fact: auth.pam.*
    expect:
      if: {contains: {required: [type, module], properties: {type: {pattern: "(?i)^-?auth$"}, module: {pattern: "(^|/)pam_unix\\.so$"}}}}
      then: {contains: {required: [type, module], properties: {type: {pattern: "(?i)^-?auth$"}, module: {pattern: "(^|/)pam_faillock\\.so$"}}}}
    severity: warning
    score: 5.0
    message: "{subject} checks passwords with pam_unix but never calls pam_faillock, so an attacker may guess passwords without limit"
    fix: add pam_faillock to the auth stack of {subject}, preauth before pam_unix and authfail after it, and to its account stack
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/pam_faillock.8.html
    references:
      - {title: Lynis AUTH-9408, url: "https://cisofy.com/lynis/controls/AUTH-9408/"}
    tags: [auth, lynis, pam]
  pam/unix-remember:
    title: pam_unix keeps old passwords
    fact: auth.pam.*
    expect:
      not:
        contains:
          required: [module, arguments]
          properties:
            module: {pattern: "(^|/)pam_unix\\.so$"}
            arguments: {contains: {pattern: "^remember="}}
    severity: warning
    score: 3.0
    message: "{subject} passes remember= to pam_unix, which keeps old password hashes in /etc/security/opasswd in a format pam_pwhistory has replaced"
    fix: remove remember= from the pam_unix lines in {subject}, and set it on pam_pwhistory instead if you keep a history
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/pam_unix.8.html
    tags: [auth, pam, cis-ubuntu-26.04:5.3.3.4.2]
  pam/unix-hash:
    title: pam_unix names no strong hashing scheme for new passwords
    fact: auth.pam.*
    keys: {const: /etc/pam.d/common-password}
    expect:
      not:
        contains:
          required: [type, module, arguments]
          properties:
            type: {pattern: "(?i)^-?password$"}
            module: {pattern: "(^|/)pam_unix\\.so$"}
            arguments: {not: {contains: {enum: [sha512, yescrypt]}}}
    severity: info
    score: 2.0
    message: "{subject} calls pam_unix to set passwords without sha512 or yescrypt, so the scheme of each new hash comes from ENCRYPT_METHOD in /etc/login.defs"
    fix: add yescrypt, or sha512, to the pam_unix password line through its profile in /usr/share/pam-configs, then run pam-auth-update
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/pam_unix.8.html
    tags: [auth, pam, cis-ubuntu-26.04:5.3.3.4.3, '!default']
  pam/unix-enabled:
    title: A common PAM stack does not call pam_unix
    fact: auth.pam.*
    keys: {enum: [/etc/pam.d/common-account, /etc/pam.d/common-auth, /etc/pam.d/common-password, /etc/pam.d/common-session, /etc/pam.d/common-session-noninteractive]}
    expect: {contains: {required: [module], properties: {module: {pattern: "(^|/)pam_unix\\.so$"}}}}
    severity: info
    score: 2.0
    message: "{subject} never calls pam_unix, so local accounts are not checked against /etc/passwd and /etc/shadow in this stack"
    fix: enable the Unix authentication profile with pam-auth-update --enable unix
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/pam_unix.8.html
    tags: [auth, pam, cis-ubuntu-26.04:5.3.2.1, '!default']
  pam/pwquality-enabled:
    title: Password changes skip pam_pwquality
    fact: auth.pam.*
    keys: {const: /etc/pam.d/common-password}
    expect: {contains: {required: [type, module], properties: {type: {pattern: "(?i)^-?password$"}, module: {pattern: "(^|/)pam_pwquality\\.so$"}}}}
    severity: info
    score: 2.0
    message: "{subject} never calls pam_pwquality, so a new password is not checked against a dictionary or a minimum length"
    fix: install libpam-pwquality, which adds pam_pwquality to {subject} through pam-auth-update
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/pam_pwquality.8.html
    tags: [auth, pam, cis-ubuntu-26.04:5.3.2.3, stig-ubuntu-26.04:UBTU-24-300016, '!default']
  pam/pwhistory-enabled:
    title: Password changes skip pam_pwhistory
    fact: auth.pam.*
    keys: {const: /etc/pam.d/common-password}
    expect: {contains: {required: [type, module], properties: {type: {pattern: "(?i)^-?password$"}, module: {pattern: "(^|/)pam_pwhistory\\.so$"}}}}
    severity: info
    score: 2.0
    message: "{subject} never calls pam_pwhistory, so a user may set a password they used before"
    fix: add a pam_pwhistory profile under /usr/share/pam-configs and enable it with pam-auth-update
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/pam_pwhistory.8.html
    tags: [auth, pam, cis-ubuntu-26.04:5.3.2.4, '!default']
  pam/su-unrestricted:
    title: su is open to every user
    fact: auth.pam.*
    keys: {const: /etc/pam.d/su}
    expect:
      contains:
        required: [type, control, module, arguments]
        properties:
          type: {pattern: "(?i)^auth$"}
          control: {pattern: "(?i)^(required|requisite)$"}
          module: {pattern: "(^|/)pam_wheel\\.so$"}
          arguments: {allOf: [{contains: {const: use_uid}}, {contains: {pattern: "^group=\\S+$"}}]}
    severity: info
    score: 2.0
    message: "{subject} has no required pam_wheel line with use_uid and group=, so every user may try root’s password through su"
    fix: add auth required pam_wheel.so use_uid group=<an empty group> to {subject}
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/pam_wheel.8.html
    tags: [auth, pam, cis-ubuntu-26.04:5.2.7, '!default']
  pam/faillock-deny:
    title: pam_faillock allows too many failed logins before locking
    fact: auth.faillock
    when: {"/auth/pam/~1etc~1pam.d~1common-auth": {allOf: [{contains: {required: [type, module], properties: {type: {pattern: "(?i)^-?auth$"}, module: {pattern: "(^|/)pam_faillock\\.so$"}}}}, {not: {contains: {required: [type, module, arguments], properties: {type: {pattern: "(?i)^-?auth$"}, module: {pattern: "(^|/)pam_faillock\\.so$"}, arguments: {contains: {pattern: "^deny="}}}}}}]}}
    expect: {properties: {deny: {minimum: 1, maximum: "${faillock-deny}"}}}
    severity: info
    score: 2.0
    message: "/etc/security/faillock.conf sets deny to {got}, so an account takes more than ${faillock-deny} wrong passwords, or with 0 any number, before it locks"
    fix: set deny = ${faillock-deny} or less in /etc/security/faillock.conf
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/faillock.conf.5.html
    tags: [auth, pam, cis-ubuntu-26.04:5.3.3.1.1, '!default']
  pam/faillock-unlock-time:
    title: A locked account unlocks too soon
    fact: auth.faillock
    when: {"/auth/pam/~1etc~1pam.d~1common-auth": {allOf: [{contains: {required: [type, module], properties: {type: {pattern: "(?i)^-?auth$"}, module: {pattern: "(^|/)pam_faillock\\.so$"}}}}, {not: {contains: {required: [type, module, arguments], properties: {type: {pattern: "(?i)^-?auth$"}, module: {pattern: "(^|/)pam_faillock\\.so$"}, arguments: {contains: {pattern: "^unlock_time="}}}}}}]}}
    expect: {required: [unlock_time], properties: {unlock_time: {anyOf: [{const: 0}, {minimum: "${faillock-unlock-time}"}]}}}
    severity: info
    score: 2.0
    message: "/etc/security/faillock.conf leaves unlock_time below ${faillock-unlock-time} seconds (unset is 600), so a password guesser resumes soon after each lockout"
    fix: set unlock_time = ${faillock-unlock-time} or more, or 0 to keep accounts locked until an administrator runs faillock --reset
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/faillock.conf.5.html
    tags: [auth, pam, cis-ubuntu-26.04:5.3.3.1.2, '!default']
  pam/faillock-root:
    title: Failed logins never lock root
    fact: auth.faillock
    when: {"/auth/pam/~1etc~1pam.d~1common-auth": {allOf: [{contains: {required: [type, module], properties: {type: {pattern: "(?i)^-?auth$"}, module: {pattern: "(^|/)pam_faillock\\.so$"}}}}, {not: {contains: {required: [type, module, arguments], properties: {type: {pattern: "(?i)^-?auth$"}, module: {pattern: "(^|/)pam_faillock\\.so$"}, arguments: {contains: {pattern: "^root_unlock_time="}}}}}}]}}
    expect:
      anyOf:
        - {required: [even_deny_root], properties: {even_deny_root: {const: true}}}
        - {required: [root_unlock_time]}
      properties: {root_unlock_time: {minimum: "${faillock-root-unlock-time}"}}
    severity: info
    score: 2.0
    message: "/etc/security/faillock.conf sets neither even_deny_root nor a root_unlock_time of ${faillock-root-unlock-time} seconds or more, so root’s password may be guessed without a lockout"
    fix: add even_deny_root, with root_unlock_time = ${faillock-root-unlock-time} or more, to /etc/security/faillock.conf
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/faillock.conf.5.html
    tags: [auth, pam, cis-ubuntu-26.04:5.3.3.1.3, '!default']
  pam/pwhistory-remember:
    title: pam_pwhistory remembers too few passwords
    fact: auth.pwhistory
    when: {"/auth/pam/~1etc~1pam.d~1common-password": {allOf: [{contains: {required: [type, module], properties: {type: {pattern: "(?i)^-?password$"}, module: {pattern: "(^|/)pam_pwhistory\\.so$"}}}}, {not: {contains: {required: [type, module, arguments], properties: {type: {pattern: "(?i)^-?password$"}, module: {pattern: "(^|/)pam_pwhistory\\.so$"}, arguments: {contains: {pattern: "^remember="}}}}}}]}}
    expect: {required: [remember], properties: {remember: {minimum: "${pwhistory-remember}"}}}
    severity: info
    score: 2.0
    message: "/etc/security/pwhistory.conf keeps fewer than ${pwhistory-remember} old passwords (unset is 10), so a user may cycle back to an old one"
    fix: set remember = ${pwhistory-remember} or more in /etc/security/pwhistory.conf
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/pwhistory.conf.5.html
    tags: [auth, pam, cis-ubuntu-26.04:5.3.3.3.1, '!default']
  pam/pwhistory-root:
    title: pam_pwhistory lets root reuse a password
    when: {"/auth/pam/~1etc~1pam.d~1common-password": {contains: {required: [type, module], properties: {type: {pattern: "(?i)^-?password$"}, module: {pattern: "(^|/)pam_pwhistory\\.so$"}}}}}
    facts:
      any:
        - {fact: auth.pwhistory, expect: {required: [enforce_for_root], properties: {enforce_for_root: {const: true}}}}
        - {fact: "/auth/pam/~1etc~1pam.d~1common-password", expect: {contains: {required: [type, module, arguments], properties: {type: {pattern: "(?i)^-?password$"}, module: {pattern: "(^|/)pam_pwhistory\\.so$"}, arguments: {contains: {pattern: "^enforce_for_root$"}}}}}}
    severity: info
    score: 2.0
    message: "neither /etc/security/pwhistory.conf nor the pam_pwhistory line sets enforce_for_root, so root changing a password may reuse an old one"
    fix: add enforce_for_root to /etc/security/pwhistory.conf
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/pam_pwhistory.8.html
    tags: [auth, pam, cis-ubuntu-26.04:5.3.3.3.2, '!default']
  pam/pwhistory-use-authtok:
    title: pam_pwhistory asks for the new password itself
    fact: auth.pam.*
    keys: {const: /etc/pam.d/common-password}
    when: {"/auth/pam/~1etc~1pam.d~1common-password": {contains: {required: [type, module], properties: {type: {pattern: "(?i)^-?password$"}, module: {pattern: "(^|/)pam_pwhistory\\.so$"}}}}}
    expect: {contains: {required: [type, module, arguments], properties: {type: {pattern: "(?i)^-?password$"}, module: {pattern: "(^|/)pam_pwhistory\\.so$"}, arguments: {contains: {pattern: "^use_authtok$"}}}}}
    severity: info
    score: 2.0
    message: "{subject} calls pam_pwhistory without use_authtok, so it prompts for the new password instead of taking the one pam_pwquality checked"
    fix: add use_authtok to the pam_pwhistory line through its profile in /usr/share/pam-configs, then run pam-auth-update
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/pam_pwhistory.8.html
    tags: [auth, pam, cis-ubuntu-26.04:5.3.3.3.3, '!default']
  pam/unix-use-authtok:
    title: pam_unix asks for the new password itself
    fact: auth.pam.*
    keys: {const: /etc/pam.d/common-password}
    expect: {not: {contains: {required: [type, module, arguments], properties: {type: {pattern: "(?i)^-?password$"}, module: {pattern: "(^|/)pam_unix\\.so$"}, arguments: {not: {contains: {const: use_authtok}}}}}}}
    severity: info
    score: 2.0
    message: "{subject} calls pam_unix to set passwords without use_authtok, so it may prompt for a new password the modules before it never checked"
    fix: add use_authtok to the pam_unix password line through its profile in /usr/share/pam-configs, then run pam-auth-update
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/pam_unix.8.html
    tags: [auth, pam, cis-ubuntu-26.04:5.3.3.4.4, '!default']
