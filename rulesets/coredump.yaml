description: Core dumps that hand the memory of a privileged program to the user who crashed it
topic: Boot and kernel
tags: [default]
rules:
  coredump/suid-dumpable:
    title: Setuid programs dump core readable by the user
    fact: sysctl.settings.fs.suid_dumpable
    expect: {enum: [0, 2]}
    severity: warning
    score: 4.0
    message: "fs.suid_dumpable is {got}, so a crashed setuid program leaves a core file its user can read, with the secrets it held"
    rationale: a crash of a privileged program leaves a file anyone can read, holding its memory with password hashes and keys
    remedy: {drop-in: {into: sysctl, name: coredump-suid-dumpable, lines: ["fs.suid_dumpable = 0"]}}
    docs: https://docs.kernel.org/admin-guide/sysctl/fs.html#suid-dumpable
    references:
      - {title: Lynis KRNL-6000, url: "https://cisofy.com/lynis/controls/KRNL-6000/"}
    tags: [coredump, sysctl, lynis]
  coredump/no-hard-limit:
    title: Login sessions may dump core
    fact: auth.limits
    when: {auth.pam: {minProperties: 1}, os.init: {not: {minProperties: 1, additionalProperties: {not: {contains: {enum: [systemd, init, openrc-init, runit]}}}}}}
    expect:
      not:
        additionalProperties:
          not:
            contains:
              required: [domain, type, item, value]
              properties: {domain: {const: "*"}, type: {pattern: "(?i)^(hard|-)$"}, item: {pattern: "(?i)^core$"}, value: {const: 0}}
      additionalProperties:
        not:
          contains:
            required: [type, item, value]
            properties: {type: {pattern: "(?i)^(hard|-)$"}, item: {pattern: "(?i)^core$"}, value: {not: {const: 0}}}
    severity: warning
    score: 3.5
    message: "pam_limits sets no hard core limit of 0 for every user, or raises it for some, so a program that crashes in a login session can write its memory, secrets included, to a core file"
    rationale: a crashing program writes its memory, with passwords and keys in it, to disk where it can be read later
    fix:
      - 'Add this line to “/etc/security/limits.conf”:'
      - lines: ["* hard core 0"]
      - Remove from that file and from “limits.d” any “hard” or “-” core line with another value.
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/limits.conf.5.html
    references:
      - {title: Lynis KRNL-5820, url: "https://cisofy.com/lynis/controls/KRNL-5820/"}
    tags: [coredump, auth, lynis]
  coredump/core-pattern-absolute:
    title: Setuid core dumps go to a relative path
    fact: sysctl.settings.kernel.core_pattern
    when: {sysctl.settings.fs.suid_dumpable: 2}
    expect: {pattern: "^\\|?/"}
    severity: info
    score: 2.5
    message: "kernel.core_pattern is {got} while fs.suid_dumpable is 2, so the kernel refuses every setuid core dump to that relative path and a crash of a setuid program leaves nothing to debug"
    rationale: a crash of a privileged program leaves no core file, so the cause of the crash cannot be examined
    fix: set “kernel.core_pattern” to an absolute path or a “|pipe”, or set “fs.suid_dumpable = 0”
    docs: https://docs.kernel.org/admin-guide/sysctl/fs.html
    tags: [coredump, sysctl, dev-sec-linux-baseline:sysctl-31b]
  coredump/storage:
    title: systemd-coredump keeps the dumps it receives
    fact: coredump.conf
    expect:
      anyOf:
        - {required: [drop-ins], properties: {drop-ins: {required: [Storage], properties: {Storage: {const: none}}}}}
        - {required: [main], properties: {drop-ins: {not: {required: [Storage]}}, main: {required: [Storage], properties: {Storage: {const: none}}}}}
    severity: info
    score: 1.0
    message: "coredump.conf and its drop-ins do not set Storage=none, so systemd-coredump writes each crash’s memory, its secrets included, under /var/lib/systemd/coredump"
    rationale: every crash writes the program’s memory, with passwords and keys in it, to disk where anyone with access to that directory can read it
    fix: set “Storage=none” under “[Coredump]” in “/etc/systemd/coredump.conf.d/60-coredump.conf”
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/coredump.conf.5.html
    tags: [coredump, cis-ubuntu-26.04:1.5.12, cis-controls-v8:0.0, '!default']
  coredump/process-size-max:
    title: systemd-coredump processes dumps
    fact: coredump.conf
    expect:
      anyOf:
        - {required: [drop-ins], properties: {drop-ins: {required: [ProcessSizeMax], properties: {ProcessSizeMax: {const: 0}}}}}
        - {required: [main], properties: {drop-ins: {not: {required: [ProcessSizeMax]}}, main: {required: [ProcessSizeMax], properties: {ProcessSizeMax: {const: 0}}}}}
    severity: info
    score: 1.0
    message: "coredump.conf and its drop-ins do not set ProcessSizeMax=0, so systemd-coredump still reads each crash’s memory and logs its stack"
    rationale: the service still reads each crashed program’s memory, with passwords and keys in it, and writes its stack into the logs
    fix: set “ProcessSizeMax=0” under “[Coredump]” in “/etc/systemd/coredump.conf.d/60-coredump.conf”
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/coredump.conf.5.html
    tags: [coredump, cis-ubuntu-26.04:1.5.11, cis-controls-v8:0.0, '!default']
