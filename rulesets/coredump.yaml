description: Core dumps that hand the memory of a privileged program to the user who crashed it
tags: [default]
rules:
  coredump/suid-dumpable:
    title: Setuid programs dump core readable by the user
    fact: sysctl.settings.fs.suid_dumpable
    expect: {enum: [0, 2]}
    severity: error
    score: 6.8
    message: "fs.suid_dumpable is {got}, so a crashed setuid program leaves a core file its user can read, with the secrets it held"
    fix: set fs.suid_dumpable = 0, or 2 when a root-only crash handler such as apport or systemd-coredump receives the dumps
    docs: https://docs.kernel.org/admin-guide/sysctl/fs.html#suid-dumpable
    references:
      - {title: Lynis KRNL-6000, url: "https://cisofy.com/lynis/controls/KRNL-6000/"}
    tags: [coredump, sysctl, lynis]
  coredump/no-hard-limit:
    title: Login sessions may dump core
    fact: auth.limits
    when: {auth.pam: {minProperties: 1}}
    expect:
      not:
        additionalProperties:
          not:
            contains:
              required: [domain, type, item, value]
              properties: {domain: {const: "*"}, type: {pattern: "(?i)^(hard|-)$"}, item: {pattern: "(?i)^core$"}, value: {const: 0}}
      additionalProperties:
        not:
          contains:
            required: [type, item, value]
            properties: {type: {pattern: "(?i)^(hard|-)$"}, item: {pattern: "(?i)^core$"}, value: {not: {const: 0}}}
    severity: warning
    score: 3.0
    message: "pam_limits sets no hard core limit of 0 for every user, or raises it for some, so a program that crashes in a login session can write its memory, secrets included, to a core file"
    fix: "add * hard core 0 to /etc/security/limits.conf and remove any hard or - core line with another value from it and limits.d"
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/limits.conf.5.html
    references:
      - {title: Lynis KRNL-5820, url: "https://cisofy.com/lynis/controls/KRNL-5820/"}
    tags: [coredump, auth, lynis]
  coredump/core-pattern-absolute:
    title: Setuid core dumps go to a relative path
    fact: sysctl.settings.kernel.core_pattern
    when: {sysctl.settings.fs.suid_dumpable: 2}
    expect: {pattern: "^\\|?/"}
    severity: info
    score: 1.0
    message: "kernel.core_pattern is {got} while fs.suid_dumpable is 2; the kernel refuses a setuid dump to a relative path, and dev-sec asks an absolute one or a pipe"
    fix: set kernel.core_pattern to an absolute path or a |pipe, or fs.suid_dumpable = 0
    docs: https://docs.kernel.org/admin-guide/sysctl/fs.html
    tags: [coredump, sysctl, dev-sec-linux-baseline:sysctl-31b, '!default']
