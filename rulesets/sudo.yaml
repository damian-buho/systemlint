description: sudo grants that skip the password, and sudoers lines sudo skips as broken
topic: Accounts and authentication
tags: [default]
rules:
  sudo/not-installed:
    title: sudo is not installed
    fact: sudo.binary
    expect: {minProperties: 1}
    severity: info
    score: 1.0
    message: "no sudo program is in /usr/bin, /bin or /usr/local/bin, so administrators share root’s password and leave no record of who ran what"
    rationale: administrators must share the root password, and nothing records which person made which change
    fix:
      - 'Install sudo:'
      - run: apt install sudo
      - Then grant administrators through “/etc/sudoers.d” with visudo.
    docs: https://www.sudo.ws/docs/man/sudo.man/
    tags: [sudo, cis-ubuntu-26.04:5.2.1, cis-controls-v8:5.4, iso-27001-2022:A5.15, iso-27001-2022:A8.2, nist-800-171-r2:3.1.6, nist-800-171-r2:3.1.7, nist-800-171-r3:03.01.06, nist-800-171-r3:03.01.07, nist-800-53:AC-2(11), nist-800-53:AC-6(2), nist-800-53:AC-6(5), '!default']
  sudo/nopasswd:
    title: An account runs sudo commands without a password
    fact: sudo.grants.*
    when: {sudo.binary: {minProperties: 1}}
    expect: {additionalProperties: {properties: {commands: {not: {pattern: "(^|, )NOPASSWD: "}}}}}
    severity: warning
    score: 6.0
    message: "{subject} may run commands through sudo without its password, so any program running as {subject}, a browser exploit or a package’s install script, gets those rights unasked"
    rationale: any program running under that account, such as an exploited browser or a malicious installer, gets root without a password
    fix: remove the “NOPASSWD” tag from the grant to {subject} in “/etc/sudoers” or “/etc/sudoers.d”, editing it with visudo
    docs: https://www.sudo.ws/docs/man/sudoers.man/
    tags: [sudo, cis-ubuntu-26.04:5.2.4, stig-ubuntu-26.04:UBTU-24-300020, cis-controls-v8:5.4, iso-27001-2022:A5.15, iso-27001-2022:A8.2, nist-800-171-r2:3.1.6, nist-800-171-r2:3.1.7, nist-800-171-r3:03.01.06, nist-800-171-r3:03.01.07, nist-800-53:AC-2(11), nist-800-53:AC-6(2), nist-800-53:AC-6(5)]
  sudo/invalid-sudoers:
    title: A sudoers file is one sudo cannot parse
    fact: sudo.check.exit-status
    when: {sudo.binary: {minProperties: 1}}
    expect: {const: 0}
    severity: warning
    score: 4.0
    message: "visudo --check exits {got}, so sudo skips the broken lines and runs without the grants or limits they were written to set"
    rationale: the rules that were meant to limit or grant administrator rights are partly ignored, so people get more or less access than intended
    fix: run “visudo --check” as root, and fix the line it names
    docs: https://www.sudo.ws/docs/man/visudo.man/
    tags: [sudo]
