description: The systemd journal kept running, on disk, compressed and forwarded to rsyslog, and its services that take log entries from the network
topic: Logging and auditing
tags: [default]
when: {systemd.state: {required: [systemd-journald.service]}}
rules:
  journald/remote-listening:
    title: systemd-journal-remote accepts logs from the network
    fact: systemd.state.*
    keys: {enum: [systemd-journal-remote.socket, systemd-journal-remote.service]}
    expect:
      anyOf:
        - {properties: {masked: {const: true}}, required: [masked]}
        - properties:
            enabled: {const: false}
            active: {not: {enum: [active, activating, reloading]}}
    severity: warning
    score: 5.0
    message: "{subject} is enabled or running, so any host that reaches its port can write entries into this host’s journal, flooding the disk or forging records"
    fix:
      - 'Unless this host collects other hosts’ logs, stop the service and keep it from starting:'
      - run: 'systemctl mask --now {subject}'
      - 'If it does collect them, let only those hosts reach its port in the firewall.'
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/systemd-journal-remote.service.8.html
    tags: [journald, logging, cis-ubuntu-26.04:6.1.1.1.2]
  journald/inactive:
    title: systemd-journald is not running
    fact: systemd.state.*.active
    keys: {const: systemd-journald.service}
    when: {systemd.state.*: {required: [active]}}
    expect: {const: active}
    severity: warning
    score: 5.0
    message: "{subject} is {got}, so programs that log to the journal or to syslog lose what they write"
    fix:
      - 'Let the service start again, and start it:'
      - run: 'systemctl unmask {subject}'
      - run: 'systemctl start {subject}'
      - 'Read why it stopped:'
      - run: 'journalctl --boot --unit {subject}'
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/systemd-journald.service.8.html
    tags: [journald, logging, cis-ubuntu-26.04:6.1.1.1.1]
  journald/no-syslog-forward:
    title: journald does not forward to rsyslog
    fact: journald
    when:
      systemd.state:
        required: [rsyslog.service]
        properties: {rsyslog.service: {required: [masked], properties: {masked: {const: false}}}}
    expect:
      anyOf:
        - {required: [drop-ins], properties: {drop-ins: {required: [ForwardToSyslog], properties: {ForwardToSyslog: &true {anyOf: [{const: 1}, {type: string, pattern: "(?i)^(yes|y|true|t|on)$"}]}}}}}
        - {required: [main], properties: {drop-ins: {not: {required: [ForwardToSyslog]}}, main: {required: [ForwardToSyslog], properties: {ForwardToSyslog: *true}}}}
    severity: info
    score: 1.0
    message: "journald.conf and its drop-ins leave ForwardToSyslog off while rsyslog is installed; the benchmark asks rsyslog to receive every entry"
    fix:
      - 'Write these lines to “/etc/systemd/journald.conf.d/60-journald.conf”:'
      - lines: ['[Journal]', 'ForwardToSyslog=yes']
      - 'Restart journald:'
      - run: 'systemctl restart systemd-journald.service'
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/journald.conf.5.html
    tags: [journald, logging, cis-ubuntu-26.04:6.1.1.1.3, '!default']
  journald/storage-not-persistent:
    title: journald is not set to keep the journal on disk
    fact: journald
    expect:
      anyOf:
        - {required: [drop-ins], properties: {drop-ins: {required: [Storage], properties: {Storage: &persistent {const: persistent}}}}}
        - {required: [main], properties: {drop-ins: {not: {required: [Storage]}}, main: {required: [Storage], properties: {Storage: *persistent}}}}
    severity: info
    score: 1.0
    message: "journald.conf and its drop-ins do not set Storage=persistent, so the journal stays in memory, lost at reboot, unless /var/log/journal happens to exist"
    fix:
      - 'Write these lines to “/etc/systemd/journald.conf.d/60-journald.conf”:'
      - lines: ['[Journal]', 'Storage=persistent']
      - 'Restart journald:'
      - run: 'systemctl restart systemd-journald.service'
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/journald.conf.5.html
    tags: [journald, logging, cis-ubuntu-26.04:6.1.1.1.6]
  journald/compress-off:
    title: journald is set not to compress the journal
    fact: journald
    expect:
      anyOf:
        - {required: [drop-ins], properties: {drop-ins: {required: [Compress], properties: {Compress: &compress {anyOf: [*true, {const: ""}, {type: integer, not: {const: 0}}, {type: string, pattern: "^[0-9]+[KMGTPE]?$"}]}}}}}
        - {required: [main], properties: {drop-ins: {not: {required: [Compress]}}, main: {required: [Compress], properties: {Compress: *compress}}}}
        - {properties: {drop-ins: {not: {required: [Compress]}}, main: {not: {required: [Compress]}}}}
    severity: info
    score: 1.0
    message: "journald.conf or a drop-in turns Compress off, so large journal entries fill the disk sooner"
    fix:
      - 'Remove the “Compress” line under “[Journal]” in the journald files, or set “Compress=yes” there.'
      - 'Restart journald:'
      - run: 'systemctl restart systemd-journald.service'
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/journald.conf.5.html
    tags: [journald, logging, cis-ubuntu-26.04:6.1.1.1.7]
  journald/stig-directory-mode:
    title: A journal directory is more open than 2750
    fact: journald.files.*.mode
    when: {journald.files.*.kind: directory}
    expect: {pattern: "^[02][0-7][0145]0$"}
    severity: info
    score: 1.0
    message: "{subject} has mode {got}; the STIG asks 2750 or stricter, so other users cannot list the journal"
    fix: run “chmod 2750” on the directory, or set the mode through a “tmpfiles.d” override of “systemd.conf”
    remedy: {chmod: "u-s,g-w,o-rwxt"}
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/systemd-journald.service.8.html
    tags: [journald, logging, stig-ubuntu-26.04:UBTU-24-700020, '!default']
  journald/stig-file-mode:
    title: A journal file is more open than 0640
    fact: journald.files.*.mode
    when: {journald.files.*.kind: file}
    expect: {pattern: "^0[0246][04]0$"}
    severity: info
    score: 1.0
    message: "{subject} has mode {got}; the STIG asks 0640 or stricter"
    fix: run “chmod 0640” on the file
    remedy: {chmod: "u-xs,g-wxs,o-rwxt"}
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/systemd-journald.service.8.html
    tags: [journald, logging, stig-ubuntu-26.04:UBTU-24-700020, '!default']
  journald/stig-owner:
    title: A journal file or directory is not owned by root
    fact: journald.files.*.uid
    expect: {const: 0}
    severity: info
    score: 1.0
    message: "{subject} is owned by uid {got}, so that user can rewrite or truncate the journal"
    fix: run “chown root” on the path
    remedy: {chown: 0}
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/systemd-journald.service.8.html
    tags: [journald, logging, stig-ubuntu-26.04:UBTU-24-700080, stig-ubuntu-26.04:UBTU-24-700090, '!default']
  journald/stig-group:
    title: A journal file or directory is not in group systemd-journal
    fact: journald.files.*.gid
    same: accounts.group.systemd-journal.gid
    severity: info
    score: 1.0
    message: "{subject} belongs to gid {got}, not systemd-journal ({same})"
    fix: run “chgrp systemd-journal” on the path
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/systemd-journald.service.8.html
    tags: [journald, logging, stig-ubuntu-26.04:UBTU-24-700060, stig-ubuntu-26.04:UBTU-24-700070, '!default']
  journald/stig-journalctl-mode:
    title: journalctl runs for every user
    fact: journald.journalctl.*.mode
    expect: {pattern: "^0[0-7][0-4]0$"}
    severity: info
    score: 1.0
    message: "{subject} has mode {got}; the STIG asks 0740, so only root and its group run it"
    fix:
      - 'Let only root and its group run it:'
      - run: 'chmod 0740 {subject}'
      - 'Keep that mode across package upgrades:'
      - run: 'dpkg-statoverride --update --add root root 0740 {subject}'
    remedy: {chmod: "ugo-st,g-wx,o-rwx"}
    docs: https://manpages.ubuntu.com/manpages/resolute/man1/journalctl.1.html
    tags: [journald, logging, stig-ubuntu-26.04:UBTU-24-700030, '!default']
  journald/stig-journalctl-owner:
    title: journalctl is not owned by root
    fact: journald.journalctl.*.uid
    expect: {const: 0}
    severity: info
    score: 1.0
    message: "{subject} is owned by uid {got}, so that user can replace it"
    fix: run “chown root” on the file
    remedy: {chown: 0}
    docs: https://manpages.ubuntu.com/manpages/resolute/man1/journalctl.1.html
    tags: [journald, logging, stig-ubuntu-26.04:UBTU-24-700040, '!default']
  journald/stig-journalctl-group:
    title: journalctl is not in group root
    fact: journald.journalctl.*.gid
    expect: {const: 0}
    severity: info
    score: 1.0
    message: "{subject} belongs to gid {got}; the STIG asks group root"
    fix: run “chgrp 0” on the file
    remedy: {chgrp: 0}
    docs: https://manpages.ubuntu.com/manpages/resolute/man1/journalctl.1.html
    tags: [journald, logging, stig-ubuntu-26.04:UBTU-24-700050, '!default']
