description: Kernel protections against link and file tricks in world-writable sticky directories such as /tmp
tags: [default]
rules:
  fs-protected/symlinks:
    title: Symlinks in /tmp followed across owners
    fact: sysctl.settings.fs.protected_symlinks
    expect: {const: 1}
    severity: error
    score: 7.0
    message: "fs.protected_symlinks is {got}, so a user can plant a symlink in /tmp that a root process follows to overwrite any file"
    fix: set fs.protected_symlinks = 1
    docs: https://docs.kernel.org/admin-guide/sysctl/fs.html#protected-symlinks
    references:
      - {title: Lynis KRNL-6000, url: "https://cisofy.com/lynis/controls/KRNL-6000/"}
    tags: [fs-protected, sysctl, lynis]
  fs-protected/hardlinks:
    title: Hard links allowed to files the user cannot write
    fact: sysctl.settings.fs.protected_hardlinks
    expect: {const: 1}
    severity: error
    score: 7.0
    message: "fs.protected_hardlinks is {got}, so a user can hard-link a setuid binary or a root-owned file and keep it after an update"
    fix: set fs.protected_hardlinks = 1
    docs: https://docs.kernel.org/admin-guide/sysctl/fs.html#protected-hardlinks
    references:
      - {title: Lynis KRNL-6000, url: "https://cisofy.com/lynis/controls/KRNL-6000/"}
    tags: [fs-protected, sysctl, lynis]
  fs-protected/fifos:
    title: FIFOs in /tmp opened across owners
    fact: sysctl.settings.fs.protected_fifos
    expect: {minimum: 1}
    severity: warning
    score: 4.0
    message: "fs.protected_fifos is {got}, so a process that creates a FIFO in /tmp may open one another user planted under that name"
    fix: set fs.protected_fifos = 1, or 2 to cover group-writable sticky directories too
    docs: https://docs.kernel.org/admin-guide/sysctl/fs.html#protected-fifos
    references:
      - {title: Lynis KRNL-6000, url: "https://cisofy.com/lynis/controls/KRNL-6000/"}
    tags: [fs-protected, sysctl, lynis]
  fs-protected/regular:
    title: Files in /tmp opened across owners
    fact: sysctl.settings.fs.protected_regular
    expect: {minimum: 1}
    severity: warning
    score: 4.0
    message: "fs.protected_regular is {got}, so a process that creates a file in /tmp may write into one another user planted under that name"
    fix: set fs.protected_regular = 1, or 2 to cover group-writable sticky directories too
    docs: https://docs.kernel.org/admin-guide/sysctl/fs.html#protected-regular
    references:
      - {title: Lynis KRNL-6000, url: "https://cisofy.com/lynis/controls/KRNL-6000/"}
    tags: [fs-protected, sysctl, lynis]
