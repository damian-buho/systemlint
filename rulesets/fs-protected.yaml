description: Kernel protections against link and file tricks in world-writable sticky directories such as /tmp
topic: Boot and kernel
tags: [default]
rules:
  fs-protected/symlinks:
    title: Symlinks in /tmp are followed across owners
    fact: sysctl.settings.fs.protected_symlinks
    expect: {const: 1}
    severity: error
    score: 7.0
    message: "fs.protected_symlinks is {got}, so a user can plant a symlink in /tmp that a root process follows to overwrite any file"
    rationale: a local user can trick a privileged program into overwriting files it never meant to touch, such as system configuration
    remedy: {drop-in: {into: sysctl, name: fs-protected-symlinks, lines: ["fs.protected_symlinks = 1"]}}
    docs: https://docs.kernel.org/admin-guide/sysctl/fs.html#protected-symlinks
    references:
      - {title: Lynis KRNL-6000, url: "https://cisofy.com/lynis/controls/KRNL-6000/"}
    tags: [fs-protected, sysctl, lynis]
  fs-protected/hardlinks:
    title: Hard links are allowed to files the user cannot write
    fact: sysctl.settings.fs.protected_hardlinks
    expect: {const: 1}
    severity: error
    score: 7.0
    message: "fs.protected_hardlinks is {got}, so a user can hard-link a setuid binary or a root-owned file and keep it after an update"
    rationale: a local user can pin a privileged file in place and keep an old vulnerable copy after the system is updated
    remedy: {drop-in: {into: sysctl, name: fs-protected-hardlinks, lines: ["fs.protected_hardlinks = 1"]}}
    docs: https://docs.kernel.org/admin-guide/sysctl/fs.html#protected-hardlinks
    references:
      - {title: Lynis KRNL-6000, url: "https://cisofy.com/lynis/controls/KRNL-6000/"}
    tags: [fs-protected, sysctl, lynis]
  fs-protected/fifos:
    title: FIFOs in /tmp are opened across owners
    fact: sysctl.settings.fs.protected_fifos
    expect: {minimum: 1}
    severity: warning
    score: 4.0
    message: "fs.protected_fifos is {got}, so a process that creates a FIFO in /tmp may open one another user planted under that name"
    rationale: a local user can plant a pipe in a shared directory and capture or feed data to a privileged program that opens it
    remedy: {drop-in: {into: sysctl, name: fs-protected-fifos, lines: ["fs.protected_fifos = 1"]}}
    docs: https://docs.kernel.org/admin-guide/sysctl/fs.html#protected-fifos
    references:
      - {title: Lynis KRNL-6000, url: "https://cisofy.com/lynis/controls/KRNL-6000/"}
    tags: [fs-protected, sysctl, lynis]
  fs-protected/regular:
    title: Files in /tmp are opened across owners
    fact: sysctl.settings.fs.protected_regular
    expect: {minimum: 1}
    severity: warning
    score: 4.0
    message: "fs.protected_regular is {got}, so a process that creates a file in /tmp may write into one another user planted under that name"
    rationale: a local user can plant a file in a shared directory and have a privileged program write into it or read attacker-chosen content
    remedy: {drop-in: {into: sysctl, name: fs-protected-regular, lines: ["fs.protected_regular = 1"]}}
    docs: https://docs.kernel.org/admin-guide/sysctl/fs.html#protected-regular
    references:
      - {title: Lynis KRNL-6000, url: "https://cisofy.com/lynis/controls/KRNL-6000/"}
    tags: [fs-protected, sysctl, lynis]
