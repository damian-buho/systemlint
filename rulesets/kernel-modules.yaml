  kernel-modules/builtin:
    title: A kernel builds a module in, beyond modprobe.d’s reach
    fact: kernel.builtin.*
    keys: {enum: [cramfs, freevxfs, hfs, hfsplus, jffs2, udf, dccp, rds, sctp, tipc]}
    expect: {not: {}}
    severity: warning
    score: 3.5
    message: "{subject} is built into a kernel in /lib/modules, so no modprobe.d line keeps it out of that kernel"
    fix:
      - Boot a kernel that builds {subject} as a loadable module, such as the distribution’s generic kernel.
      - 'Add this line to a file ending in “.conf” under “/etc/modprobe.d/”:'
      - lines: ["install {subject} /bin/false"]
    docs: https://man7.org/linux/man-pages/man5/modprobe.d.5.html
    tags: [kernel]
