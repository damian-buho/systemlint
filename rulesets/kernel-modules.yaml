    expect: {not: {required: [squashfs]}}
    severity: warning
    score: 4.0
    message: "squashfs is loaded in the running kernel with nothing using it, and snapd is not on disk to need it, so a crafted squashfs image on a USB stick or in a loop file reaches a rarely audited filesystem driver"
    rationale: the squashfs driver is already in memory, so a compressed read-only image such as a snap package plugged in or placed on disk is parsed by kernel code that few people review
    remedy: {drop-in: {into: modprobe, name: block-squashfs-autoloading, lines: ["install squashfs /bin/false", "blacklist squashfs"], unload: true}}
    docs: https://man7.org/linux/man-pages/man5/modprobe.d.5.html
