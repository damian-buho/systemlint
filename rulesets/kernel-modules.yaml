  kernel-modules/overlay:
    title: Kernel module “overlay” loads automatically
    when: {kernel.shipped: {required: [overlay]}, kernel: {not: &overlay-in-use {required: [loaded], properties: {loaded: {required: [overlay], properties: {overlay: {required: [instances], properties: {instances: {exclusiveMinimum: 0}}}}}}}}, runtimes.containers: {maxProperties: 0}}
    facts:
      all:
        - {fact: kernel.install, expect: {required: [overlay], properties: {overlay: {properties: {command: {minItems: 1, prefixItems: [{pattern: '^(/usr)?/bin/(false|true)$'}]}}}}}}
        - {fact: kernel.blacklist, expect: {required: [overlay]}}
    severity: warning
    score: 4.0
    message: overlay is shipped, no container runtime is on disk to need it, and modprobe.d lacks the install line that turns it away or the blacklist line that keeps a device from asking for it, so any user who can mount in a user namespace reaches overlayfs, a repeated source of privilege escalations
    rationale: a user who can mount in a user namespace can attack overlayfs, whose past bugs gave an ordinary user root
    remedy: {drop-in: {into: modprobe, name: block-overlay-autoloading, lines: ["install overlay /bin/false", "blacklist overlay"]}}
    docs: https://man7.org/linux/man-pages/man5/modprobe.d.5.html
    tags: [kernel, cis-ubuntu-26.04:1.1.1.6, '!default']
  kernel-modules/overlay-loaded:
    title: Kernel module “overlay” is loaded
    fact: kernel.loaded
    when: {kernel: {required: [loaded], not: *overlay-in-use}, runtimes.containers: {maxProperties: 0}}
    expect: {not: {required: [overlay]}}
    severity: warning
    score: 4.0
    message: overlay is loaded in the running kernel with nothing using it, and no container runtime is on disk to need it, so any user who can mount in a user namespace reaches overlayfs, a repeated source of privilege escalations
    rationale: overlayfs is already in the kernel for a user who can mount in a user namespace, and its past bugs gave an ordinary user root
    remedy: {drop-in: {into: modprobe, name: block-overlay-autoloading, lines: ["install overlay /bin/false", "blacklist overlay"], unload: true}}
    docs: https://man7.org/linux/man-pages/man5/modprobe.d.5.html
    tags: [kernel, cis-ubuntu-26.04:1.1.1.6, '!default']
