description: Kernel modules for rare filesystems, protocols and devices that load on demand
tags: [default]
rules:
  kernel-modules/cramfs:
    title: cramfs module loads on demand
    fact: kernel.install
    when: {kernel.shipped: {required: [cramfs]}}
    expect: {required: [cramfs], properties: {cramfs: {properties: {command: {minItems: 1, prefixItems: [{pattern: '^(/usr)?/bin/(false|true)$'}]}}}}}
    severity: warning
    score: 4.0
    message: "cramfs is shipped and no modprobe.d install line turns it away, so a crafted cramfs image on a USB stick or in a loop file reaches a rarely audited filesystem driver"
    fix: add install cramfs /bin/false to a .conf file in /etc/modprobe.d/
    docs: https://man7.org/linux/man-pages/man5/modprobe.d.5.html
    references:
      - {title: Lynis FILE-6430, url: "https://cisofy.com/lynis/controls/FILE-6430/"}
    tags: [kernel, cis-ubuntu-26.04:1.1.1.1, dev-sec-linux-baseline:os-10, lynis]
  kernel-modules/cramfs-loaded:
    title: cramfs module loaded
    fact: kernel.loaded
    when: {kernel: {required: [loaded]}}
    expect: {not: {required: [cramfs]}}
    severity: warning
    score: 4.0
    message: "cramfs is loaded in the running kernel, so a crafted cramfs image on a USB stick or in a loop file reaches a rarely audited filesystem driver"
    fix: run modprobe -r cramfs, then add install cramfs /bin/false to a .conf file in /etc/modprobe.d/
    docs: https://man7.org/linux/man-pages/man5/modprobe.d.5.html
    references:
      - {title: Lynis FILE-6430, url: "https://cisofy.com/lynis/controls/FILE-6430/"}
    tags: [kernel, cis-ubuntu-26.04:1.1.1.1, lynis]
  kernel-modules/cramfs-blacklist:
    title: cramfs module not blacklisted
    fact: kernel.blacklist
    when: {kernel.shipped: {required: [cramfs]}}
    expect: {required: [cramfs]}
    severity: info
    score: 2.0
    message: "cramfs is shipped and no modprobe.d blacklist line names it, so a device or alias asking for it loads it"
    fix: add blacklist cramfs to a .conf file in /etc/modprobe.d/
    docs: https://man7.org/linux/man-pages/man5/modprobe.d.5.html
    tags: [kernel, cis-ubuntu-26.04:1.1.1.1, '!default']
