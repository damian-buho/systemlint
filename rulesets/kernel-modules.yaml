description: Kernel modules for rare filesystems, protocols and devices that load on demand
topic: Boot and kernel
tags: [default]
rules:
  kernel-modules/cramfs:
    title: Kernel module “cramfs” loads automatically
    when: {kernel.shipped: {required: [cramfs]}}
    facts:
      all:
        - {fact: kernel.install, expect: {required: [cramfs], properties: {cramfs: {properties: {command: {minItems: 1, prefixItems: [{pattern: '^(/usr)?/bin/(false|true)$'}]}}}}}}
        - {fact: kernel.blacklist, expect: {required: [cramfs]}}
    severity: warning
    score: 4.0
    message: "cramfs is shipped and modprobe.d lacks the install line that turns it away or the blacklist line that keeps a device from asking for it, so a crafted cramfs image on a USB stick or in a loop file reaches a rarely audited filesystem driver"
    rationale: anyone who can hand the host a compressed read-only image can feed it to a kernel parser that few people review, and a bug there runs attacker code with full kernel power
    remedy: {drop-in: {into: modprobe, name: block-cramfs-autoloading, lines: ["install cramfs /bin/false", "blacklist cramfs"]}}
    docs: https://man7.org/linux/man-pages/man5/modprobe.d.5.html
    references:
      - {title: Lynis FILE-6430, url: "https://cisofy.com/lynis/controls/FILE-6430/"}
    tags: [kernel, cis-ubuntu-26.04:1.1.1.1, dev-sec-linux-baseline:os-10, lynis]
  kernel-modules/cramfs-loaded:
    title: Kernel module “cramfs” is loaded
    fact: kernel.loaded
    when: {kernel: {required: [loaded]}}
    expect: {not: {required: [cramfs]}}
    severity: warning
    score: 4.0
    message: "cramfs is loaded in the running kernel, so a crafted cramfs image on a USB stick or in a loop file reaches a rarely audited filesystem driver"
    rationale: the cramfs driver is already in memory, so a compressed read-only image plugged in or placed on disk is parsed by kernel code that few people review
    remedy: {drop-in: {into: modprobe, name: block-cramfs-autoloading, lines: ["install cramfs /bin/false", "blacklist cramfs"], unload: true}}
    docs: https://man7.org/linux/man-pages/man5/modprobe.d.5.html
    references:
      - {title: Lynis FILE-6430, url: "https://cisofy.com/lynis/controls/FILE-6430/"}
    tags: [kernel, cis-ubuntu-26.04:1.1.1.1, lynis]
