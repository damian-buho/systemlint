  kernel-modules/firewire-core:
    title: Kernel module “firewire-core” loads automatically
    when: {kernel.shipped: {required: [firewire-core]}}
    facts:
      all:
        - {fact: kernel.install, expect: {required: [firewire_core], properties: {firewire_core: {properties: {command: {minItems: 1, prefixItems: [{pattern: '^(/usr)?/bin/(false|true)$'}]}}}}}}
        - {fact: kernel.blacklist, expect: {required: [firewire_core]}}
    severity: warning
    score: 4.0
    message: "firewire-core is shipped and modprobe.d lacks the install line that turns it away or the blacklist line that keeps a device from asking for it, so a FireWire device plugged in can read and write memory through DMA"
    rationale: anyone who plugs in a FireWire device can read or overwrite the host’s memory, passwords and encryption keys included, without logging in
    remedy: {drop-in: {into: modprobe, name: block-firewire-core-autoloading, lines: ["install firewire_core /bin/false", "blacklist firewire_core"]}}
    docs: https://man7.org/linux/man-pages/man5/modprobe.d.5.html
    references:
      - {title: Lynis STRG-1846, url: "https://cisofy.com/lynis/controls/STRG-1846/"}
    tags: [kernel, cis-ubuntu-26.04:1.1.1.9, lynis]
  kernel-modules/firewire-core-loaded:
    title: Kernel module “firewire-core” is loaded
    fact: kernel.loaded
    when: {kernel: {required: [loaded]}}
    expect: {not: {required: [firewire_core]}}
    severity: warning
    score: 4.0
    message: "firewire_core is loaded in the running kernel, so a FireWire device plugged in can read and write memory through DMA"
    rationale: the FireWire driver is active, so a device plugged in can read or overwrite the host’s memory, passwords and encryption keys included
    remedy: {drop-in: {into: modprobe, name: block-firewire-core-autoloading, lines: ["install firewire_core /bin/false", "blacklist firewire_core"], unload: true}}
    docs: https://man7.org/linux/man-pages/man5/modprobe.d.5.html
    tags: [kernel, cis-ubuntu-26.04:1.1.1.9]
  kernel-modules/usb-storage:
    title: Kernel module “usb-storage” loads automatically
    when: {kernel.shipped: {required: [usb-storage]}, kernel: {not: &usb-storage-in-use {required: [loaded], properties: {loaded: {required: [usb_storage], properties: {usb_storage: {required: [instances], properties: {instances: {exclusiveMinimum: 0}}}}}}}}}
    facts:
      all:
        - {fact: kernel.install, expect: {required: [usb_storage], properties: {usb_storage: {properties: {command: {minItems: 1, prefixItems: [{pattern: '^(/usr)?/bin/(false|true)$'}]}}}}}}
        - {fact: kernel.blacklist, expect: {required: [usb_storage]}}
    severity: warning
    score: 4.0
    message: "usb-storage is shipped, no USB storage device uses it, and modprobe.d lacks the install line that turns it away or the blacklist line that keeps a device from asking for it, so a USB storage device plugged in mounts, a way for data to leave and malware to arrive"
    rationale: anyone with a USB stick can copy data off the host or bring malware onto it
    remedy: {drop-in: {into: modprobe, name: block-usb-storage-autoloading, lines: ["install usb_storage /bin/false", "blacklist usb_storage"]}}
    docs: https://man7.org/linux/man-pages/man5/modprobe.d.5.html
    references:
      - {title: Lynis USB-1000, url: "https://cisofy.com/lynis/controls/USB-1000/"}
    tags: [kernel, cis-ubuntu-26.04:1.1.1.10, stig-ubuntu-26.04:UBTU-24-300039, lynis, '!default']
  kernel-modules/usb-storage-loaded:
    title: Kernel module “usb-storage” is loaded
    fact: kernel.loaded
    when: {kernel: {required: [loaded], not: *usb-storage-in-use}}
    expect: {not: {required: [usb_storage]}}
    severity: warning
    score: 4.0
    message: "usb_storage is loaded in the running kernel and no USB storage device uses it, so a USB storage device plugged in mounts, a way for data to leave and malware to arrive"
    rationale: a USB stick or disk already mounts on this host, so anyone with one can copy data off it or bring malware onto it
    remedy: {drop-in: {into: modprobe, name: block-usb-storage-autoloading, lines: ["install usb_storage /bin/false", "blacklist usb_storage"], unload: true}}
    docs: https://man7.org/linux/man-pages/man5/modprobe.d.5.html
    tags: [kernel, cis-ubuntu-26.04:1.1.1.10, '!default']
  kernel-modules/atm:
    title: Kernel module “atm” loads automatically
    when: {kernel.shipped: {required: [atm]}}
    facts:
      all:
        - {fact: kernel.install, expect: {required: [atm], properties: {atm: {properties: {command: {minItems: 1, prefixItems: [{pattern: '^(/usr)?/bin/(false|true)$'}]}}}}}}
        - {fact: kernel.blacklist, expect: {required: [atm]}}
    severity: warning
    score: 4.5
    message: "atm is shipped and modprobe.d lacks the install line that turns it away or the blacklist line that keeps a device from asking for it, so any local user opening an atm socket loads a rarely used protocol stack, a frequent source of kernel privilege escalations"
    rationale: any local user can open a atm socket and so load kernel code for asynchronous transfer mode networking that nobody on this host uses, where one bug gives root
    remedy: {drop-in: {into: modprobe, name: block-atm-autoloading, lines: ["install atm /bin/false", "blacklist atm"]}}
    docs: https://man7.org/linux/man-pages/man5/modprobe.d.5.html
    tags: [kernel, cis-ubuntu-26.04:3.2.1]
  kernel-modules/atm-loaded:
    title: Kernel module “atm” is loaded
    fact: kernel.loaded
    when: {kernel: {required: [loaded]}}
    expect: {not: {required: [atm]}}
    severity: warning
    score: 4.5
