    severity: warning
    score: 4.0
    message: "squashfs is shipped, snapd is not on disk to need it, and modprobe.d lacks the install line that turns it away or the blacklist line that keeps a device from asking for it, so a crafted squashfs image on a USB stick or in a loop file reaches a rarely audited filesystem driver"
    rationale: anyone who can hand the host a compressed read-only image such as a snap package can feed it to a kernel parser that few people review, and a bug there runs attacker code with full kernel power
    remedy: {drop-in: {into: modprobe, name: block-squashfs-autoloading, lines: ["install squashfs /bin/false", "blacklist squashfs"]}}
    docs: https://man7.org/linux/man-pages/man5/modprobe.d.5.html
    references:
