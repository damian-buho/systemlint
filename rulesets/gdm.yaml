description: GNOME display manager settings that open the graphical login to the network
topic: Services
tags: [default]
when: {gdm.config: {minProperties: 1}}
rules:
  gdm/xdmcp:
    title: GDM offers its login screen over XDMCP
    fact: gdm.config.*
    expect:
      not:
        required: [xdmcp]
        properties: {xdmcp: {required: [Enable], properties: {Enable: {contains: {pattern: "(?i)^\\s*(true|1)\\s*$"}}}}}
    severity: error
    score: 7.0
    message: "{subject} enables XDMCP, which carries the graphical login, password included, in plain text to any host that asks for it"
    rationale: anyone watching the network can read the typed password, and anyone who reaches the host can start a login session
    fix:
      - Remove “Enable=true” from the “[xdmcp]” section of {subject}.
      - Restart gdm.
      - Then reach this desktop over SSH or a VPN.
    docs: https://help.gnome.org/admin/gdm/stable/configuration.html.en
    tags: [gdm, cis-ubuntu-26.04:1.7.6, cis-controls-v8:4.8, iso-27001-2022:A8.9, nist-800-171-r2:3.4.7, nist-800-171-r3:03.04.06, nist-800-53:CM-6, nist-800-53:CM-7, pci-dss-4:1.2.5, pci-dss-4:2.2.4, pci-dss-4:6.4.1]
  gdm/wayland-enabled:
    title: GDM offers Wayland sessions, which run X11 programs through Xwayland
    fact: gdm.config.*
    expect:
      required: [daemon]
      properties:
        daemon:
          required: [WaylandEnable]
          properties: {WaylandEnable: {contains: {pattern: "^(false|0)\\s*$"}, not: {contains: {pattern: "^(true|1)\\s*$"}}}}
    severity: info
    score: 1.0
    message: "{subject} leaves WaylandEnable on, so X11 programs in a Wayland session run under Xwayland, where any X client can read the keystrokes of the others"
    rationale: a malicious program in the desktop session can capture what the user types into every other X11 program, passwords included
    fix:
      - Set “WaylandEnable=false” in the “[daemon]” section of {subject}.
      - Restart gdm.
    docs: https://help.gnome.org/admin/gdm/stable/configuration.html.en
    tags: [gdm, cis-ubuntu-26.04:1.7.7, cis-controls-v8:4.8, iso-27001-2022:A8.9, nist-800-171-r2:3.4.7, nist-800-171-r3:03.04.06, nist-800-53:CM-6, nist-800-53:CM-7, pci-dss-4:1.2.5, pci-dss-4:2.2.4, pci-dss-4:6.4.1, '!default']
