description: Network interfaces put in promiscuous mode, which reads traffic meant for other hosts
topic: Network
tags: [default]
rules:
  interfaces/promiscuous:
    title: A network interface is in promiscuous mode
    fact: interfaces.flags.*.flags
    expect: {not: {pattern: "(^|,)PROMISC(,|$)"}}
    severity: warning
    score: 4.0
    message: "{subject} has the PROMISC flag, so it hands every frame on its segment to whatever reads it, a sniffer left running or planted"
    fix: run “ip link set {subject} promisc off”, then find what turned it on
    docs: https://man7.org/linux/man-pages/man8/ip-link.8.html
    references:
      - {title: Lynis NETW-3015, url: "https://cisofy.com/lynis/controls/NETW-3015/"}
    tags: [network, lynis]
