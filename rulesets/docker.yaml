description: Docker’s socket and configuration writable by every user, and container logs with no size limit
topic: Services
tags: [default]
rules:
  docker/world-writable:
    title: A Docker file is writable by every user
    fact: docker.files.*.world-writable
    expect: {const: false}
    severity: error
    score: 9.5
    message: "{subject} is writable by every user, who then runs containers as root through the socket, or rewrites how dockerd starts"
    rationale: any local user can start containers as root or change how Docker starts, and so take over the host
    fix: run “chmod o-w {subject}”
    remedy: {chmod: o-w}
    docs: https://docs.docker.com/engine/security/#docker-daemon-attack-surface
    references:
      - {title: Lynis CONT-8108, url: "https://cisofy.com/lynis/controls/CONT-8108/"}
    tags: [docker, lynis]
  docker/logs-unbounded:
    title: Container logs grow with no size limit
    fact: docker.daemon
    when:
      runtimes.containers: {not: {propertyNames: {not: {pattern: "/dockerd$"}}}}
      systemd.units: {not: {required: [docker.service], properties: {docker.service: {required: [sections], properties: {sections: {required: [Service], properties: {Service: {required: [ExecStart], properties: {ExecStart: {contains: {pattern: "--(log-opt|log-driver|config-file)"}}}}}}}}}}}
    expect:
      anyOf:
        - {required: [log-driver], properties: {log-driver: {not: {const: json-file}}}}
        - {required: [log-opts], properties: {log-opts: {required: [max-size]}}}
    severity: warning
    score: 4.0
    message: "dockerd writes container logs with the json-file driver and no “max-size” in its “daemon.json”, so each container’s log grows until the disk is full"
    rationale: one chatty container fills the disk, and every service on the host then fails to write
    fix:
      - 'Set these keys in “/etc/docker/daemon.json”, then restart Docker; containers created afterwards are capped:'
      - lines: ['"log-driver": "local",', '"log-opts": {"max-size": "10m", "max-file": "3"}']
      - run: systemctl restart docker
    docs: https://docs.docker.com/engine/logging/drivers/json-file/
    tags: [docker, logs, stability]
