description: A MongoDB server that any host reaching it may use without logging in
topic: Services
tags: [default]
when: {mongodb.binary: {minProperties: 1}}
rules:
  mongodb/no-authorization:
    title: MongoDB answers the network without access control
    when: {mongodb.conf: {required: [/etc/mongod.conf]}}
    facts:
      any:
        - {fact: ports, expect: {properties: {"tcp:27017": {properties: {addresses: {items: {pattern: "^(127\\.|::1$)"}}}}}}}
        - {fact: "/mongodb/conf/~1etc~1mongod.conf", expect: {required: [security], properties: {security: {required: [authorization], properties: {authorization: {const: enabled}}}}}}
        - {fact: "/mongodb/conf/~1etc~1mongod.conf", expect: {required: [security], properties: {security: {required: [keyFile], not: {required: [transitionToAuth], properties: {transitionToAuth: {const: true}}}}}}}
    severity: error
    score: 9.0
    message: "mongod listens beyond the loopback on TCP 27017 and /etc/mongod.conf leaves security.authorization unset or disabled, with no security.keyFile enforcing it, so whoever reaches it reads and drops every database"
    rationale: anyone on the network can read, change or delete all the data, and attackers routinely wipe such databases for ransom
    fix:
      - Create an administrator.
      - Then set “security.authorization” to “enabled” in “/etc/mongod.conf”.
      - Restart mongod.
    docs: https://www.mongodb.com/docs/manual/tutorial/enable-authentication/
    references:
      - {title: Lynis DBS-1820, url: "https://cisofy.com/lynis/controls/DBS-1820/"}
    tags: [database, network, lynis]
