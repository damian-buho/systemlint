description: Log files under /var/log, and the directory itself, more open or differently owned than the STIG asks
tags: [default]
rules:
  logs/file-mode:
    title: A log file is more open than 0640
    fact: logs.files.*.mode
    keys: {not: {pattern: "/([bw]tmp([.-][^/]*)?|lastlog(\\.[^/]*)?)$"}}
    when: {logs.files.*.kind: file}
    expect: {pattern: "^0[0246][04]0$"}
    severity: info
    score: 1.0
    message: "{subject} has mode {got}, beyond 0640, so other users read what services log, addresses, failed logins and leaked tokens included"
    fix: run “chmod 0640” on the file, and set the mode its writer creates it with (rsyslog “$FileCreateMode”, logrotate “create”)
    remedy: {chmod: "u-xs,g-wxs,o-rwxt"}
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/logrotate.8.html
    tags: [logging, stig-ubuntu-26.04:UBTU-24-700010, stig-ubuntu-26.04:UBTU-24-700150]
  logs/directory-mode:
    title: /var/log is more open than 0755
    fact: logs.files.*.mode
    keys: {const: /var/log}
    expect: {pattern: "^0[0-7][0145][0145]$"}
    severity: info
    score: 1.0
    message: "{subject} has mode {got}, beyond 0755, so its group can delete or replace any log in it and hide an intrusion; Ubuntu ships 0775 for its syslog group"
    fix: run “chmod 0755 /var/log”
    remedy: {chmod: "ugo-st,go-w"}
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/rsyslogd.8.html
    tags: [logging, stig-ubuntu-26.04:UBTU-24-700120]
  logs/directory-owner:
    title: /var/log is not owned by root
    fact: logs.files.*.uid
    keys: {const: /var/log}
    expect: {const: 0}
    severity: info
    score: 1.0
    message: "{subject} is owned by uid {got}, so that user can replace any log in it"
    fix: run “chown root /var/log”
    remedy: {chown: 0}
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/rsyslogd.8.html
    tags: [logging, stig-ubuntu-26.04:UBTU-24-700110]
  logs/directory-group:
    title: /var/log is not in group syslog
    fact: logs.files.*.gid
    keys: {const: /var/log}
    same: accounts.group.syslog.gid
    severity: info
    score: 1.0
    message: "{subject} belongs to gid {got}, not syslog ({same})"
    fix: run “chgrp syslog /var/log”
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/rsyslogd.8.html
    tags: [logging, stig-ubuntu-26.04:UBTU-24-700100, '!default']
  logs/syslog-owner:
    title: /var/log/syslog is not owned by syslog
    fact: logs.files.*.uid
    keys: {const: /var/log/syslog}
    same: accounts.passwd.syslog.uid
    severity: info
    score: 1.0
    message: "{subject} is owned by uid {got}, not syslog ({same})"
    fix: run “chown syslog /var/log/syslog”
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/rsyslogd.8.html
    tags: [logging, stig-ubuntu-26.04:UBTU-24-700140, '!default']
  logs/syslog-group:
    title: /var/log/syslog is not in group adm
    fact: logs.files.*.gid
    keys: {const: /var/log/syslog}
    same: accounts.group.adm.gid
    severity: info
    score: 1.0
    message: "{subject} belongs to gid {got}, not adm ({same})"
    fix: run “chgrp adm /var/log/syslog”
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/rsyslogd.8.html
    tags: [logging, stig-ubuntu-26.04:UBTU-24-700130, '!default']
  logs/cis-login-records-mode:
    title: A login record is more open than 0664
    fact: logs.files.*.mode
    keys: {pattern: "/((lastlog|wtmp|btmp)([.-][^/]*)?|README)$"}
    when: {logs.files.*.kind: file}
    expect: {pattern: "^0[0246][0246][04]$"}
    severity: info
    score: 1.0
    message: "{subject} has mode {got}; the benchmark asks 0664 or stricter for wtmp, btmp and lastlog"
    fix: run “chmod 0664” on the file, and set its mode in the “create” line of “/etc/logrotate.d/wtmp” or “/etc/logrotate.d/btmp”
    remedy: {chmod: "ugo-xst,o-w"}
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/logrotate.8.html
    tags: [logging, cis-ubuntu-26.04:6.1.3.1, '!default']
  logs/cis-readable-mode:
    title: An apt, cloud-init or agent log is more open than 0644
    fact: logs.files.*.mode
    keys: {pattern: "(/apt/[^/]+|/(cloud-init\\.log|localmessages|waagent\\.log)[^/]*)$"}
    when: {logs.files.*.kind: file}
    expect: {pattern: "^0[0246][04][04]$"}
    severity: info
    score: 1.0
    message: "{subject} has mode {got}; the benchmark asks 0644 or stricter"
    fix: run “chmod 0644” on the file
    remedy: {chmod: "u-xs,g-wxs,o-wxt"}
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/logrotate.8.html
    tags: [logging, cis-ubuntu-26.04:6.1.3.1, '!default']
  logs/cis-group-mode:
    title: An SSSD or GDM log is more open than 0660
    fact: logs.files.*.mode
    keys: {pattern: "/(SSSD|sssd|gdm|gdm3)$"}
    when: {logs.files.*.kind: file}
    expect: {pattern: "^0[0246][0246]0$"}
    severity: info
    score: 1.0
    message: "{subject} has mode {got}; the benchmark asks 0660 or stricter"
    fix: run “chmod 0660” on the file
    remedy: {chmod: "ugo-xst,o-rw"}
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/logrotate.8.html
    tags: [logging, cis-ubuntu-26.04:6.1.3.1, '!default']
  logs/cis-mode:
    title: A log file is more open than 0640
    fact: logs.files.*.mode
    keys: {not: {pattern: "/((lastlog|wtmp|btmp)([.-][^/]*)?|README)$|(/apt/[^/]+|/(cloud-init\\.log|localmessages|waagent\\.log)[^/]*)$|/(SSSD|sssd|gdm|gdm3)$"}}
    when: {logs.files.*.kind: file}
    expect: {pattern: "^0[0246][04]0$"}
    severity: info
    score: 1.0
    message: "{subject} has mode {got}; the benchmark asks 0640 or stricter for every log it names no other mode for"
    fix: run “chmod 0640” on the file, and set the mode its writer creates it with (rsyslog “$FileCreateMode”, logrotate “create”)
    remedy: {chmod: "u-xs,g-wxs,o-rwxt"}
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/logrotate.8.html
    tags: [logging, cis-ubuntu-26.04:6.1.3.1, '!default']
