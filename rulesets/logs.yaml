description: Log files under /var/log, and the directory itself, more open or differently owned than the STIG asks
topic: Logging and auditing
tags: [default]
vars:
  unrotated-bytes: {default: 1073741824}
rules:
  logs/file-mode:
    title: A log file is more open than 0640
    fact: logs.files.*.mode
    keys: {not: {pattern: "/([bw]tmp([.-][^/]*)?|lastlog(\\.[^/]*)?)$"}}
    when:
      logs.files.*.kind: file
      'logrotate.{~logrotate.*.names}': &no-open-creator
        not:
          type: object
          required: [path, directives]
          properties:
            path: {not: {pattern: "(~|,v|\\.(cfsaved|disabled|dpkg-(bak|del|dist|new|old)|rpm(new|orig|save)|swp|ucf-(dist|new|old)))$"}}
            directives:
              required: [create]
              not: {anyOf: [{required: [copytruncate]}, {required: [nocreate]}]}
              properties:
                create:
                  minItems: 1
                  prefixItems: [{anyOf: [{type: integer}, {type: string, pattern: "^[0-7]{3,4}$"}]}]
                  not: {prefixItems: [{anyOf: [{enum: [0, 40, 200, 240, 400, 440, 600, 640]}, {type: string, pattern: "^0?[0246][04]0$"}]}]}
    expect: {pattern: "^0[0246][04]0$"}
    severity: info
    score: 1.0
    message: "{subject} has mode {got}, beyond 0640, so other users read what services log, addresses, failed logins and leaked tokens included"
    rationale: any local user can read what services logged, including client addresses, failed logins and leaked tokens
    fix:
      - 'Close the file to other users now:'
      - run: chmod 0640 {subject}
      - 'Then, if it comes back at the next rotation, set 0640 where it is created: the program that writes it, or rsyslog’s “$FileCreateMode”.'
    remedy: {chmod: "u-xs,g-wxs,o-rwxt"}
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/logrotate.8.html
    tags: [logging, stig-ubuntu-26.04:UBTU-24-700010, stig-ubuntu-26.04:UBTU-24-700150]
  logs/rotation-mode:
    title: Logrotate creates new logs more open than 0640
    fact: logrotate.*.directives
    keys: {not: {pattern: "(~|,v|\\.(cfsaved|disabled|dpkg-(bak|del|dist|new|old)|rpm(new|orig|save)|swp|ucf-(dist|new|old)))(:[0-9]+)?$"}}
    when:
      logrotate.*.directives:
        required: [create]
        not: {anyOf: [{required: [copytruncate]}, {required: [nocreate]}]}
        properties: {create: {minItems: 1, prefixItems: [{anyOf: [{type: integer}, {type: string, pattern: "^[0-7]{3,4}$"}]}]}}
      logrotate.*.names: {not: {contains: {type: string, pattern: "/(lastlog|[bw]tmp)$"}}}
    expect: {properties: {create: {prefixItems: [{anyOf: [{enum: [0, 40, 200, 240, 400, 440, 600, 640]}, {type: string, pattern: "^0?[0246][04]0$"}]}]}}}
    severity: info
    score: 1.0
    message: "{subject} has logrotate create each new log with a mode beyond 0640, so every rotation opens the log to other users again, whatever “chmod” set"
    fix:
      - 'Set the mode on its “create” line to 0640, keeping its owner and group, such as:'
      - lines: ["create 0640 root adm"]
      - 'Then close the logs it already made, {suggested}, with “chmod 0640”.'
    suggest: {fact: logrotate.*.names, otherwise: the logs it names}
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/logrotate.8.html
    tags: [logging]
  logs/unrotated:
    title: A large log file is rotated by no logrotate stanza
    fact: logs.files.*.allocated
    keys: {not: {pattern: "(/lastlog|\\.journal~?|/audit/audit\\.log(\\.[0-9]+)?|[.-][0-9]+(\\.(gz|bz2|xz|zst|lz4))?|\\.(gz|bz2|xz|zst|lz4|old))$"}}
    when:
      logs.files.*.kind: file
      'logrotate.{~logrotate.*.names}': {not: {type: object}}
    expect: {maximum: "${unrotated-bytes}"}
    severity: warning
    score: 4.0
    unit: bytes
    message: "{subject} has {field} {got} and no logrotate stanza names it, so nothing caps it and it grows until /var/log fills, taking logging and every service that writes there with it"
    rationale: an unrotated log grows without limit until its filesystem is full, and then logging and the services writing there fail
    fix:
      - 'Rotate it with a stanza in a new file under “/etc/logrotate.d/”, such as for “/var/log/app.log”:'
      - lines: ["/var/log/app.log {", "    weekly", "    rotate 4", "    compress", "    missingok", "    notifempty", "}"]
      - 'If the program writing it rotates it itself, raise “unrotated-bytes” above the size it rotates at, or waive the file.'
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/logrotate.8.html
    tags: [logging, stability]
  logs/directory-mode:
    title: /var/log is more open than 0755
    fact: logs.files.*.mode
    keys: {const: /var/log}
    expect: {pattern: "^0[0-7][0145][0145]$"}
    severity: info
    score: 1.0
    message: "{subject} has mode {got}, beyond 0755, so its group can delete or replace any log in it and hide an intrusion; Ubuntu ships 0775 for its syslog group"
    rationale: members of the directory’s group can delete or swap log files, so an intruder in that group can erase their traces
    fix: run “chmod 0755 /var/log”
    remedy: {chmod: "ugo-st,go-w"}
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/rsyslogd.8.html
    tags: [logging, stig-ubuntu-26.04:UBTU-24-700120]
  logs/directory-owner:
    title: /var/log is not owned by root
    fact: logs.files.*.uid
    keys: {const: /var/log}
    expect: {const: 0}
    severity: info
    score: 1.0
    message: "{subject} is owned by uid {got}, so that user can replace any log in it"
    rationale: a non-root owner can delete or replace any log file, so whoever controls that account can erase the evidence of an intrusion
    fix: run “chown root /var/log”
    remedy: {chown: 0}
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/rsyslogd.8.html
    tags: [logging, stig-ubuntu-26.04:UBTU-24-700110, dev-sec-linux-baseline:os-11]
  logs/directory-group:
    title: /var/log is not in group syslog
    fact: logs.files.*.gid
    keys: {const: /var/log}
    same: accounts.group.syslog.gid
    severity: info
    score: 1.0
    message: "{subject} belongs to gid {got}, not syslog ({same})"
    rationale: the wrong group may write to the log directory or the logging service may fail to write, so logs can be lost or tampered with
    fix: run “chgrp syslog /var/log”
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/rsyslogd.8.html
    tags: [logging, stig-ubuntu-26.04:UBTU-24-700100, '!default']
  logs/syslog-owner:
    title: /var/log/syslog is not owned by syslog
    fact: logs.files.*.uid
    keys: {const: /var/log/syslog}
    same: accounts.passwd.syslog.uid
    severity: info
    score: 1.0
    message: "{subject} is owned by uid {got}, not syslog ({same})"
    rationale: the wrong owner of the main system log can rewrite or delete it, and the logging service may be unable to write to it
    fix: run “chown syslog /var/log/syslog”
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/rsyslogd.8.html
    tags: [logging, stig-ubuntu-26.04:UBTU-24-700140, '!default']
  logs/syslog-group:
    title: /var/log/syslog is not in group adm
    fact: logs.files.*.gid
    keys: {const: /var/log/syslog}
    same: accounts.group.adm.gid
    severity: info
    score: 1.0
    message: "{subject} belongs to gid {got}, not adm ({same})"
    rationale: the wrong group on the main system log can read it or alter it, while the admins meant to read it may be shut out
    fix: run “chgrp adm /var/log/syslog”
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/rsyslogd.8.html
    tags: [logging, stig-ubuntu-26.04:UBTU-24-700130, '!default']
  logs/cis-login-records-mode:
    title: A login record is more open than 0664
    fact: logs.files.*.mode
    keys: {pattern: "/((lastlog|wtmp|btmp)([.-][^/]*)?|README)$"}
    when: {logs.files.*.kind: file}
    expect: {pattern: "^0[0246][0246][04]$"}
    severity: info
    score: 1.0
    message: "{subject} has mode {got}; the benchmark asks 0664 or stricter for wtmp, btmp and lastlog"
    rationale: a login record open for writing lets any user erase or forge who logged in and when
    fix:
      - 'Close the file to other users now:'
      - run: chmod 0664 {subject}
      - Then set 0664 or stricter on the “create” line of “/etc/logrotate.d/wtmp” or “/etc/logrotate.d/btmp”, or it comes back at the next rotation.
    remedy: {chmod: "ugo-xst,o-w"}
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/logrotate.8.html
    tags: [logging, cis-ubuntu-26.04:6.1.3.1, '!default']
  logs/cis-readable-mode:
    title: An apt, cloud-init or agent log is more open than 0644
    fact: logs.files.*.mode
    keys: {pattern: "(/apt/[^/]+|/(cloud-init\\.log|localmessages|waagent\\.log)[^/]*)$"}
    when: {logs.files.*.kind: file}
    expect: {pattern: "^0[0246][04][04]$"}
    severity: info
    score: 1.0
    message: "{subject} has mode {got}; the benchmark asks 0644 or stricter"
    rationale: a log open for writing lets any user edit the history of package installs or agent activity to hide their tracks
    fix: run “chmod 0644” on the file
    remedy: {chmod: "u-xs,g-wxs,o-wxt"}
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/logrotate.8.html
    tags: [logging, cis-ubuntu-26.04:6.1.3.1, '!default']
  logs/cis-group-mode:
    title: An SSSD or GDM log is more open than 0660
    fact: logs.files.*.mode
    keys: {pattern: "/(SSSD|sssd|gdm|gdm3)$"}
    when: {logs.files.*.kind: file}
    expect: {pattern: "^0[0246][0246]0$"}
    severity: info
    score: 1.0
    message: "{subject} has mode {got}; the benchmark asks 0660 or stricter"
    rationale: a login or session log open to other users lets them read which accounts signed in, or alter that record
    fix: run “chmod 0660” on the file
    remedy: {chmod: "ugo-xst,o-rw"}
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/logrotate.8.html
    tags: [logging, cis-ubuntu-26.04:6.1.3.1, '!default']
  logs/cis-mode:
    title: A log file is more open than 0640
    fact: logs.files.*.mode
    keys: {not: {pattern: "/((lastlog|wtmp|btmp)([.-][^/]*)?|README)$|(/apt/[^/]+|/(cloud-init\\.log|localmessages|waagent\\.log)[^/]*)$|/(SSSD|sssd|gdm|gdm3)$"}}
    when:
      logs.files.*.kind: file
      'logrotate.{~logrotate.*.names}': *no-open-creator
    expect: {pattern: "^0[0246][04]0$"}
    severity: info
    score: 1.0
    message: "{subject} has mode {got}; the benchmark asks 0640 or stricter for every log it names no other mode for"
    rationale: any local user can read what services logged, including client addresses, failed logins and leaked tokens
    fix:
      - 'Close the file to other users now:'
      - run: chmod 0640 {subject}
      - 'Then, if it comes back at the next rotation, set 0640 where it is created: the program that writes it, or rsyslog’s “$FileCreateMode”.'
    remedy: {chmod: "u-xs,g-wxs,o-rwxt"}
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/logrotate.8.html
    tags: [logging, cis-ubuntu-26.04:6.1.3.1, '!default']
