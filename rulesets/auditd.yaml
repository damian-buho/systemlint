description: An audit daemon that is missing, not running, records nothing or nothing before it starts, drops records when its disk fills, or lets other users read its logs
topic: Logging and auditing
tags: [default]
vars:
  audit-backlog-limit: {default: 8192}
  audit-max-log-file: {default: 8}
rules:
  auditd/not-installed:
    title: The audit daemon is not installed
    fact: auditd.binary
    expect: {minProperties: 1}
    severity: info
    score: 3.0
    message: "no auditd program is in /usr/sbin, /sbin or /usr/local/sbin, so no audit record is kept on disk"
    fix:
      - 'Install auditd, on Ubuntu with:'
      - run: apt install auditd audispd-plugins
      - Then add rules to “/etc/audit/rules.d/”.
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/auditd.8.html
    tags: [audit, cis-ubuntu-26.04:6.2.1.1, stig-ubuntu-26.04:UBTU-24-100400, '!default']
  auditd/boot-unaudited:
    title: Processes started before auditd go unaudited
    fact: kernel.cmdline
    when: {auditd.binary: {minProperties: 1}}
    expect: {required: [audit], properties: {audit: {anyOf: [{const: 1}, {type: string, pattern: "(?i)^on$"}]}}}
    severity: info
    score: 2.0
    message: "the running kernel was booted without audit=1, so whatever starts before auditd.service leaves no audit record"
    fix:
      - Append “audit=1” to “GRUB_CMDLINE_LINUX” in a file ending in “.cfg” under “/etc/default/grub.d/”, keeping the value it extends.
      - 'Then run:'
      - run: update-grub
      - Then reboot.
    docs: https://docs.kernel.org/admin-guide/kernel-parameters.html
    tags: [audit, cis-ubuntu-26.04:6.2.1.3, stig-ubuntu-26.04:UBTU-24-102010]
  auditd/boot-backlog:
    title: The audit backlog is too small while the system boots
    fact: kernel.cmdline
    when: {auditd.binary: {minProperties: 1}}
    expect:
      not: {propertyNames: {not: {pattern: "^audit[-_]backlog[-_]limit$"}}}
      patternProperties: {"^audit[-_]backlog[-_]limit$": {type: integer, minimum: "${audit-backlog-limit}"}}
    severity: info
    score: 2.0
    message: "audit_backlog_limit on the running kernel’s command line is unset (64) or below ${audit-backlog-limit}, so records queued before auditd reads them can be lost"
    fix:
      - Append “audit_backlog_limit=${audit-backlog-limit}” to “GRUB_CMDLINE_LINUX” in a file ending in “.cfg” under “/etc/default/grub.d/”, keeping the value it extends.
      - 'Then run:'
      - run: update-grub
      - Then reboot.
    docs: https://docs.kernel.org/admin-guide/kernel-parameters.html
    tags: [audit, cis-ubuntu-26.04:6.2.1.4]
  auditd/disabled:
    title: auditd is installed but not enabled
    fact: systemd.state.*.enabled
    keys: {const: auditd.service}
    when: {auditd.binary: {minProperties: 1}}
    expect: {const: true}
    severity: info
    score: 3.0
    message: "auditd.service is not enabled, so after the next boot no audit record is written"
    fix:
      - 'Let the service start again:'
      - run: systemctl unmask auditd.service
      - 'Then enable and start it:'
      - run: systemctl enable --now auditd.service
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/auditd.8.html
    tags: [audit, cis-ubuntu-26.04:6.2.1.2, stig-ubuntu-26.04:UBTU-24-100410]
  auditd/inactive:
    title: auditd is installed but not running
    fact: systemd.state.*.active
    keys: {const: auditd.service}
    when: {auditd.binary: {minProperties: 1}, systemd.state.*: {required: [active]}}
    expect: {const: active}
    severity: info
    score: 3.0
    message: "auditd.service is {got}, so the kernel’s audit records go nowhere they are kept"
    fix:
      - 'Start the service:'
      - run: systemctl start auditd.service
      - 'If it stops again, read why:'
      - run: journalctl --unit auditd.service
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/auditd.8.html
    references:
      - {title: Lynis ACCT-9628, url: "https://cisofy.com/lynis/controls/ACCT-9628/"}
    tags: [audit, lynis, cis-ubuntu-26.04:6.2.1.2]
  auditd/no-rules:
    title: auditd runs with no audit rule loaded
    fact: audit.loaded
    when: {auditd.binary: {minProperties: 1}, systemd.state: {required: [auditd.service], properties: {auditd.service: {required: [active], properties: {active: {const: active}}}}}}
    expect: {minProperties: 1, not: {additionalProperties: {not: {contains: {anyOf: [{required: ["-a"]}, {required: ["-w"]}]}}}}}
    severity: info
    score: 3.0
    message: "auditctl -l lists no rule, so auditd runs and records only what the kernel logs on its own"
    fix:
      - Add the rules you need to a file ending in “.rules” under “/etc/audit/rules.d/”.
      - 'Then load them:'
      - run: augenrules --load
      - Or stop and disable auditd.service instead.
    docs: https://man7.org/linux/man-pages/man7/audit.rules.7.html
    references:
      - {title: Lynis ACCT-9630, url: "https://cisofy.com/lynis/controls/ACCT-9630/"}
    tags: [audit, lynis]
  auditd/deletes-logs:
    title: auditd deletes old audit logs
    fact: auditd.conf
    when: {auditd.binary: {minProperties: 1}}
    expect:
      not: {propertyNames: {not: {pattern: "(?i)^max_log_file_action$"}}}
      patternProperties: {"(?i)^max_log_file_action$": {pattern: "(?i)^keep_logs$"}}
    severity: info
    score: 2.0
    message: "max_log_file_action in /etc/audit/auditd.conf is not keep_logs (unset means rotate), so auditd deletes the oldest log once num_logs are full"
    fix:
      - 'Set this line in “/etc/audit/auditd.conf”:'
      - lines: ["max_log_file_action = keep_logs"]
      - 'Then restart the service:'
      - run: systemctl restart auditd.service
      - Watch the free space the logs then use.
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/auditd.conf.5.html
    tags: [audit, cis-ubuntu-26.04:6.2.2.2, '!default']
  auditd/full-disk:
    title: auditd carries on when its disk is full or fails
    fact: auditd.conf
    when: {auditd.binary: {minProperties: 1}}
    expect:
      allOf:
        - not: {propertyNames: {not: {pattern: "(?i)^disk_full_action$"}}}
        - not: {propertyNames: {not: {pattern: "(?i)^disk_error_action$"}}}
      patternProperties:
        "(?i)^disk_full_action$": {pattern: "(?i)^(halt|single)$"}
        "(?i)^disk_error_action$": {pattern: "(?i)^(syslog|single|halt)$"}
    severity: info
    score: 2.0
    message: "disk_full_action in /etc/audit/auditd.conf is not halt or single, or disk_error_action is not syslog, single or halt (unset means suspend), so the host keeps running with no audit record written"
    fix:
      - 'Set these lines in “/etc/audit/auditd.conf”:'
      - lines: ["disk_full_action = single", "disk_error_action = single"]
      - 'Then restart the service:'
      - run: systemctl restart auditd.service
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/auditd.conf.5.html
    tags: [audit, cis-ubuntu-26.04:6.2.2.3, '!default']
  auditd/low-space:
    title: auditd gives no warning when its disk runs low
    fact: auditd.conf
    when: {auditd.binary: {minProperties: 1}}
    expect:
      allOf:
        - not: {propertyNames: {not: {pattern: "(?i)^space_left_action$"}}}
        - not: {propertyNames: {not: {pattern: "(?i)^admin_space_left_action$"}}}
      patternProperties:
        "(?i)^space_left_action$": {pattern: "(?i)^(email|exec|single|halt)$"}
        "(?i)^admin_space_left_action$": {pattern: "(?i)^(single|halt)$"}
    severity: info
    score: 2.0
    message: "space_left_action in /etc/audit/auditd.conf is not email, exec, single or halt, or admin_space_left_action is not single or halt, so nobody hears of a filling audit disk before records are lost"
    fix:
      - 'Set these lines in “/etc/audit/auditd.conf”:'
      - lines: ["space_left_action = email", "action_mail_acct = root", "admin_space_left_action = single"]
      - 'Then restart the service:'
      - run: systemctl restart auditd.service
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/auditd.conf.5.html
    tags: [audit, cis-ubuntu-26.04:6.2.2.4]
  auditd/log-mode:
    title: An audit log is readable too widely
    fact: auditd.logs.*.mode
    when: {auditd.binary: {minProperties: 1}, auditd.logs.*.kind: file}
    expect: {pattern: "^0[0246][04]0$"}
    severity: warning
    score: 5.0
    message: "{subject} has mode {got}; audit records hold the commands and files of every user, so they need 0640 or stricter"
    fix:
      - 'Limit the file to its owner and group:'
      - run: chmod 0640 {subject}
      - Then set “log_group” in “/etc/audit/auditd.conf” to the group that reads audit logs.
    remedy: {chmod: "u-xs,g-wxs,o-rwxt"}
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/auditd.conf.5.html
    tags: [default, audit, cis-ubuntu-26.04:6.2.4.1]
  auditd/log-owner:
    title: An audit log is not owned by root
    fact: auditd.logs.*.uid
    when: {auditd.binary: {minProperties: 1}, auditd.logs.*.kind: file}
    expect: {const: 0}
    severity: warning
    score: 5.0
    message: "{subject} is owned by uid {got}, so that user can rewrite or truncate the audit records"
    fix: run “chown root” on the file
    remedy: {chown: 0}
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/auditd.conf.5.html
    tags: [default, audit, cis-ubuntu-26.04:6.2.4.2, stig-ubuntu-26.04:UBTU-24-901310]
  auditd/log-directory-mode:
    title: The audit log directory is open too widely
    fact: auditd.logs.*.mode
    when: {auditd.binary: {minProperties: 1}, auditd.logs.*.kind: directory}
    expect: {pattern: "^[0-7]{2}[0145]0$"}
    severity: warning
    score: 5.0
    message: "{subject} has mode {got}; other users can list the audit logs, or its group can replace them, so it needs 0750 or stricter"
    fix: run “chmod 0750” on the directory
    remedy: {chmod: "g-w,o-rwx"}
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/auditd.conf.5.html
    tags: [default, audit, cis-ubuntu-26.04:6.2.4.4, stig-ubuntu-26.04:UBTU-24-901380]
  auditd/stig-log-mode:
    title: An audit log is readable by its group
    fact: auditd.logs.*.mode
    when: {auditd.binary: {minProperties: 1}, auditd.logs.*.kind: file}
    expect: {pattern: "^0[0246]00$"}
    severity: info
    score: 1.0
    message: "{subject} has mode {got}; the STIG asks 0600, readable by root alone"
    fix:
      - 'Limit the file to root:'
      - run: chmod 0600 {subject}
      - 'Then set this line in “/etc/audit/auditd.conf”:'
      - lines: ["log_group = root"]
    remedy: {chmod: "u-xs,g-rwxs,o-rwxt"}
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/auditd.conf.5.html
    tags: [audit, stig-ubuntu-26.04:UBTU-24-901300, '!default']
  auditd/stig-log-group:
    title: An audit log is not in group root
    fact: auditd.logs.*.gid
    when: {auditd.binary: {minProperties: 1}, auditd.logs.*.kind: file}
    expect: {const: 0}
    severity: info
    score: 1.0
    message: "{subject} belongs to gid {got}; the STIG asks group root"
    fix:
      - 'Give the file to group root:'
      - run: chgrp 0 {subject}
      - 'Then set this line in “/etc/audit/auditd.conf”:'
      - lines: ["log_group = root"]
    remedy: {chgrp: 0}
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/auditd.conf.5.html
    tags: [audit, stig-ubuntu-26.04:UBTU-24-901350, '!default']
  auditd/stig-no-remote:
    title: Audit records are kept on this host alone
    fact: auditd.remote
    when: {auditd.binary: {minProperties: 1}}
    expect: {required: [active, remote_server], properties: {active: {pattern: "(?i)^yes$"}, remote_server: {type: string, minLength: 1}}}
    severity: info
    score: 1.0
    message: "the au-remote plugin is not active, or audisp-remote.conf names no remote_server, so whoever takes root here can erase the only copy of the audit trail"
    fix:
      - Install audispd-plugins.
      - 'Set this line in “/etc/audit/plugins.d/au-remote.conf”:'
      - lines: ["active = yes"]
      - Set “remote_server” in “/etc/audit/audisp-remote.conf”.
      - 'Then restart the service:'
      - run: systemctl restart auditd.service
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/audisp-remote.conf.5.html
    tags: [audit, stig-ubuntu-26.04:UBTU-24-100450, '!default']
  auditd/stig-space-left:
    title: auditd mails no warning at a quarter of its disk left
    fact: auditd.conf
    when: {auditd.binary: {minProperties: 1}}
    expect:
      allOf:
        - not: {propertyNames: {not: {pattern: "(?i)^space_left_action$"}}}
        - not: {propertyNames: {not: {pattern: "(?i)^space_left$"}}}
      patternProperties:
        "(?i)^space_left_action$": {pattern: "(?i)^email$"}
        "(?i)^space_left$": {type: string, pattern: "^(2[5-9]|[3-9][0-9]|100)%$"}
    severity: info
    score: 1.0
    message: "auditd.conf does not set space_left_action = email with space_left at 25% or more, as the STIG asks"
    fix:
      - 'Set these lines in “/etc/audit/auditd.conf”:'
      - lines: ["space_left = 25%", "space_left_action = email"]
      - 'Then restart the service:'
      - run: systemctl restart auditd.service
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/auditd.conf.5.html
    tags: [audit, stig-ubuntu-26.04:UBTU-24-900960, '!default']
  auditd/stig-mail-account:
    title: auditd mails its warnings to someone other than root
    fact: auditd.conf
    when: {auditd.binary: {minProperties: 1}}
    expect: {patternProperties: {"(?i)^action_mail_acct$": {const: root}}}
    severity: info
    score: 1.0
    message: "action_mail_acct in /etc/audit/auditd.conf is not root, where the STIG asks root"
    fix: set “action_mail_acct = root” in “/etc/audit/auditd.conf”, and forward root’s mail to the administrators
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/auditd.conf.5.html
    tags: [audit, stig-ubuntu-26.04:UBTU-24-900980, '!default']
  auditd/max-log-file:
    title: Audit logs rotate below the site’s size
    fact: auditd.conf
    when: {auditd.binary: {minProperties: 1}}
    expect: {patternProperties: {"(?i)^max_log_file$": {type: integer, minimum: "${audit-max-log-file}"}}}
    severity: info
    score: 1.0
    message: "max_log_file in /etc/audit/auditd.conf is below ${audit-max-log-file} MB, so each audit log holds less than the site asks before it rotates"
    fix:
      - 'Set this line, or a larger number, in “/etc/audit/auditd.conf”:'
      - lines: ["max_log_file = ${audit-max-log-file}"]
      - 'Then restart the service:'
      - run: systemctl restart auditd.service
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/auditd.conf.5.html
    tags: [audit, cis-ubuntu-26.04:6.2.2.1]
  auditd/log-group:
    title: auditd writes its logs for a group other than root or adm
    fact: auditd.conf
    when: {auditd.binary: {minProperties: 1}}
    expect: {patternProperties: {"(?i)^log_group$": {enum: [root, adm, 0]}}}
    severity: info
    score: 1.0
    message: "log_group in /etc/audit/auditd.conf is not root or adm, so that group reads every audit record"
    fix:
      - 'Set this line, or “log_group = root”, in “/etc/audit/auditd.conf”:'
      - lines: ["log_group = adm"]
      - 'Then restart the service:'
      - run: systemctl restart auditd.service
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/auditd.conf.5.html
    tags: [audit, cis-ubuntu-26.04:6.2.4.3]
  auditd/log-file-group:
    title: An audit log is in a group other than root or adm
    fact: auditd.logs.*.gid
    same: accounts.group.adm.gid
    when: {auditd.binary: {minProperties: 1}, auditd.logs.*.kind: file, auditd.logs.*.gid: {not: {const: 0}}}
    severity: info
    score: 1.0
    message: "{subject} belongs to gid {got}, neither root nor adm ({same}), so that group reads every audit record"
    fix:
      - 'Give the file to group adm:'
      - run: chgrp adm {subject}
      - 'Then set this line in “/etc/audit/auditd.conf”:'
      - lines: ["log_group = adm"]
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/auditd.conf.5.html
    tags: [audit, cis-ubuntu-26.04:6.2.4.3]
