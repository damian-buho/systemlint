description: An installed audit daemon that is not running, records nothing, drops records when its disk fills, or lets other users read its logs
when: {auditd.binary: {minProperties: 1}}
rules:
  auditd/disabled:
    title: auditd installed but not enabled
    fact: systemd.state.*.enabled
    keys: {const: auditd.service}
    expect: {const: true}
    severity: info
    score: 3.0
    message: "auditd.service is not enabled, so after the next boot no audit record is written"
    fix: run systemctl unmask auditd.service, then systemctl enable --now auditd.service
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/auditd.8.html
    tags: [audit, cis-ubuntu-26.04:6.2.1.2]
  auditd/inactive:
    title: auditd installed but not running
    fact: systemd.state.*.active
    keys: {const: auditd.service}
    when: {systemd.state.*: {required: [active]}}
    expect: {const: active}
    severity: info
    score: 3.0
    message: "auditd.service is {got}, so the kernel’s audit records go nowhere they are kept"
    fix: run systemctl start auditd.service, then read journalctl --unit auditd.service if it stops again
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/auditd.8.html
    references:
      - {title: Lynis ACCT-9628, url: "https://cisofy.com/lynis/controls/ACCT-9628/"}
    tags: [audit, lynis, cis-ubuntu-26.04:6.2.1.2]
  auditd/no-rules:
    title: auditd runs with no audit rule loaded
    fact: audit.loaded
    when: {systemd.state: {required: [auditd.service], properties: {auditd.service: {required: [active], properties: {active: {const: active}}}}}}
    expect: {minProperties: 1, not: {additionalProperties: {not: {contains: {anyOf: [{required: ["-a"]}, {required: ["-w"]}]}}}}}
    severity: info
    score: 3.0
    message: "auditctl -l lists no rule, so auditd runs and records only what the kernel logs on its own"
    fix: add the rules you need to a .rules file in /etc/audit/rules.d/, then run augenrules --load; or stop and disable auditd.service
    docs: https://man7.org/linux/man-pages/man7/audit.rules.7.html
    references:
      - {title: Lynis ACCT-9630, url: "https://cisofy.com/lynis/controls/ACCT-9630/"}
    tags: [audit, lynis]
  auditd/deletes-logs:
    title: auditd deletes old audit logs
    fact: auditd.conf
    expect:
      not: {propertyNames: {not: {pattern: "(?i)^max_log_file_action$"}}}
      patternProperties: {"(?i)^max_log_file_action$": {pattern: "(?i)^keep_logs$"}}
    severity: info
    score: 2.0
    message: "max_log_file_action in /etc/audit/auditd.conf is not keep_logs (unset means rotate), so auditd deletes the oldest log once num_logs are full"
    fix: set max_log_file_action = keep_logs in /etc/audit/auditd.conf, watch the free space it then uses, and run systemctl restart auditd.service
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/auditd.conf.5.html
    tags: [audit, cis-ubuntu-26.04:6.2.2.2]
  auditd/full-disk:
    title: auditd carries on when its disk is full or fails
    fact: auditd.conf
    expect:
      allOf:
        - not: {propertyNames: {not: {pattern: "(?i)^disk_full_action$"}}}
        - not: {propertyNames: {not: {pattern: "(?i)^disk_error_action$"}}}
      patternProperties:
        "(?i)^disk_full_action$": {pattern: "(?i)^(halt|single)$"}
        "(?i)^disk_error_action$": {pattern: "(?i)^(syslog|single|halt)$"}
    severity: info
    score: 2.0
    message: "disk_full_action in /etc/audit/auditd.conf is not halt or single, or disk_error_action is not syslog, single or halt (unset means suspend), so the host keeps running with no audit record written"
    fix: set disk_full_action = single and disk_error_action = single in /etc/audit/auditd.conf, then run systemctl restart auditd.service
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/auditd.conf.5.html
    tags: [audit, cis-ubuntu-26.04:6.2.2.3]
  auditd/low-space:
    title: auditd gives no warning when its disk runs low
    fact: auditd.conf
    expect:
      allOf:
        - not: {propertyNames: {not: {pattern: "(?i)^space_left_action$"}}}
        - not: {propertyNames: {not: {pattern: "(?i)^admin_space_left_action$"}}}
      patternProperties:
        "(?i)^space_left_action$": {pattern: "(?i)^(email|exec|single|halt)$"}
        "(?i)^admin_space_left_action$": {pattern: "(?i)^(single|halt)$"}
    severity: info
    score: 2.0
    message: "space_left_action in /etc/audit/auditd.conf is not email, exec, single or halt, or admin_space_left_action is not single or halt, so nobody hears of a filling audit disk before records are lost"
    fix: set space_left_action = email with action_mail_acct = root, and admin_space_left_action = single, in /etc/audit/auditd.conf, then run systemctl restart auditd.service
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/auditd.conf.5.html
    tags: [audit, cis-ubuntu-26.04:6.2.2.4]
  auditd/log-mode:
    title: Audit log readable too widely
    fact: auditd.logs.*.mode
    when: {auditd.logs.*.kind: file}
    expect: {pattern: "^0[0246][04]0$"}
    severity: warning
    score: 5.0
    message: "{subject} has mode {got}; audit records hold the commands and files of every user, so they need 0640 or stricter"
    fix: chmod 0640 the file, and set log_group in /etc/audit/auditd.conf to the group that reads audit logs
    remedy: {chmod: "u-xs,g-wxs,o-rwxt"}
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/auditd.conf.5.html
    tags: [default, audit, cis-ubuntu-26.04:6.2.4.1]
  auditd/log-directory-mode:
    title: Audit log directory open too widely
    fact: auditd.logs.*.mode
    when: {auditd.logs.*.kind: directory}
    expect: {pattern: "^[0-7]{2}[0145]0$"}
    severity: warning
    score: 5.0
    message: "{subject} has mode {got}; other users can list the audit logs, or its group can replace them, so it needs 0750 or stricter"
    fix: chmod 0750 the directory
    remedy: {chmod: "g-w,o-rwx"}
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/auditd.conf.5.html
    tags: [default, audit, cis-ubuntu-26.04:6.2.4.4]
