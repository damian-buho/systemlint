description: Network settings that let a flood exhaust this host or use it to amplify an attack
tags: [default]
rules:
  ip-flood/syncookies:
    title: SYN cookies off
    fact: sysctl.settings.net.ipv4.tcp_syncookies
    expect: {minimum: 1}
    severity: warning
    score: 4.5
    message: "net.ipv4.tcp_syncookies is {got}, so a SYN flood fills the connection backlog and the host stops accepting TCP connections"
    fix: set net.ipv4.tcp_syncookies = 1
    docs: https://docs.kernel.org/networking/ip-sysctl.html
    references:
      - {title: Lynis KRNL-6000, url: "https://cisofy.com/lynis/controls/KRNL-6000/"}
    tags: [ip-flood, sysctl, lynis]
  ip-flood/broadcast-echo:
    title: Broadcast pings answered
    fact: sysctl.settings.net.ipv4.icmp_echo_ignore_broadcasts
    expect: {const: 1}
    severity: warning
    score: 4.0
    message: "net.ipv4.icmp_echo_ignore_broadcasts is {got}, so the host answers pings sent to a broadcast address and can amplify a smurf attack"
    fix: set net.ipv4.icmp_echo_ignore_broadcasts = 1
    docs: https://docs.kernel.org/networking/ip-sysctl.html
    references:
      - {title: Lynis KRNL-6000, url: "https://cisofy.com/lynis/controls/KRNL-6000/"}
    tags: [ip-flood, sysctl, lynis]
  ip-flood/bogus-icmp-errors:
    title: Bogus ICMP error replies logged
    fact: sysctl.settings.net.ipv4.icmp_ignore_bogus_error_responses
    expect: {const: 1}
    severity: info
    score: 2.0
    message: "net.ipv4.icmp_ignore_bogus_error_responses is {got}, so the kernel logs a warning for every malformed ICMP error a router or sender returns, and a flood of them fills the log"
    fix: set net.ipv4.icmp_ignore_bogus_error_responses = 1, the kernel default
    docs: https://docs.kernel.org/networking/ip-sysctl.html
    tags: [ip-flood, sysctl, cis-ubuntu-26.04:3.3.1.6, dev-sec-linux-baseline:sysctl-03]
