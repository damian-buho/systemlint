description: A Postfix server that tells strangers which addresses exist
tags: [default]
when: {postfix.binary: {minProperties: 1}}
rules:
  postfix/vrfy:
    title: Postfix answers VRFY
    fact: postfix.vrfy
    expect: {required: ["yes"]}
    severity: info
    score: 1.0
    message: "postconf reports disable_vrfy_command = no, so any SMTP client asks which local addresses exist and builds a list to target"
    fix: run “postconf -e disable_vrfy_command=yes”, then “postfix reload”
    docs: https://www.postfix.org/postconf.5.html#disable_vrfy_command
    references:
      - {title: Lynis MAIL-8820, url: "https://cisofy.com/lynis/controls/MAIL-8820/"}
    tags: [mail, lynis]
