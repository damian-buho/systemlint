description: A MySQL or MariaDB data directory other users may enter
tags: [default]
rules:
  mysql/datadir-open:
    title: The MySQL data directory reaches other users
    fact: mysql.datadir.*.mode
    when: {mysql.datadir.*.kind: directory}
    expect: {pattern: "^[0-7]{3}0$"}
    severity: info
    score: 1.0
    message: "{subject} has mode {got}, so every user lists the databases in it, and reads any table file whose own mode allows"
    fix: run “chmod 0750 {subject}”, keeping it owned by mysql
    remedy: {chmod: o-rwx}
    docs: https://dev.mysql.com/doc/refman/8.4/en/general-security-issues.html
    tags: [database]
