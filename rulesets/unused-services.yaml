    docs: https://manpages.ubuntu.com/manpages/resolute/man8/named.8.html
    tags: [services, cis-ubuntu-26.04:2.1.4]
  unused-services/dnsmasq:
    title: Dnsmasq is enabled or running
    fact: systemd.state.*
    keys: {enum: [dnsmasq.service]}
    expect: *off
    severity: info
    score: 2.0
    message: "{subject} is enabled or running: dnsmasq serves DNS and DHCP to the network, a service to leave off unless this host offers it"
    fix: run “systemctl mask --now {subject}”, or remove its package, unless this host serves it on purpose
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/dnsmasq.8.html
    tags: [services, cis-ubuntu-26.04:2.1.5]
  unused-services/ftp-server:
