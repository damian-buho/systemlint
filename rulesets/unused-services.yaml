    expect: *off
    severity: info
    score: 2.0
    message: "{subject} is enabled or running: the SNMP daemon answers SNMP queries about this host, a service to leave off unless this host offers it"
    fix: run “systemctl mask --now {subject}”, or remove its package, unless this host serves it on purpose
