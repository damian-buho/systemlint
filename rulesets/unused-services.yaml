    expect: *off
    severity: info
    score: 2.0
    message: "{subject} is enabled or running: the vsftpd FTP server serves files over FTP, a service to leave off unless this host offers it"
    fix: run “systemctl mask --now {subject}”, or remove its package, unless this host serves it on purpose
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/vsftpd.8.html
