    fact: systemd.state.*
    keys: {enum: [kea-dhcp-ddns-server.service, kea-dhcp4-server.service, kea-dhcp6-server.service]}
    expect: *off
    severity: info
    score: 2.0
    message: "{subject} is enabled or running: a Kea DHCP server hands out addresses and routes to any host on the network, a service to leave off unless this host offers it"
    fix: run “systemctl mask --now {subject}”, or remove its package, unless this host serves it on purpose
    docs: https://kea.readthedocs.io/
    tags: [services, cis-ubuntu-26.04:2.1.3]
