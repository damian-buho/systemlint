description: Network services a CIS benchmark asks to leave off unless the host serves them on purpose
tags: [services]
rules:
  unused-services/autofs:
    title: The automounter is enabled or running
    fact: systemd.state.*
    keys: {enum: [autofs.service]}
    expect: &off
      anyOf:
        - {properties: {masked: {const: true}}, required: [masked]}
        - properties:
            enabled: {const: false}
            active: {not: {enum: [active, activating, reloading]}}
    severity: info
    score: 2.0
    message: "{subject} is enabled or running: the automounter mounts removable media and network shares on access, a service to leave off unless this host offers it"
    fix: run “systemctl mask --now {subject}”, or remove its package, unless this host serves it on purpose
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/automount.8.html
    tags: [services, cis-ubuntu-26.04:2.1.1]
  unused-services/avahi:
    title: The Avahi mDNS daemon is enabled or running
    fact: systemd.state.*
    keys: {enum: [avahi-daemon.service, avahi-daemon.socket]}
    expect: *off
    severity: info
    score: 2.0
    message: "{subject} is enabled or running: the Avahi mDNS daemon announces this host and its services to the local network, a service to leave off unless this host offers it"
    fix: run “systemctl mask --now {subject}”, or remove its package, unless this host serves it on purpose
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/avahi-daemon.8.html
    tags: [services, cis-ubuntu-26.04:2.1.2]
  unused-services/dhcp-server:
