description: Local accounts and groups that share an identity, hide behind a repeated name or open without a password
tags: [default]
vars:
  password-max-days: {default: 365}
  password-min-days: {default: 1}
  password-warn-days: {default: 7}
  password-inactive-days: {default: 45}
rules:
  accounts/uid-zero:
    title: An account other than root has uid 0
    fact: accounts.passwd.*.uid
    keys: {not: {const: root}}
    expect: {not: {const: 0}}
    severity: error
    score: 8.0
    message: "{subject} has uid 0 in /etc/passwd, so it holds every privilege root does under another name"
    fix: give {subject} its own uid with usermod --uid, or remove it with userdel if nobody needs it
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/passwd.5.html
    references:
      - {title: Lynis AUTH-9204, url: "https://cisofy.com/lynis/controls/AUTH-9204/"}
    tags: [accounts, lynis]
  accounts/uid-unique:
    title: Accounts share a uid
    fact: accounts.passwd.*.uid
    when: {accounts.passwd.*.uid: {not: {const: 0}}}
    unique: true
    severity: warning
    score: 5.0
    message: "{subject} shares uid {got} with {others}, so each owns the other’s files and processes"
    fix: give {subject} a uid of its own with usermod --uid, then chown what it should own
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/passwd.5.html
    references:
      - {title: Lynis AUTH-9208, url: "https://cisofy.com/lynis/controls/AUTH-9208/"}
    tags: [accounts, lynis]
  accounts/gid-unique:
    title: Groups share a gid
    fact: accounts.group.*.gid
    unique: true
    severity: warning
    score: 5.0
    message: "{subject} shares gid {got} with {others}, so a member of one gets the other’s file access"
    fix: give {subject} a gid of its own with groupmod --gid, then chgrp what it should own
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/group.5.html
    references:
      - {title: Lynis AUTH-9222, url: "https://cisofy.com/lynis/controls/AUTH-9222/"}
    tags: [accounts, lynis]
  accounts/user-repeated:
    title: A user name appears twice in /etc/passwd
    fact: accounts.passwd.*.shadowed
    expect: {maxItems: 0}
    severity: warning
    score: 4.0
    message: "{subject} appears again on line(s) {got} of /etc/passwd, which the system never reads, since the first line wins"
    fix: merge what you meant into the first {subject} line of /etc/passwd and delete the later one with vipw
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/passwd.5.html
    tags: [accounts]
  accounts/group-repeated:
    title: A group name appears twice in /etc/group
    fact: accounts.group.*.shadowed
    expect: {maxItems: 0}
    severity: warning
    score: 4.0
    message: "{subject} appears again on line(s) {got} of /etc/group, which the system never reads, since the first line wins"
    fix: merge the members you meant into the first {subject} line of /etc/group and delete the later one with vigr
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/group.5.html
    references:
      - {title: Lynis AUTH-9226, url: "https://cisofy.com/lynis/controls/AUTH-9226/"}
    tags: [accounts, lynis]
  accounts/passwd-empty-password:
    title: An account has an empty password field in /etc/passwd
    fact: accounts.passwd.*.password
    expect: {not: {const: empty}}
    severity: error
    score: 8.0
    message: "{subject} has an empty password field in /etc/passwd, so any service that allows empty passwords lets it in without one"
    fix: run passwd {subject} to set a password, or passwd --lock {subject} if nobody logs in as it
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/passwd.5.html
    references:
      - {title: Lynis AUTH-9283, url: "https://cisofy.com/lynis/controls/AUTH-9283/"}
    tags: [accounts, lynis]
  accounts/passwd-hash:
    title: An account keeps its password hash in /etc/passwd
    fact: accounts.passwd.*.password
    expect: {not: {const: hash}}
    severity: error
    score: 7.0
    message: "{subject} keeps its password hash in /etc/passwd, which every local user can read, so anyone on the host can crack it offline"
    fix: run pwconv to move the hash into /etc/shadow, then passwd {subject} to set a new password, since the old one may already be cracked
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/pwconv.8.html
    tags: [accounts, cis-ubuntu-26.04:7.2.1, stig-ubuntu-26.04:UBTU-24-400220, dev-sec-linux-baseline:os-03b]
  accounts/shadow-empty-password:
    title: An account has an empty password in /etc/shadow
    fact: accounts.shadow.*.password
    when: {accounts.passwd.*.password: shadow}
    expect: {not: {const: empty}}
    severity: error
    score: 8.0
    message: "{subject} has an empty password in /etc/shadow, so any service that allows empty passwords lets it in without one"
    fix: run passwd {subject} to set a password, or passwd --lock {subject} if nobody logs in as it
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/shadow.5.html
    references:
      - {title: Lynis AUTH-9283, url: "https://cisofy.com/lynis/controls/AUTH-9283/"}
    tags: [accounts, lynis]
  accounts/shadow-missing:
    title: An account defers to /etc/shadow, which has no line for it
    fact: accounts.shadow.*.password
    expect: {not: {const: missing}}
    severity: info
    score: 2.0
    message: "{subject} defers to /etc/shadow in /etc/passwd, but /etc/shadow has no line for it, so its password, lock and ageing live nowhere and pwck reports the entry as broken"
    fix: run pwconv to give {subject} its /etc/shadow line, then passwd {subject} to set a password or passwd --lock {subject} if nobody logs in as it
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/pwck.8.html
    references:
      - {title: Lynis AUTH-9228, url: "https://cisofy.com/lynis/controls/AUTH-9228/"}
    tags: [accounts, lynis]
  accounts/password-max-days:
    title: A password outlives the maximum age, or expires at once
    fact: accounts.shadow.*.max-days
    when: {accounts.shadow.*.password: hash}
    expect: {type: integer, minimum: 1, maximum: "${password-max-days}"}
    severity: info
    score: 2.0
    message: "{subject}’s maximum password age in days is {got}, where 1 to ${password-max-days} is asked"
    fix: run chage --maxdays ${password-max-days} {subject}, and set PASS_MAX_DAYS ${password-max-days} in /etc/login.defs for new accounts
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/shadow.5.html
    references:
      - {title: Lynis AUTH-9282, url: "https://cisofy.com/lynis/controls/AUTH-9282/"}
    tags: [accounts, cis-ubuntu-26.04:5.4.1.1, lynis, '!default']
  accounts/password-min-days:
    title: A password can be changed again before the minimum age
    fact: accounts.shadow.*.min-days
    when: {accounts.shadow.*.password: hash}
    expect: {type: integer, minimum: "${password-min-days}"}
    severity: info
    score: 2.0
    message: "{subject}’s minimum password age in days is {got}, so a forced change can be undone sooner than the ${password-min-days} asked"
    fix: run chage --mindays ${password-min-days} {subject}, and set PASS_MIN_DAYS ${password-min-days} in /etc/login.defs for new accounts
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/shadow.5.html
    tags: [accounts, cis-ubuntu-26.04:5.4.1.2, '!default']
  accounts/password-warn-days:
    title: A password expires with less warning than asked
    fact: accounts.shadow.*.warn-days
    when: {accounts.shadow.*.password: hash}
    expect: {type: integer, minimum: "${password-warn-days}"}
    severity: info
    score: 2.0
    message: "{subject}’s password expiry warning in days is {got}, where at least ${password-warn-days} is asked"
    fix: run chage --warndays ${password-warn-days} {subject}, and set PASS_WARN_AGE ${password-warn-days} in /etc/login.defs for new accounts
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/shadow.5.html
    tags: [accounts, cis-ubuntu-26.04:5.4.1.3, '!default']
  accounts/password-inactive-days:
    title: An expired password stays usable longer than asked
    fact: accounts.shadow.*.inactive-days
    when: {accounts.shadow.*.password: hash}
    expect: {type: integer, minimum: 0, maximum: "${password-inactive-days}"}
    severity: info
    score: 2.0
    message: "{subject}’s grace in days before an expired password locks it is {got}, where at most ${password-inactive-days} is asked"
    fix: run chage --inactive ${password-inactive-days} {subject}, and useradd -D -f ${password-inactive-days} for new accounts
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/shadow.5.html
    tags: [accounts, cis-ubuntu-26.04:5.4.1.5, '!default']
  accounts/no-shell-unlocked:
    title: An account without a login shell has a usable password
    fact: accounts.shadow.*.password
    keys: {not: {const: root}}
    when: {accounts.passwd.*.login-shell: false, accounts.passwd.*.password: shadow}
    expect: {not: {enum: [hash, empty]}}
    severity: info
    score: 2.0
    message: "{subject} has no login shell but an unlocked password, so any service that authenticates through PAM without a shell, such as mail or FTP, still accepts it"
    fix: run usermod --lock {subject}, unless a service logs it in by password on purpose
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/usermod.8.html
    tags: [accounts, cis-ubuntu-26.04:5.4.2.8, '!default']
