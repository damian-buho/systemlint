description: Local accounts and groups that share an identity, hide behind a repeated name or open without a password
topic: Accounts and authentication
tags: [default]
vars:
  password-max-days: {default: 365, minimum: 1, maximum: 99999}
  password-min-days: {default: 1, minimum: 0, maximum: 99999}
  password-warn-days: {default: 7, minimum: 0, maximum: 99999}
  password-inactive-days: {default: 45, minimum: 0, maximum: 99999}
  uid-min: {default: 1000, minimum: 1, maximum: 4294967294}
  stig-password-inactive-days: {default: 35, minimum: 0, maximum: 99999}
rules:
  accounts/uid-zero:
    title: An account other than root has uid 0
    fact: accounts.passwd.*.uid
    keys: {not: {const: root}}
    expect: {not: {const: 0}}
    severity: error
    score: 8.0
    message: "{subject} has uid 0 in /etc/passwd, so it holds every privilege root does under another name"
    rationale: a second account with root’s uid is an unnoticed way to have full control of the machine
    fix: give {subject} its own uid with “usermod --uid”, or remove it with “userdel” if nobody needs it
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/passwd.5.html
    references:
      - {title: Lynis AUTH-9204, url: "https://cisofy.com/lynis/controls/AUTH-9204/"}
    tags: [accounts, lynis]
  accounts/uid-unique:
    title: Accounts share a uid
    fact: accounts.passwd.*.uid
    when: {accounts.passwd.*.uid: {not: {const: 0}}}
    unique: true
    severity: warning
    score: 5.0
    message: "{subject} shares uid {got} with {others}, so each owns the other’s files and processes"
    rationale: two people or services can read, change and kill each other’s files and processes
    fix:
      - Give {subject} a uid of its own with “usermod --uid”.
      - Then run “chown” on what it should own.
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/passwd.5.html
    references:
      - {title: Lynis AUTH-9208, url: "https://cisofy.com/lynis/controls/AUTH-9208/"}
    tags: [accounts, lynis]
  accounts/gid-unique:
    title: Groups share a gid
    fact: accounts.group.*.gid
    keys: {not: {pattern: "^[+-]"}}
    unique: true
    severity: warning
    score: 5.0
    message: "{subject} shares gid {got} with {others}, so a member of one gets the other’s file access"
    rationale: members of one group quietly get access to everything the other group owns
    fix:
      - Give {subject} a gid of its own with “groupmod --gid”.
      - Then run “chgrp” on what it should own.
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/group.5.html
    references:
      - {title: Lynis AUTH-9222, url: "https://cisofy.com/lynis/controls/AUTH-9222/"}
    tags: [accounts, lynis]
  accounts/user-repeated:
    title: A user name appears twice in /etc/passwd
    fact: accounts.passwd.*.shadowed
    expect: {maxItems: 0}
    severity: warning
    score: 4.0
    message: "{subject} appears again on line(s) {got} of /etc/passwd, which the system never reads, since the first line wins"
    rationale: the second entry is silently ignored, so settings an administrator thinks apply never do
    fix: merge what you meant into the first {subject} line of “/etc/passwd”, and delete the later one with “vipw”
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/passwd.5.html
    tags: [accounts]
  accounts/group-repeated:
    title: A group name appears twice in /etc/group
    fact: accounts.group.*.shadowed
    expect: {maxItems: 0}
    severity: warning
    score: 4.0
    message: "{subject} appears again on line(s) {got} of /etc/group, which the system never reads, since the first line wins"
    rationale: the second entry is silently ignored, so members an administrator thinks have access never get it
    fix: merge the members you meant into the first {subject} line of “/etc/group”, and delete the later one with “vigr”
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/group.5.html
    references:
      - {title: Lynis AUTH-9226, url: "https://cisofy.com/lynis/controls/AUTH-9226/"}
    tags: [accounts, lynis]
  accounts/passwd-empty-password:
    title: An account has an empty password field in /etc/passwd
    fact: accounts.passwd.*.password
    expect: {not: {const: empty}}
    severity: error
    score: 8.0
    message: "{subject} has an empty password field in /etc/passwd, so any service that allows empty passwords lets it in without one"
    rationale: anyone who knows the account name can log in without a password wherever empty passwords are allowed
    fix: run “passwd {subject}” to set a password, or “passwd --lock {subject}” if nobody logs in as it
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/passwd.5.html
    references:
      - {title: Lynis AUTH-9283, url: "https://cisofy.com/lynis/controls/AUTH-9283/"}
    tags: [accounts, lynis]
  accounts/passwd-hash:
    title: An account keeps its password hash in /etc/passwd
    fact: accounts.passwd.*.password
    expect: {not: {const: hash}}
    severity: error
    score: 7.0
    message: "{subject} keeps its password hash in /etc/passwd, which every local user can read, so anyone on the host can crack it offline"
    rationale: any local user can read the password hash and crack it offline at leisure
    fix:
      - 'Move the hash into “/etc/shadow”:'
      - run: pwconv
      - 'Then set a new password, since the old one may already be cracked:'
      - run: passwd {subject}
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/pwconv.8.html
    tags: [accounts, cis-ubuntu-26.04:7.2.1, stig-ubuntu-26.04:UBTU-24-400220, dev-sec-linux-baseline:os-03b]
  accounts/shadow-empty-password:
    title: An account has an empty password in /etc/shadow
    fact: accounts.shadow.*.password
    when: {accounts.shadow.*.in-passwd: true, accounts.passwd.*.password: shadow}
    expect: {not: {const: empty}}
    severity: error
    score: 8.0
    message: "{subject} has an empty password in /etc/shadow, so any service that allows empty passwords lets it in without one"
    rationale: anyone who knows the account name can log in without a password wherever empty passwords are allowed
    fix: run “passwd {subject}” to set a password, or “passwd --lock {subject}” if nobody logs in as it
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/shadow.5.html
    references:
      - {title: Lynis AUTH-9283, url: "https://cisofy.com/lynis/controls/AUTH-9283/"}
    tags: [accounts, lynis, cis-ubuntu-26.04:5.4.2.4]
  accounts/shadow-missing:
    title: An account defers to /etc/shadow, which has no line for it
    fact: accounts.shadow.*.password
    expect: {not: {const: missing}}
    severity: info
    score: 2.0
    message: "{subject} defers to /etc/shadow in /etc/passwd, but /etc/shadow has no line for it, so its password, lock and ageing live nowhere and pwck reports the entry as broken"
    rationale: the account has no recorded password state, so it may be unlocked, never expire, or fail checks unpredictably
    fix:
      - 'Give {subject} its “/etc/shadow” line:'
      - run: pwconv
      - 'Then set a password:'
      - run: passwd {subject}
      - 'Or, if nobody logs in as it, lock it:'
      - run: passwd --lock {subject}
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/pwck.8.html
    references:
      - {title: Lynis AUTH-9228, url: "https://cisofy.com/lynis/controls/AUTH-9228/"}
    tags: [accounts, lynis]
  accounts/password-max-days:
    title: A password outlives the maximum age, or expires at once
    fact: accounts.shadow.*.max-days
    when: {accounts.shadow.*.password: hash}
    expect: {type: integer, minimum: 1, maximum: "${password-max-days}"}
    severity: info
    score: 2.0
    message: "{subject}’s maximum password age in days is {got}, where 1 to ${password-max-days} is asked"
    rationale: a leaked password keeps working indefinitely, or users are forced to change it so often they pick weak ones
    fix:
      - 'Set the limit on this account:'
      - run: chage --maxdays ${password-max-days} {subject}
      - 'Then set this line in “/etc/login.defs” for new accounts:'
      - lines: ["PASS_MAX_DAYS ${password-max-days}"]
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/shadow.5.html
    references:
      - {title: Lynis AUTH-9282, url: "https://cisofy.com/lynis/controls/AUTH-9282/"}
    tags: [accounts, cis-ubuntu-26.04:5.4.1.1, lynis, '!default']
    conflicts: [accounts/password-rotation]
  accounts/password-rotation:
    title: A password must change on a schedule
    fact: accounts.shadow.*.max-days
    when: {accounts.shadow.*.password: hash}
    expect: {anyOf: [{type: "null"}, {type: integer, minimum: 99999}]}
    severity: info
    score: 2.0
    message: "{subject}’s maximum password age in days is {got}, so the password must change on a schedule, which steers people to predictable successors of the old one"
    rationale: people choose small variations of the old password, so a stolen one is easy to guess forward
    fix: run “chage --maxdays -1 {subject}”, set “PASS_MAX_DAYS 99999” in “/etc/login.defs” for new accounts, and force a change only on evidence of compromise
    docs: https://pages.nist.gov/800-63-4/sp800-63b.html#passwordver
    references:
      - {title: NIST SP 800-63B-4 3.1.1.2, url: "https://pages.nist.gov/800-63-4/sp800-63b.html#passwordver"}
    tags: [accounts, nist-sp-800-63b-4:3.1.1.2]
    conflicts: [accounts/password-max-days]
  accounts/password-min-days:
    title: A password can be changed again before the minimum age
    fact: accounts.shadow.*.min-days
    when: {accounts.shadow.*.password: hash}
    expect: {type: integer, minimum: "${password-min-days}"}
    severity: info
    score: 2.0
    message: "{subject}’s minimum password age in days is {got}, so a forced change can be undone sooner than the ${password-min-days} asked"
    rationale: a user forced to change a password can switch straight back to the old one
    fix:
      - 'Set the limit on this account:'
      - run: chage --mindays ${password-min-days} {subject}
      - 'Then set this line in “/etc/login.defs” for new accounts:'
      - lines: ["PASS_MIN_DAYS ${password-min-days}"]
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/shadow.5.html
    tags: [accounts, cis-ubuntu-26.04:5.4.1.2, '!default']
  accounts/password-warn-days:
    title: A password expires with less warning than asked
    fact: accounts.shadow.*.warn-days
    when: {accounts.shadow.*.password: hash}
    expect: {type: integer, minimum: "${password-warn-days}"}
    severity: info
    score: 2.0
    message: "{subject}’s password expiry warning in days is {got}, where at least ${password-warn-days} is asked"
    rationale: users are locked out by an expiry they had no time to notice and prepare for
    fix:
      - 'Set the warning on this account:'
      - run: chage --warndays ${password-warn-days} {subject}
      - 'Then set this line in “/etc/login.defs” for new accounts:'
      - lines: ["PASS_WARN_AGE ${password-warn-days}"]
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/shadow.5.html
    tags: [accounts, cis-ubuntu-26.04:5.4.1.3, '!default']
  accounts/password-inactive-days:
    title: An expired password stays usable longer than asked
    fact: accounts.shadow.*.inactive-days
    when: {accounts.shadow.*.password: hash}
    expect: {type: integer, minimum: 0, maximum: "${password-inactive-days}"}
    severity: info
    score: 2.0
    message: "{subject}’s grace in days before an expired password locks it is {got}, where at most ${password-inactive-days} is asked"
    rationale: an abandoned account with an expired password stays open to an attacker for weeks
    fix: run “chage --inactive ${password-inactive-days} {subject}”, and “useradd -D -f ${password-inactive-days}” for new accounts
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/shadow.5.html
    tags: [accounts, cis-ubuntu-26.04:5.4.1.5, '!default']
  accounts/no-shell-unlocked:
    title: An account without a login shell has a usable password
    fact: accounts.shadow.*.password
    keys: {not: {const: root}}
    when:
      - {accounts.shadow.*.in-passwd: true, accounts.passwd.*.login-shell: false, accounts.passwd.*.interactive-shell: false, accounts.passwd.*.password: shadow}
      - {accounts.shadow.*.in-passwd: true, accounts.passwd.*.shell: {pattern: "^/"}, 'accounts.shell-files.{accounts.passwd.*.shell}.exists': false, accounts.passwd.*.password: shadow}
    expect: {not: {enum: [hash, empty]}}
    severity: info
    score: 2.0
    message: "{subject} has no login shell but an unlocked password, so any service that authenticates through PAM without a shell, such as mail or FTP, still accepts it"
    rationale: an account meant only for a service can still be broken into by guessing its password through mail or FTP
    fix: run “usermod --lock {subject}”, unless a service logs it in by password on purpose
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/usermod.8.html
    tags: [accounts, cis-ubuntu-26.04:5.4.2.8]
  accounts/shell-not-listed:
    title: A login shell is missing from /etc/shells
    fact: accounts.passwd.*.login-shell
    when: {accounts.passwd.*.interactive-shell: true, accounts.passwd.*.shell: {pattern: "^/"}, 'accounts.shell-files.{accounts.passwd.*.shell}.exists': true}
    expect: {const: true}
    severity: info
    score: 1.0
    suggest: {fact: accounts.passwd.*.shell, otherwise: its shell}
    message: "{subject} logs in with {suggested}, which /etc/shells does not list, so chsh, FTP servers and any PAM check for a valid shell treat it as an account with no shell"
    fix: add {suggested} to /etc/shells with “add-shell”
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/shells.5.html
    tags: [accounts]
  accounts/gid-zero:
    title: An account other than root has group root as its primary group
    fact: accounts.passwd.*.gid
    keys: {not: {enum: [root, sync, shutdown, halt, operator]}}
    expect: {not: {const: 0}}
    severity: warning
    score: 5.0
    message: "{subject} has gid 0 as its primary group in /etc/passwd, so every file it creates belongs to group root"
    rationale: every file the account creates is shared with root’s group, readable or writable by other members of it
    fix: give {subject} its own primary group with “usermod --gid”
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/passwd.5.html
    tags: [accounts, cis-ubuntu-26.04:5.4.2.2]
  accounts/root-gid:
    title: root’s primary group is not gid 0
    fact: accounts.passwd.*.gid
    keys: {const: root}
    expect: {const: 0}
    severity: warning
    score: 5.0
    message: "root has gid {got} as its primary group in /etc/passwd, so every file root creates belongs to that group"
    rationale: members of that group can read, and often change, files root creates, from logs to keys
    fix: run “usermod --gid 0 root”, then “chgrp” back to root what root created under gid {got}
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/usermod.8.html
    tags: [accounts, cis-ubuntu-26.04:5.4.2.2]
  accounts/passwd-nis-entry: &nis-entry
    title: /etc/passwd pulls accounts from NIS
    fact: accounts.compat.passwd.*
    when:
      nsswitch: {required: [passwd], properties: {passwd: {contains: {const: compat}}}}
      clients.binaries: {not: {propertyNames: {not: {pattern: "/ypbind$"}}}}
    expect: {not: {}}
    severity: warning
    score: 5.0
    message: "/etc/passwd holds the NIS entry “{subject}”, which nsswitch.conf’s compat mode fills with accounts from whichever server answers for the NIS domain"
    rationale: NIS never authenticates its server, so a host on the network that answers first can add accounts here, uid 0 included
    fix: 'delete the “{subject}” line with “vipw”, and set “passwd: files” in “/etc/nsswitch.conf” once no account comes from NIS'
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/nsswitch.conf.5.html
    tags: [accounts]
  accounts/group-nis-entry:
    <<: *nis-entry
    title: /etc/group pulls groups from NIS
    fact: accounts.compat.group.*
    when:
      nsswitch: {required: [group], properties: {group: {contains: {const: compat}}}}
      clients.binaries: {not: {propertyNames: {not: {pattern: "/ypbind$"}}}}
    message: "/etc/group holds the NIS entry “{subject}”, which nsswitch.conf’s compat mode fills with groups from whichever server answers for the NIS domain"
    rationale: NIS never authenticates its server, so a host on the network that answers first can add members to any group here, sudo included
    fix: 'delete the “{subject}” line with “vigr”, and set “group: files” in “/etc/nsswitch.conf” once no group comes from NIS'
  accounts/shadow-nis-entry:
    <<: *nis-entry
    title: /etc/shadow pulls passwords from NIS
    fact: accounts.compat.shadow.*
    when:
      nsswitch: {required: [shadow], properties: {shadow: {contains: {const: compat}}}}
      clients.binaries: {not: {propertyNames: {not: {pattern: "/ypbind$"}}}}
    message: "/etc/shadow holds the NIS entry “{subject}”, which nsswitch.conf’s compat mode fills with password hashes from whichever server answers for the NIS domain"
    rationale: NIS never authenticates its server, so a host on the network that answers first can set the password of an account here
    fix: 'delete the “{subject}” line with “vipw --shadow”, and set “shadow: files” in “/etc/nsswitch.conf” once no account comes from NIS'
  accounts/shadow-group-members:
    title: The shadow group has members
    fact: accounts.group.*.members
    keys: {const: shadow}
    expect: {maxItems: 0}
    severity: warning
    score: 6.0
    message: "group shadow lists {got} in /etc/group, so they can read every password hash in /etc/shadow"
    rationale: those users can read every password hash on the machine and crack them offline
    fix: remove each member with “gpasswd --delete <user> shadow”
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/shadow.5.html
    tags: [accounts, cis-ubuntu-26.04:7.2.4]
  accounts/shadow-group-primary:
    title: An account has the shadow group as its primary group
    fact: accounts.passwd.*.gid
    when: {accounts.group.shadow.gid: 42}
    expect: {not: {const: 42}}
    severity: warning
    score: 6.0
    message: "{subject} has group shadow (gid 42) as its primary group, so it can read every password hash in /etc/shadow"
    rationale: that account can read every password hash on the machine and crack them offline
    fix: give {subject} another primary group with “usermod --gid”
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/shadow.5.html
    tags: [accounts, cis-ubuntu-26.04:7.2.4]
  accounts/nologin-shell:
    title: /etc/shells lists nologin as a valid shell
    fact: accounts.shells.*
    expect: {not: {contains: {pattern: "^[^#]*/nologin\\b"}}}
    severity: info
    score: 2.0
    message: "{subject} lists nologin, so a service that only admits accounts with a valid shell, such as an FTP server, admits accounts meant to have none"
    rationale: accounts meant to be unable to log in can still pass the shell check of FTP and similar services
    fix: delete the “nologin” lines from {subject}
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/shells.5.html
    tags: [accounts, cis-ubuntu-26.04:5.4.3.1]
  accounts/system-login-shell:
    title: A system account has a login shell
    fact: accounts.passwd.*.login-shell
    keys: {not: {enum: [root, halt, sync, shutdown, nfsnobody]}}
    when:
      - {accounts.passwd.*.uid: {exclusiveMaximum: "${uid-min}"}}
      - {accounts.passwd.*.uid: 65534}
    expect: {const: false}
    severity: info
    score: 2.0
    message: "{subject} is a system account with a shell listed in /etc/shells, so anyone who gets its password or key gets a shell"
    rationale: anyone who steals a service account’s key or password gets an interactive shell on the machine
    fix: run “usermod --shell /usr/sbin/nologin {subject}”, unless a person logs in as it on purpose
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/usermod.8.html
    tags: [accounts, cis-ubuntu-26.04:5.4.2.7, '!default']
  accounts/useradd-inactive:
    title: New accounts keep an expired password usable longer than asked
    fact: auth.useradd
    expect: {required: [INACTIVE], properties: {INACTIVE: {type: integer, minimum: 0, maximum: "${password-inactive-days}"}}}
    severity: info
    score: 1.0
    message: "INACTIVE in /etc/default/useradd is unset (-1, never) or above ${password-inactive-days}, so an account made from now on stays usable that long after its password expires"
    rationale: every account created from now on stays open to an attacker long after its owner stopped using it
    fix: run “useradd -D -f ${password-inactive-days}”
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/useradd.8.html
    tags: [accounts, cis-ubuntu-26.04:5.4.1.5, '!default']
  accounts/stig-useradd-inactive:
    title: New accounts are not disabled after 35 days of inactivity
    fact: auth.useradd
    expect: {required: [INACTIVE], properties: {INACTIVE: {type: integer, minimum: 0, maximum: "${stig-password-inactive-days}"}}}
    severity: info
    score: 1.0
    message: "INACTIVE in /etc/default/useradd is unset (-1, never) or above ${stig-password-inactive-days}"
    rationale: every account created from now on stays open to an attacker long after its owner stopped using it
    fix: run “useradd -D -f ${stig-password-inactive-days}”
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/useradd.8.html
    tags: [accounts, stig-ubuntu-26.04:UBTU-24-200260, '!default']
  accounts/stig-root-unlocked:
    title: root’s password is not locked
    fact: accounts.shadow.root.password
    when: {accounts.passwd: {required: [root]}}
    expect: {const: locked}
    severity: info
    score: 1.0
    message: "root’s password in /etc/shadow is {got}, not locked, so root may log in directly with it, leaving no record of which administrator did"
    rationale: whoever has the root password logs in as plain root and the logs cannot say which administrator did what
    fix: run “passwd --lock root” once every administrator reaches root through sudo
    docs: https://manpages.ubuntu.com/manpages/resolute/man1/passwd.1.html
    tags: [accounts, stig-ubuntu-26.04:UBTU-24-400110, '!default']
  accounts/grpck:
    title: grpck finds the group files inconsistent
    fact: accounts.grpck.exit-status
    expect: {const: 0}
    severity: warning
    score: 3.0
    message: "grpck --read-only exits {got}, so /etc/group and /etc/gshadow hold a malformed line, a duplicate name or a member with no account, which tools read differently"
    rationale: a malformed group entry can give or deny access differently in different tools without anyone noticing
    fix: run “grpck --read-only” as root and fix each line it names, or let “grpck” fix them
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/grpck.8.html
    references:
      - {title: Lynis AUTH-9216, url: "https://cisofy.com/lynis/controls/AUTH-9216/"}
    tags: [accounts, lynis]
