description: OpenSSH server settings that weaken authentication, forwarding or cryptography, after dev-sec ssh-baseline
topic: Accounts and authentication
tags: [default]
vars:
  ssh-max-sessions: {default: 10, minimum: 1, maximum: 1000}
  ssh-max-auth-tries: {default: 4, minimum: 1, maximum: 100}
  ssh-login-grace-time: {default: 60, minimum: 1, maximum: 86400}
  ssh-stig-client-alive-interval: {default: 600, minimum: 1, maximum: 86400}
rules:
  ssh/root-login:
    title: Root may log in with a password
    fact: sshd.accounts.*.permitrootlogin
    keys: {const: root}
    expect: {enum: [no, prohibit-password, forced-commands-only]}
    severity: error
    score: 7.5
    message: "{subject} gets PermitRootLogin {got}, so sshd lets it log in with a password"
    rationale: anyone who guesses or steals the root password gets full control of the machine over the network
    fix: set “PermitRootLogin prohibit-password”, or “PermitRootLogin no”
    docs: https://manpages.debian.org/unstable/openssh-server/sshd_config.5.en.html
    references:
      - {title: Lynis SSH-7408, url: "https://cisofy.com/lynis/controls/SSH-7408/"}
    tags: [ssh, dev-sec-ssh-baseline:sshd-06, lynis]
  ssh/password-authentication:
    title: Passwords are accepted over the network
    fact: sshd.settings.passwordauthentication.*
    expect: {const: no}
    severity: warning
    score: 5.0
    message: "{subject} has PasswordAuthentication {got}, so sshd accepts passwords, which can be guessed over the network"
    rationale: an attacker can try millions of passwords against any account from anywhere until one works
    fix: set “PasswordAuthentication no” once every user has a key
    docs: https://manpages.debian.org/unstable/openssh-server/sshd_config.5.en.html
    tags: [ssh, dev-sec-ssh-baseline:sshd-27]
  ssh/empty-passwords:
    title: Empty passwords are accepted
    fact: sshd.settings.permitemptypasswords.*
    expect: {const: no}
    severity: error
    score: 9.5
    message: "{subject} has PermitEmptyPasswords {got}, so sshd lets it log in with an empty password"
    rationale: any account with no password can be logged into by anyone who knows its name
    fix: set “PermitEmptyPasswords no”
    docs: https://manpages.debian.org/unstable/openssh-server/sshd_config.5.en.html
    tags: [ssh, dev-sec-ssh-baseline:sshd-28]
  ssh/keyboard-interactive:
    title: Keyboard-interactive logins are accepted
    fact: sshd.settings.kbdinteractiveauthentication.*
    expect: {const: no}
    severity: warning
    score: 5.0
    message: "{subject} has KbdInteractiveAuthentication {got}, so sshd accepts keyboard-interactive logins, which through PAM ask for the password"
    rationale: password guessing stays possible through the back door even when plain password login is off
    fix: set “KbdInteractiveAuthentication no”, unless a second factor needs it
    docs: https://manpages.debian.org/unstable/openssh-server/sshd_config.5.en.html
    tags: [ssh, dev-sec-ssh-baseline:sshd-29]
  ssh/hostbased:
    title: Host-based authentication is on
    fact: sshd.settings.hostbasedauthentication.*
    expect: {const: no}
    severity: warning
    score: 6.0
    message: "{subject} has HostbasedAuthentication {got}, so sshd trusts the client host’s word for who the user is"
    rationale: anyone who controls or impersonates a listed machine can log in as its users without a password
    fix: set “HostbasedAuthentication no”
    docs: https://manpages.debian.org/unstable/openssh-server/sshd_config.5.en.html
    tags: [ssh, dev-sec-ssh-baseline:sshd-25]
  ssh/ignore-rhosts:
    title: Users’ .rhosts files are read
    fact: sshd.settings.ignorerhosts.*
    expect: {const: yes}
    severity: warning
    score: 6.0
    message: "{subject} has IgnoreRhosts {got}, so sshd reads users’ .rhosts and .shosts files"
    rationale: a one-line .rhosts file in a home directory lets a named host log in as that user without a password
    fix: set “IgnoreRhosts yes”
    docs: https://manpages.debian.org/unstable/openssh-server/sshd_config.5.en.html
    references:
      - {title: Lynis SSH-7408, url: "https://cisofy.com/lynis/controls/SSH-7408/"}
    tags: [ssh, dev-sec-ssh-baseline:sshd-23, lynis]
  ssh/strict-modes:
    title: Writable key files are accepted
    fact: sshd.global.*.strictmodes
    expect: {const: yes}
    severity: warning
    score: 5.5
    message: "{subject} sets StrictModes {got}, so it accepts key files that other users can write"
    rationale: another local user can add their own key to a writable key file and log in as its owner
    fix: set “StrictModes yes”
    docs: https://manpages.debian.org/unstable/openssh-server/sshd_config.5.en.html
    references:
      - {title: Lynis SSH-7408, url: "https://cisofy.com/lynis/controls/SSH-7408/"}
    tags: [ssh, dev-sec-ssh-baseline:sshd-11, lynis]
  ssh/user-environment:
    title: Users may set their session environment
    fact: sshd.global.*.permituserenvironment
    expect: {const: no}
    severity: warning
    score: 6.5
    message: "{subject} sets PermitUserEnvironment {got}, so it lets users set variables such as LD_PRELOAD for their session"
    rationale: a user can plant LD_PRELOAD or a similar variable that makes a restricted login run their own code
    fix: set “PermitUserEnvironment no”
    docs: https://manpages.debian.org/unstable/openssh-server/sshd_config.5.en.html
    references:
      - {title: Lynis SSH-7408, url: "https://cisofy.com/lynis/controls/SSH-7408/"}
    tags: [ssh, dev-sec-ssh-baseline:sshd-17, lynis]
  ssh/x11-forwarding:
    title: X11 forwarding is on
    fact: sshd.settings.x11forwarding.*
    expect: {const: no}
    severity: warning
    score: 3.5
    message: "{subject} has X11Forwarding {got}, so sshd forwards X11, which hands the server a way into the client’s display"
    rationale: a hostile server can read the client’s screen and keystrokes or send input to its windows
    fix: set “X11Forwarding no”
    docs: https://manpages.debian.org/unstable/openssh-server/sshd_config.5.en.html
    tags: [ssh, dev-sec-ssh-baseline:sshd-42]
  ssh/gateway-ports:
    title: Forwarded ports listen on every address
    fact: sshd.settings.gatewayports.*
    expect: {const: no}
    severity: warning
    score: 4.5
    message: "{subject} has GatewayPorts {got}, so sshd lets forwarded ports listen on every address, not only on loopback"
    rationale: a port forwarded for one user becomes reachable by every machine on the network
    fix: set “GatewayPorts no”
    docs: https://manpages.debian.org/unstable/openssh-server/sshd_config.5.en.html
    references:
      - {title: Lynis SSH-7408, url: "https://cisofy.com/lynis/controls/SSH-7408/"}
    tags: [ssh, dev-sec-ssh-baseline:sshd-41, lynis]
  ssh/tunnel:
    title: Tunnel device forwarding is on
    fact: sshd.settings.permittunnel.*
    expect: {const: no}
    severity: warning
    score: 4.0
    message: "{subject} has PermitTunnel {got}, so sshd allows tun device forwarding, a full network link into the host"
    rationale: a logged-in user can bridge the host’s network to a machine they control and bypass its firewall
    fix: set “PermitTunnel no”
    docs: https://manpages.debian.org/unstable/openssh-server/sshd_config.5.en.html
    references:
      - {title: Lynis SSH-7408, url: "https://cisofy.com/lynis/controls/SSH-7408/"}
    tags: [ssh, dev-sec-ssh-baseline:sshd-38, lynis]
  ssh/ciphers:
    title: A weak cipher is offered
    fact: sshd.global.*.ciphers
    expect: {items: {not: {pattern: "-cbc$|^3des|arcfour|blowfish|cast128|^rijndael"}}}
    severity: warning
    score: 5.0
    message: "{subject} offers {got}, a weak cipher, so a client that still accepts it may settle on a session an eavesdropper can attack"
    rationale: an eavesdropper on the network path can break the weak cipher and read or alter the session
    fix: remove {got} from “Ciphers”
    docs: https://manpages.debian.org/unstable/openssh-server/sshd_config.5.en.html
    tags: [ssh, dev-sec-ssh-baseline:sshd-01]
  ssh/macs:
    title: A weak MAC is offered
    fact: sshd.global.*.macs
    expect: {items: {not: {pattern: "md5|sha1|-96|^umac-64"}}}
    severity: warning
    score: 5.0
    message: "{subject} offers {got}, a weak MAC, so a client that still accepts it may settle on a session whose integrity an attacker on the path can forge"
    rationale: an attacker on the network path can alter commands or data in transit without being noticed
    fix: remove {got} from “MACs”, for example with “MACs -hmac-sha1*,umac-64*”
    docs: https://manpages.debian.org/unstable/openssh-server/sshd_config.5.en.html
    tags: [ssh, dev-sec-ssh-baseline:sshd-03]
  ssh/kex:
    title: A weak key exchange is offered
    fact: sshd.global.*.kexalgorithms
    expect: {items: {not: {pattern: "sha1|^diffie-hellman-group1-"}}}
    severity: warning
    score: 5.0
    message: "{subject} offers {got}, a weak key exchange, so a client that still accepts it may agree on a session key an eavesdropper can recover"
    rationale: an eavesdropper who records the handshake can work out the session key and read everything sent
    fix: remove {got} from “KexAlgorithms”
    docs: https://manpages.debian.org/unstable/openssh-server/sshd_config.5.en.html
    tags: [ssh, dev-sec-ssh-baseline:sshd-02]
  ssh/kex-post-quantum:
    title: No post-quantum key exchange is offered
    fact: sshd.global.*.kexalgorithms
    expect: {contains: {enum: [mlkem768x25519-sha256, sntrup761x25519-sha512, sntrup761x25519-sha512@openssh.com]}}
    severity: warning
    score: 3.5
    message: "{subject} offers no post-quantum key exchange, so a session recorded today can be decrypted once a quantum computer breaks its key exchange: {got}"
    rationale: an attacker who records traffic now can read it years later with a quantum computer
    fix: add “mlkem768x25519-sha256” and “sntrup761x25519-sha512” to the front of “KexAlgorithms”, or remove the “KexAlgorithms” line to get OpenSSH’s defaults
    docs: https://www.openssh.com/pq.html
    tags: [ssh, cis-ubuntu-26.04:5.1.14, cis-controls-v8:3.10, hipaa:164.312(e)(1), hipaa:164.312(e)(2)(i), hipaa:164.312(e)(2)(ii), nist-800-171-r2:3.1.13, nist-800-171-r2:3.13.8, nist-800-171-r2:3.5.10, nist-800-171-r3:03.01.12, nist-800-171-r3:03.05.07, nist-800-171-r3:03.13.08, nist-800-53:AC-17(2), nist-800-53:IA-5(1), nist-800-53:SC-8, nist-800-53:SC-8(1), nist-csf-2:PR.DS-02, pci-dss-4:2.2.7, pci-dss-4:4.2.1, pci-dss-4:8.3.2]
  ssh/max-auth-tries:
    title: Many authentication attempts are allowed
    fact: sshd.settings.maxauthtries.*
    expect: {maximum: "${ssh-max-auth-tries}"}
    severity: info
    score: 2.0
    message: "{subject} has MaxAuthTries {got}, so sshd allows many authentication attempts per connection"
    rationale: an attacker gets many password or key guesses on every connection before being disconnected
    fix: set “MaxAuthTries ${ssh-max-auth-tries}” or lower
    docs: https://manpages.debian.org/unstable/openssh-server/sshd_config.5.en.html
    references:
      - {title: Lynis SSH-7408, url: "https://cisofy.com/lynis/controls/SSH-7408/"}
    tags: [ssh, dev-sec-ssh-baseline:sshd-19, lynis]
  ssh/login-grace-time:
    title: Unauthenticated connections are kept open long
    fact: sshd.global.*.logingracetime
    expect: {minimum: 1, maximum: "${ssh-login-grace-time}"}
    severity: info
    score: 1.5
    message: "{subject} sets LoginGraceTime {got}, so it keeps unauthenticated connections open for long, 0 meaning forever"
    rationale: an attacker can open many silent connections and hold them until sshd has no slots left for real users
    fix: set “LoginGraceTime” between 1 and ${ssh-login-grace-time} seconds
    docs: https://manpages.debian.org/unstable/openssh-server/sshd_config.5.en.html
    references:
      - {title: Lynis SSH-7408, url: "https://cisofy.com/lynis/controls/SSH-7408/"}
    tags: [ssh, dev-sec-ssh-baseline:sshd-18, lynis]
  ssh/log-level:
    title: Login keys are not logged
    fact: sshd.settings.loglevel.*
    expect: {const: verbose}
    severity: info
    score: 2.5
    message: "{subject} has LogLevel {got}, so sshd does not log which key each user logged in with"
    rationale: after a break-in nothing shows which key was used, so a stolen key cannot be traced to its owner
    fix: set “LogLevel VERBOSE”
    docs: https://manpages.debian.org/unstable/openssh-server/sshd_config.5.en.html
    references:
      - {title: Lynis SSH-7408, url: "https://cisofy.com/lynis/controls/SSH-7408/"}
    tags: [ssh, dev-sec-ssh-baseline:sshd-13, lynis]
  ssh/access-unlisted:
    title: sshd admits every account
    fact: sshd.global.*
    expect: {anyOf: [{required: [allowusers]}, {required: [allowgroups]}, {required: [denyusers]}, {required: [denygroups]}]}
    severity: info
    score: 2.0
    message: "{subject} sets none of AllowUsers, AllowGroups, DenyUsers or DenyGroups, so every account with a shell and a credential may log in over SSH"
    rationale: any account with a shell, including forgotten service accounts, can be used to log in remotely
    fix: set “AllowGroups” to the group of the people who log in over SSH
    docs: https://manpages.debian.org/unstable/openssh-server/sshd_config.5.en.html
    tags: [ssh, cis-ubuntu-26.04:5.1.5, cis-controls-v8:3.3, hipaa:164.312(a)(1), iso-27001-2022:A5.15, iso-27001-2022:A8.3, nist-800-171-r2:3.1.1, nist-800-171-r2:3.1.2, nist-800-171-r3:03.01.02, nist-800-53:AC-3, nist-800-53:AC-6, '!default']
  ssh/banner-none:
    title: sshd shows no banner before login
    fact: sshd.settings.banner.*
    expect: {not: {const: none}}
    severity: info
    score: 1.0
    message: "{subject} has Banner none, so no usage notice is shown before authentication"
    rationale: an intruder can later claim they were never told the system is private and monitored
    fix: set “Banner /etc/issue.net”, with a notice that names no system details
    docs: https://manpages.debian.org/unstable/openssh-server/sshd_config.5.en.html
    tags: [ssh, cis-ubuntu-26.04:5.1.6, stig-ubuntu-26.04:UBTU-24-200640, '!default']
  ssh/client-alive-interval:
    title: sshd never checks that an idle client is still there
    fact: sshd.settings.clientaliveinterval.*
    expect: {minimum: 1}
    severity: info
    score: 1.0
    message: "{subject} has ClientAliveInterval 0, so a session whose client vanished stays open"
    rationale: a session left behind by a crashed or abandoned client stays open for anyone who reaches that terminal
    fix: set “ClientAliveInterval 15” and “ClientAliveCountMax 3”, or the timeout your site asks
    docs: https://manpages.debian.org/unstable/openssh-server/sshd_config.5.en.html
    tags: [ssh, cis-ubuntu-26.04:5.1.8]
  ssh/client-alive-count-max:
    title: sshd never drops an unresponsive client
    fact: sshd.settings.clientalivecountmax.*
    expect: {minimum: 1}
    severity: info
    score: 1.0
    message: "{subject} has ClientAliveCountMax 0, which turns the client alive check off"
    rationale: a dead client’s session is never closed, so it stays open for anyone who takes over that connection
    fix: set “ClientAliveCountMax 3”
    docs: https://manpages.debian.org/unstable/openssh-server/sshd_config.5.en.html
    tags: [ssh, cis-ubuntu-26.04:5.1.8]
  ssh/gssapi-authentication:
    title: GSSAPI authentication is accepted
    fact: sshd.settings.gssapiauthentication.*
    expect: {const: no}
    severity: warning
    score: 3.5
    message: "{subject} has GSSAPIAuthentication {got}, so sshd runs the Kerberos library on input from every client, a parser most hosts never need"
    rationale: a flaw in the Kerberos code can be reached by any stranger who connects, before they log in
    fix: set “GSSAPIAuthentication no”, unless users log in with Kerberos tickets
    docs: https://manpages.debian.org/unstable/openssh-server/sshd_config.5.en.html
    tags: [ssh, cis-ubuntu-26.04:5.1.10, cis-controls-v8:5.2]
  ssh/max-sessions:
    title: Many sessions are allowed per connection
    fact: sshd.settings.maxsessions.*
    expect: {maximum: "${ssh-max-sessions}"}
    severity: info
    score: 1.0
    message: "{subject} has MaxSessions {got}, above ${ssh-max-sessions}"
    rationale: one logged-in user can open dozens of sessions over a single connection and exhaust the server
    fix: set “MaxSessions ${ssh-max-sessions}” or lower
    docs: https://manpages.debian.org/unstable/openssh-server/sshd_config.5.en.html
    tags: [ssh, cis-ubuntu-26.04:5.1.19, '!default']
  ssh/max-startups:
    title: Many unauthenticated connections are allowed
    fact: sshd.global.*.maxstartups
    expect: {pattern: "^([0-9]|10)(:([3-9][0-9]|100):([0-9]|[1-5][0-9]|60))?$"}
    severity: info
    score: 2.0
    message: "{subject} has MaxStartups {got}, looser than the benchmark’s 10:30:60, so more half-open logins are kept before sshd starts dropping them"
    rationale: an attacker can pile up half-open logins and keep real users from connecting
    fix: set “MaxStartups 10:30:60”
    docs: https://manpages.debian.org/unstable/openssh-server/sshd_config.5.en.html
    tags: [ssh, cis-ubuntu-26.04:5.1.20, '!default']
  ssh/use-pam:
    title: sshd skips PAM
    fact: sshd.global.*.usepam
    expect: {const: yes}
    severity: warning
    score: 3.5
    message: "{subject} has UsePAM {got}, so logins skip the PAM account and session stacks: lockout, limits and expiry checks"
    rationale: locked, expired and rate-limited accounts can still log in because the account checks never run
    fix: set “UsePAM yes”
    docs: https://manpages.debian.org/unstable/openssh-server/sshd_config.5.en.html
    tags: [ssh, cis-ubuntu-26.04:5.1.24, stig-ubuntu-26.04:UBTU-24-500050, cis-controls-v8:5.2]
  ssh/x11-use-localhost:
    title: Forwarded X11 displays listen on every address
    fact: sshd.settings.x11uselocalhost.*
    expect: {const: "yes"}
    severity: warning
    score: 4.0
    message: "{subject} has X11UseLocalhost {got}, so a forwarded X11 display listens on the network, where any host may connect to the user’s session"
    rationale: other machines on the network can connect to the user’s forwarded display and see or control their windows
    fix: set “X11UseLocalhost yes”
    docs: https://manpages.debian.org/unstable/openssh-server/sshd_config.5.en.html
    tags: [ssh, stig-ubuntu-26.04:UBTU-24-300023]
  ssh/stig-client-alive-interval:
    title: sshd keeps an idle session past ten minutes
    folds: [ssh/client-alive-interval]
    fact: sshd.settings.clientaliveinterval.*
    expect: {minimum: 1, maximum: "${ssh-stig-client-alive-interval}"}
    severity: info
    score: 1.0
    message: "{subject} has ClientAliveInterval {got}; the STIG asks 1 to ${ssh-stig-client-alive-interval} seconds"
    rationale: an idle session stays open long enough for someone at an unattended terminal to use it
    fix: set “ClientAliveInterval ${ssh-stig-client-alive-interval}”
    docs: https://manpages.debian.org/unstable/openssh-server/sshd_config.5.en.html
    tags: [ssh, stig-ubuntu-26.04:UBTU-24-600010, '!default']
  ssh/stig-client-alive-count-max:
    title: sshd waits more than one missed check before dropping a client
    folds: [ssh/client-alive-count-max]
    fact: sshd.settings.clientalivecountmax.*
    expect: {const: 1}
    severity: info
    score: 1.0
    message: "{subject} has ClientAliveCountMax {got}; the STIG asks 1, so a session ends at the first unanswered check"
    rationale: an idle session survives several missed checks, leaving an unattended terminal usable for longer
    fix: set “ClientAliveCountMax 1”
    docs: https://manpages.debian.org/unstable/openssh-server/sshd_config.5.en.html
    tags: [ssh, stig-ubuntu-26.04:UBTU-24-600000, '!default']
  ssh/stig-not-installed:
    title: sshd is not installed
    fact: ssh.binary
    expect: {minProperties: 1}
    severity: info
    score: 1.0
    message: "no sshd program is in /usr/sbin or /usr/local/sbin; the STIG asks for SSH as the remote access"
    rationale: administrators have no encrypted way to reach the machine and fall back on weaker remote tools
    fix: install openssh-server with “apt install openssh-server”
    docs: https://manpages.debian.org/unstable/openssh-server/sshd.8.en.html
    tags: [ssh, stig-ubuntu-26.04:UBTU-24-100800, '!default']
  ssh/stig-not-running:
    title: sshd is installed but neither its service nor its socket is enabled and running
    fact: systemd.state
    when: {ssh.binary: {minProperties: 1}}
    expect:
      anyOf:
        - {required: [ssh.service], properties: {ssh.service: &up {required: [enabled], properties: {enabled: {const: true}, active: {const: active}}}}}
        - {required: [ssh.socket], properties: {ssh.socket: *up}}
    severity: info
    score: 1.0
    message: "neither ssh.service nor ssh.socket is both enabled and running; the STIG asks for SSH as the remote access"
    rationale: administrators cannot reach the machine remotely over an encrypted channel when they need to
    fix: run “systemctl enable --now ssh.socket”, or “systemctl enable --now ssh.service”
    docs: https://manpages.debian.org/unstable/openssh-server/sshd.8.en.html
    tags: [ssh, stig-ubuntu-26.04:UBTU-24-100810, '!default']
