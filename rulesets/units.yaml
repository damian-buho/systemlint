description: Units on disk that have failed
topic: Services
tags: [default]
rules:
  units/failed:
    title: A unit has failed
    fact: systemd.state.*.active
    when: {systemd.state.*: {required: [active, masked], properties: {masked: {const: false}}}}
    expect: {not: {const: failed}}
    severity: warning
    score: 4.0
    message: "{subject} has failed, so what it provides is missing and systemd counts the whole host as degraded, which hides the next failure"
    rationale: a service, mount or timer job the host has on disk is down, and a monitor that watches for a degraded host no longer notices a new failure
    fix:
      - 'List the failed units and see why each failed:'
      - run: systemctl --failed
      - run: systemctl status UNIT
      - 'Fix the cause and start the unit again, or, when it is no longer needed, disable it and clear the failure:'
      - run: systemctl disable UNIT
      - run: systemctl reset-failed UNIT
    docs: https://www.freedesktop.org/software/systemd/man/latest/systemctl.html#is-system-running
    tags: [units, systemd, stability]
