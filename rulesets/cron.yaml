description: the system crontab and cron directories, kept from other users
topic: Services
tags: [default]
when: {cron.binary: {minProperties: 1}}
rules:
  cron/world-readable:
    title: System cron jobs are readable by every user
    fact: files.cron.*.mode
    keys: {enum: [/etc/crontab, /etc/cron.d, /etc/cron.hourly, /etc/cron.daily, /etc/cron.weekly, /etc/cron.monthly, /etc/cron.yearly]}
    when:
      files.cron.*.kind: {not: {const: symlink}}
    expect: {pattern: "^[0-7]{3}0$"}
    severity: warning
    score: 4.0
    message: "{subject} has mode {got}; every user can read the jobs root runs from it, and any password or token written into one"
    rationale: any local user can read the scheduled jobs root runs, including passwords or tokens written into them
    fix: run “chmod o-rwx” on “/etc/crontab” and on each cron directory
    remedy: {chmod: o-rwx}
    docs: https://manpages.debian.org/unstable/cron/cron.8.en.html
    references:
      - {title: Lynis FILE-7524, url: "https://cisofy.com/lynis/controls/FILE-7524/"}
    tags: [cron, files, lynis]
  cron/off:
    title: cron is installed but not enabled and running
    fact: systemd.state.*
    keys: {const: cron.service}
    when:
      systemd.state:
        required: [cron.service]
        properties: {cron.service: {required: [masked], properties: {masked: {const: false}}}}
    expect: {required: [enabled], properties: {enabled: {const: true}, active: {const: active}}}
    severity: info
    score: 1.0
    message: "{subject} is not both enabled and running, so the jobs in /etc/crontab and /etc/cron.d, log rotation and other upkeep among them, never run"
    rationale: scheduled jobs such as log rotation and security upkeep never run, so logs fill the disk and routine tasks silently stop
    fix: run “systemctl enable --now {subject}”, or remove the cron package if no job is wanted
    docs: https://manpages.debian.org/unstable/cron/cron.8.en.html
    tags: [cron, cis-ubuntu-26.04:2.4.1.1, cis-controls-v8:0.0, '!default']
  cron/no-allow:
    title: crontab is open to users not named in cron.allow
    fact: cron.access.*.exists
    keys: {const: /etc/cron.allow}
    when: {/cron/access/~1usr~1bin~1crontab/exists: true}
    expect: {const: true}
    severity: info
    score: 1.0
    message: "{subject} does not exist, so every user cron.deny leaves out may schedule jobs with crontab"
    rationale: any user not blocked by name can schedule their own jobs, and a job planted by a compromised account keeps running unseen
    fix:
      - Write the users allowed to schedule jobs to {subject}, one per line.
      - 'Then give it to root and its group:'
      - run: chown root:crontab {subject}
      - 'Then limit it to its owner and group:'
      - run: chmod 0640 {subject}
    docs: https://manpages.debian.org/unstable/cron/crontab.1.en.html
    tags: [cron, cis-ubuntu-26.04:2.4.1.9, cis-controls-v8:3.3, hipaa:164.308(a)(3)(i), hipaa:164.308(a)(3)(ii)(A), hipaa:164.312(a)(1), iso-27001-2022:A5.10, iso-27001-2022:A5.15, iso-27001-2022:A8.3, iso-27001-2022:A8.4, nist-800-171-r2:3.1.1, nist-800-171-r2:3.1.2, nist-800-171-r2:3.8.2, nist-800-171-r3:03.01.01, nist-800-171-r3:03.01.02, nist-800-171-r3:03.01.03, nist-800-171-r3:3.8.2, nist-800-53:AC-3, nist-800-53:AC-5, nist-800-53:AC-6, nist-800-53:CA-3(6), nist-800-53:MP-2, pci-dss-4:1.3.1, pci-dss-4:7.1]
  cron/access-mode:
    title: cron.allow or cron.deny is more open than 0640
    fact: cron.access.*.mode
    keys: &cron-access {enum: [/etc/cron.allow, /etc/cron.deny]}
    when: &cron-exists {cron.access.*.exists: true}
    expect: {pattern: "^0[0246][04]0$"}
    severity: info
    score: 1.0
    message: "{subject} has mode {got}; the benchmark asks 0640 or stricter, so only root changes who may schedule jobs"
    rationale: a user who can edit the list can allow themselves to schedule jobs, which can be used to keep a foothold on the host
    fix:
      - 'Give the file to the group the command reads it through:'
      - run: chgrp crontab {subject}
      - 'Then limit it to its owner and that group:'
      - run: chmod 0640 {subject}
    docs: https://manpages.debian.org/unstable/cron/crontab.1.en.html
    tags: [cron, cis-ubuntu-26.04:2.4.1.9, cis-controls-v8:3.3, hipaa:164.308(a)(3)(i), hipaa:164.308(a)(3)(ii)(A), hipaa:164.312(a)(1), iso-27001-2022:A5.10, iso-27001-2022:A5.15, iso-27001-2022:A8.3, iso-27001-2022:A8.4, nist-800-171-r2:3.1.1, nist-800-171-r2:3.1.2, nist-800-171-r2:3.8.2, nist-800-171-r3:03.01.01, nist-800-171-r3:03.01.02, nist-800-171-r3:03.01.03, nist-800-171-r3:3.8.2, nist-800-53:AC-3, nist-800-53:AC-5, nist-800-53:AC-6, nist-800-53:CA-3(6), nist-800-53:MP-2, pci-dss-4:1.3.1, pci-dss-4:7.1]
  cron/access-owner:
    title: cron.allow or cron.deny is not owned by root
    fact: cron.access.*.uid
    keys: *cron-access
    when: *cron-exists
    expect: {const: 0}
    severity: info
    score: 1.0
    message: "{subject} is owned by uid {got}, not root, so that user decides who may schedule jobs"
    rationale: that user can allow themselves to schedule jobs, and so keep a foothold on the host
    fix: run “chown root {subject}”
    remedy: {chown: 0}
    docs: https://manpages.debian.org/unstable/cron/crontab.1.en.html
    tags: [cron, cis-ubuntu-26.04:2.4.1.9, cis-controls-v8:3.3, hipaa:164.308(a)(3)(i), hipaa:164.308(a)(3)(ii)(A), hipaa:164.312(a)(1), iso-27001-2022:A5.10, iso-27001-2022:A5.15, iso-27001-2022:A8.3, iso-27001-2022:A8.4, nist-800-171-r2:3.1.1, nist-800-171-r2:3.1.2, nist-800-171-r2:3.8.2, nist-800-171-r3:03.01.01, nist-800-171-r3:03.01.02, nist-800-171-r3:03.01.03, nist-800-171-r3:3.8.2, nist-800-53:AC-3, nist-800-53:AC-5, nist-800-53:AC-6, nist-800-53:CA-3(6), nist-800-53:MP-2, pci-dss-4:1.3.1, pci-dss-4:7.1]
  cron/access-group:
    title: cron.allow or cron.deny is in a group other than root or crontab
    fact: cron.access.*.gid
    keys: *cron-access
    when: {cron.access.*.exists: true, cron.access.*.gid: {not: {const: 0}}}
    same: accounts.group.crontab.gid
    severity: info
    score: 1.0
    message: "{subject} belongs to gid {got}, not root or crontab (gid {same}), so the members of that group get the group’s access to the list of who may schedule cron jobs"
    rationale: members of that group can edit the list of who may schedule jobs, and so give themselves a way to keep a foothold on the host
    fix: run “chgrp crontab {subject}”
    docs: https://manpages.debian.org/unstable/cron/crontab.1.en.html
    tags: [cron, cis-ubuntu-26.04:2.4.1.9, cis-controls-v8:3.3, hipaa:164.308(a)(3)(i), hipaa:164.308(a)(3)(ii)(A), hipaa:164.312(a)(1), iso-27001-2022:A5.10, iso-27001-2022:A5.15, iso-27001-2022:A8.3, iso-27001-2022:A8.4, nist-800-171-r2:3.1.1, nist-800-171-r2:3.1.2, nist-800-171-r2:3.8.2, nist-800-171-r3:03.01.01, nist-800-171-r3:03.01.02, nist-800-171-r3:03.01.03, nist-800-171-r3:3.8.2, nist-800-53:AC-3, nist-800-53:AC-5, nist-800-53:AC-6, nist-800-53:CA-3(6), nist-800-53:MP-2, pci-dss-4:1.3.1, pci-dss-4:7.1]
