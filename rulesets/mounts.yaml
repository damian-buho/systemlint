description: World-writable mounts that honour set-user-ID bits, device files or programs
topic: Files and permissions
tags: [default]
rules:
  mounts/nosuid:
    title: A world-writable mount honours set-user-ID bits
    fact: mounts.active.*.options
    keys: {enum: [/tmp, /var/tmp, /dev/shm]}
    when: {mounts: {required: [active]}}
    expect: {contains: {const: nosuid}}
    severity: warning
    score: 4.5
    message: "{subject} is mounted without nosuid, so a set-user-ID file left in this directory every user writes runs with its owner’s rights"
    rationale: anyone can leave a program that runs with its owner’s rights, root’s included, in a directory every user can write
    fix:
      - 'Add “nosuid” to the options of {subject} where it is mounted from: its line in “/etc/fstab”, or the “Options=” line of its “.mount” unit.'
      - 'Apply it now, without a reboot:'
      - run: 'mount -o remount,nosuid {subject}'
    docs: https://man7.org/linux/man-pages/man8/mount.8.html
    references:
      - {title: Lynis FILE-6374, url: "https://cisofy.com/lynis/controls/FILE-6374/"}
    tags: [mounts, lynis]
  mounts/nodev:
    title: A world-writable mount honours device files
    fact: mounts.active.*.options
    keys: {enum: [/tmp, /var/tmp, /dev/shm]}
    when: {mounts: {required: [active]}}
    expect: {contains: {const: nodev}}
    severity: warning
    score: 4.5
    message: "{subject} is mounted without nodev, so a device file unpacked into this directory every user writes opens the device it names"
    rationale: anyone can create a device file in a directory every user can write and read or overwrite the disk or memory it names
    fix:
      - 'Add “nodev” to the options of {subject} where it is mounted from: its line in “/etc/fstab”, or the “Options=” line of its “.mount” unit.'
      - 'Apply it now, without a reboot:'
      - run: 'mount -o remount,nodev {subject}'
    docs: https://man7.org/linux/man-pages/man8/mount.8.html
    references:
      - {title: Lynis FILE-6374, url: "https://cisofy.com/lynis/controls/FILE-6374/"}
    tags: [mounts, lynis]
  mounts/noexec:
    title: A world-writable mount runs programs
    fact: mounts.active.*.options
    keys: {enum: [/tmp, /var/tmp, /dev/shm]}
    when: {mounts: {required: [active]}}
    expect: {contains: {const: noexec}}
    severity: warning
    score: 3.5
    message: "{subject} is mounted without noexec, so a program anyone drops into this directory every user writes runs straight from it"
    rationale: any user can place a program in a directory every user can write and run it from there
    fix:
      - 'Add “noexec” to the options of {subject} where it is mounted from: its line in “/etc/fstab”, or the “Options=” line of its “.mount” unit.'
      - 'Apply it now, without a reboot:'
      - run: 'mount -o remount,noexec {subject}'
    docs: https://man7.org/linux/man-pages/man8/mount.8.html
    fixes:
      - when: {meta.subject.kind: container}
        fix:
          - 'The container’s runtime mounts {subject}: add “noexec” to it in the run options, such as “tmpfs: [{subject}:noexec]” in its compose service, or “--tmpfs {subject}:noexec” for “docker run”.'
          - Recreate the container.
      - when: {mounts.fstab.*: {type: object}}
        fix:
          - 'Add “noexec” to the options of the {subject} line in “/etc/fstab”.'
          - 'Apply it now, without a reboot:'
          - run: 'mount -o remount,noexec {subject}'
      - keys: {const: /tmp}
        when: {systemd.state: {required: [tmp.mount], properties: {tmp.mount: {required: [masked], properties: {masked: {const: false}}}}}}
        fix:
          - 'systemd mounts {subject} from “tmp.mount”; read the options it sets:'
          - run: 'systemctl cat tmp.mount'
          - 'Write these lines to “/etc/systemd/system/tmp.mount.d/noexec.conf”, the “Options=” line holding those options with “noexec” added:'
          - lines: ['[Mount]', 'Options=<its options>,noexec']
          - 'Load the change and apply it now:'
          - run: 'systemctl daemon-reload'
          - run: 'mount -o remount,noexec {subject}'
      - keys: {const: /var/tmp}
        when: {systemd.state: {required: [var-tmp.mount], properties: {var-tmp.mount: {required: [masked], properties: {masked: {const: false}}}}}}
        fix:
          - 'systemd mounts {subject} from “var-tmp.mount”; read the options it sets:'
          - run: 'systemctl cat var-tmp.mount'
          - 'Write these lines to “/etc/systemd/system/var-tmp.mount.d/noexec.conf”, the “Options=” line holding those options with “noexec” added:'
          - lines: ['[Mount]', 'Options=<its options>,noexec']
          - 'Load the change and apply it now:'
          - run: 'systemctl daemon-reload'
          - run: 'mount -o remount,noexec {subject}'
      - when: {mounts.active.*.filesystem: tmpfs}
        fix:
          - 'systemd mounts {subject} itself, from no file; add this line to “/etc/fstab”, which it then reads instead:'
          - lines: ['tmpfs {subject} tmpfs defaults,nosuid,nodev,noexec 0 0']
          - 'Load the change and apply it now:'
          - run: 'systemctl daemon-reload'
          - run: 'mount -o remount,noexec {subject}'
    references:
      - {title: Lynis FILE-6374, url: "https://cisofy.com/lynis/controls/FILE-6374/"}
    tags: [mounts, lynis]
  mounts/fstab-nosuid:
    title: A world-writable mount is declared without nosuid
    fact: mounts.fstab.*.options
    keys: {enum: [/tmp, /var/tmp, /dev/shm]}
    when: {mounts: {not: {required: [active]}}}
    expect: {contains: {const: nosuid}}
    severity: warning
    score: 4.5
    message: "/etc/fstab mounts {subject} without nosuid, so a set-user-ID file left in this directory every user writes runs with its owner’s rights"
    rationale: after the next boot anyone can leave a program that runs with its owner’s rights, root’s included, in a directory every user can write
    fix: add “nosuid” to the options of {subject} in “/etc/fstab”
    docs: https://man7.org/linux/man-pages/man5/fstab.5.html
    references:
      - {title: Lynis FILE-6374, url: "https://cisofy.com/lynis/controls/FILE-6374/"}
    tags: [mounts, lynis]
  mounts/fstab-nodev:
    title: A world-writable mount is declared without nodev
    fact: mounts.fstab.*.options
    keys: {enum: [/tmp, /var/tmp, /dev/shm]}
    when: {mounts: {not: {required: [active]}}}
    expect: {contains: {const: nodev}}
    severity: warning
    score: 4.5
    message: "/etc/fstab mounts {subject} without nodev, so a device file unpacked into this directory every user writes opens the device it names"
    rationale: after the next boot anyone can create a device file in a directory every user can write and read or overwrite the disk or memory it names
    fix: add “nodev” to the options of {subject} in “/etc/fstab”
    docs: https://man7.org/linux/man-pages/man5/fstab.5.html
    references:
      - {title: Lynis FILE-6374, url: "https://cisofy.com/lynis/controls/FILE-6374/"}
    tags: [mounts, lynis]
  mounts/fstab-noexec:
    title: A world-writable mount is declared without noexec
    fact: mounts.fstab.*.options
    keys: {enum: [/tmp, /var/tmp, /dev/shm]}
    when: {mounts: {not: {required: [active]}}}
    expect: {contains: {const: noexec}}
    severity: warning
    score: 3.5
    message: "/etc/fstab mounts {subject} without noexec, so a program anyone drops into this directory every user writes runs straight from it"
    rationale: after the next boot any user can place a program in a directory every user can write and run it from there
    fix: add “noexec” to the options of {subject} in “/etc/fstab”
    docs: https://man7.org/linux/man-pages/man5/fstab.5.html
    references:
      - {title: Lynis FILE-6374, url: "https://cisofy.com/lynis/controls/FILE-6374/"}
    tags: [mounts, lynis]
  mounts/separate-tmp:
    title: /tmp is not a separate mount
    fact: mounts.active
    when: {mounts: {required: [active]}}
    expect: {required: [/tmp]}
    severity: info
    score: 1.0
    message: "/tmp is no mount of its own, so filling it fills the file system it shares, and its mount options cannot differ"
    rationale: a user who fills /tmp can stop the whole system from writing files, and /tmp cannot be locked against programs and device files
    fix:
      - 'Give “/tmp” its own partition, logical volume or tmpfs.'
      - 'Mount it at boot from a line in “/etc/fstab” or a “.mount” unit for “/tmp”.'
    docs: https://man7.org/linux/man-pages/man5/fstab.5.html
    tags: [mounts, cis-ubuntu-26.04:1.1.2.1.1, cis-controls-v8:3.3, '!default']
  mounts/separate-dev-shm:
    title: /dev/shm is not a separate mount
    fact: mounts.active
    when: {mounts: {required: [active]}}
    expect: {required: [/dev/shm]}
    severity: info
    score: 1.0
    message: "/dev/shm is no mount of its own, so filling it fills the file system it shares, and its mount options cannot differ"
    rationale: a user who fills /dev/shm can stop the whole system from writing files, and it cannot be locked against programs and device files
    fix:
      - 'Give “/dev/shm” its own partition, logical volume or tmpfs.'
      - 'Mount it at boot from a line in “/etc/fstab” or a “.mount” unit for “/dev/shm”.'
    docs: https://man7.org/linux/man-pages/man5/fstab.5.html
    tags: [mounts, cis-ubuntu-26.04:1.1.2.2.1, cis-controls-v8:3.3, '!default']
  mounts/separate-home:
    title: /home is not a separate mount
    fact: mounts.active
    when: {mounts: {required: [active]}}
    expect: {required: [/home]}
    severity: info
    score: 1.0
    message: "/home is no mount of its own, so filling it fills the file system it shares, and its mount options cannot differ"
    rationale: one user’s huge files can fill the disk for everyone, and /home cannot be locked against set-user-ID programs and device files
    fix:
      - 'Give “/home” its own partition, logical volume or tmpfs.'
      - 'Mount it at boot from a line in “/etc/fstab” or a “.mount” unit for “/home”.'
    docs: https://man7.org/linux/man-pages/man5/fstab.5.html
    tags: [mounts, cis-ubuntu-26.04:1.1.2.3.1, cis-controls-v8:3.3, '!default']
  mounts/separate-var:
    title: /var is not a separate mount
    fact: mounts.active
    when: {mounts: {required: [active]}}
    expect: {required: [/var]}
    severity: info
    score: 1.0
    message: "/var is no mount of its own, so filling it fills the file system it shares, and its mount options cannot differ"
    rationale: growing logs, caches or spools can fill the disk the system itself runs from and bring services down
    fix:
      - 'Give “/var” its own partition, logical volume or tmpfs.'
      - 'Mount it at boot from a line in “/etc/fstab” or a “.mount” unit for “/var”.'
    docs: https://man7.org/linux/man-pages/man5/fstab.5.html
    tags: [mounts, cis-ubuntu-26.04:1.1.2.4.1, cis-controls-v8:3.3, '!default']
  mounts/separate-var-tmp:
    title: /var/tmp is not a separate mount
    fact: mounts.active
    when: {mounts: {required: [active]}}
    expect: {required: [/var/tmp]}
    severity: info
    score: 1.0
    message: "/var/tmp is no mount of its own, so filling it fills the file system it shares, and its mount options cannot differ"
    rationale: a user who fills /var/tmp can stop the whole system from writing files, and it cannot be locked against programs and device files
    fix:
      - 'Give “/var/tmp” its own partition, logical volume or tmpfs.'
      - 'Mount it at boot from a line in “/etc/fstab” or a “.mount” unit for “/var/tmp”.'
    docs: https://man7.org/linux/man-pages/man5/fstab.5.html
    tags: [mounts, cis-ubuntu-26.04:1.1.2.5.1, '!default']
  mounts/separate-var-log:
    title: /var/log is not a separate mount
    fact: mounts.active
    when: {mounts: {required: [active]}}
    expect: {required: [/var/log]}
    severity: info
    score: 1.0
    message: "/var/log is no mount of its own, so filling it fills the file system it shares, and its mount options cannot differ"
    rationale: a flood of log lines can fill the disk the system runs from, and the logs an attacker would erase sit with everything else
    fix:
      - 'Give “/var/log” its own partition, logical volume or tmpfs.'
      - 'Mount it at boot from a line in “/etc/fstab” or a “.mount” unit for “/var/log”.'
    docs: https://man7.org/linux/man-pages/man5/fstab.5.html
    tags: [mounts, cis-ubuntu-26.04:1.1.2.6.1, cis-controls-v8:8.3, iso-27001-2022:A8.6, nist-800-53:AU-4, '!default']
  mounts/separate-var-log-audit:
    title: /var/log/audit is not a separate mount
    fact: mounts.active
    when: {mounts: {required: [active]}}
    expect: {required: [/var/log/audit]}
    severity: info
    score: 1.0
    message: "/var/log/audit is no mount of its own, so filling it fills the file system it shares, and its mount options cannot differ"
    rationale: a flood of audit records can fill the disk the system runs from, and once it is full the system halts or stops recording
    fix:
      - 'Give “/var/log/audit” its own partition, logical volume or tmpfs.'
      - 'Mount it at boot from a line in “/etc/fstab” or a “.mount” unit for “/var/log/audit”.'
    docs: https://man7.org/linux/man-pages/man5/fstab.5.html
    tags: [mounts, cis-ubuntu-26.04:1.1.2.7.1, cis-controls-v8:8.3, iso-27001-2022:A8.6, nist-800-53:AU-4, '!default']
  mounts/partition-nodev:
    title: A data mount opens device files
    fact: mounts.active.*.options
    keys: {enum: [/home, /var, /var/log, /var/log/audit]}
    when: {mounts: {required: [active]}}
    expect: {contains: {const: nodev}}
    severity: info
    score: 1.0
    message: "{subject} is mounted without nodev, so a device file on this data mount, unpacked from an archive or an image, gives raw access to the disk or memory it names"
    rationale: a device file smuggled in on this disk, for instance inside an archive or an image, lets a user read or overwrite the disk or memory it names
    fix:
      - 'Add “nodev” to the options of {subject} where it is mounted from: its line in “/etc/fstab”, or the “Options=” line of its “.mount” unit.'
      - 'Apply it now, without a reboot:'
      - run: 'mount -o remount,nodev {subject}'
    docs: https://man7.org/linux/man-pages/man8/mount.8.html
    tags: [mounts, cis-ubuntu-26.04:1.1.2.3.2, cis-ubuntu-26.04:1.1.2.4.2, cis-ubuntu-26.04:1.1.2.6.2, cis-ubuntu-26.04:1.1.2.7.2, cis-controls-v8:3.3, hipaa:164.312(a)(1), iso-27001-2022:A5.15, iso-27001-2022:A8.3, nist-800-171-r2:3.1.2, nist-800-171-r3:03.01.02, nist-800-53:AC-3, nist-800-53:AC-6]
  mounts/partition-nosuid:
    title: A data mount honours set-user-ID bits
    fact: mounts.active.*.options
    keys: {enum: [/home, /var, /var/log, /var/log/audit]}
    when: {mounts: {required: [active]}}
    expect: {contains: {const: nosuid}}
    severity: info
    score: 1.0
    message: "{subject} is mounted without nosuid, so a set-user-ID program on this data mount runs as its owner, root included, though no package installed it"
    rationale: a program with the set-user-ID bit placed on this disk runs with its owner’s rights, root’s included
    fix:
      - 'Add “nosuid” to the options of {subject} where it is mounted from: its line in “/etc/fstab”, or the “Options=” line of its “.mount” unit.'
      - 'Apply it now, without a reboot:'
      - run: 'mount -o remount,nosuid {subject}'
    docs: https://man7.org/linux/man-pages/man8/mount.8.html
    tags: [mounts, cis-ubuntu-26.04:1.1.2.3.3, cis-ubuntu-26.04:1.1.2.4.3, cis-ubuntu-26.04:1.1.2.6.3, cis-ubuntu-26.04:1.1.2.7.3, cis-controls-v8:3.3, hipaa:164.312(a)(1), iso-27001-2022:A5.15, iso-27001-2022:A8.3, nist-800-171-r2:3.1.2, nist-800-171-r3:03.01.02, nist-800-53:AC-3, nist-800-53:AC-6]
  mounts/partition-noexec:
    title: A data mount runs programs
    fact: mounts.active.*.options
    keys: {enum: [/var/log, /var/log/audit]}
    when: {mounts: {required: [active]}}
    expect: {contains: {const: noexec}}
    severity: info
    score: 1.0
    message: "{subject} is mounted without noexec; the benchmark asks it on this data mount"
    rationale: a program an attacker writes to this data disk can be run straight from it
    fix:
      - 'Add “noexec” to the options of {subject} where it is mounted from: its line in “/etc/fstab”, or the “Options=” line of its “.mount” unit.'
      - 'Apply it now, without a reboot:'
      - run: 'mount -o remount,noexec {subject}'
    docs: https://man7.org/linux/man-pages/man8/mount.8.html
    tags: [mounts, cis-ubuntu-26.04:1.1.2.6.4, cis-ubuntu-26.04:1.1.2.7.4, cis-controls-v8:3.3, hipaa:164.312(a)(1), iso-27001-2022:A5.15, iso-27001-2022:A8.3, nist-800-171-r2:3.1.2, nist-800-171-r3:03.01.02, nist-800-53:AC-3, nist-800-53:AC-6, '!default']
  mounts/proc-hidepid:
    title: Every user sees every process
    fact: mounts.active./proc.options
    when: {mounts: {required: [active], properties: {active: {required: [/proc]}}}}
    expect: {contains: {pattern: "^hidepid=([12]|noaccess|invisible)$"}}
    severity: info
    score: 2.0
    message: "/proc is mounted without hidepid, so every user reads every other user’s processes and their command lines, a password passed as an argument included"
    rationale: any user can see what every other user runs and read command lines, so a password typed as an argument leaks
    fix:
      - 'Add “hidepid=invisible,gid=<group>” to the options of “/proc” in “/etc/fstab”, where “<group>” is a group polkit and your monitoring run in.'
      - 'Apply it now, without a reboot:'
      - run: 'mount -o remount /proc'
    docs: https://docs.kernel.org/filesystems/proc.html#mount-options
    references:
      - {title: Lynis FILE-6344, url: "https://cisofy.com/lynis/controls/FILE-6344/"}
    tags: [mounts, lynis, '!default']
