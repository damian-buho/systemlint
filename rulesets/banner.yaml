description: Login banners and messages of the day that a user other than root can rewrite
topic: Files and permissions
tags: [default]
rules:
  banner/discloses-system:
    title: The login banner names the system
    fact: banner-text.*.*
    expect: {not: {contains: {pattern: '(?i)(^|[^\\])(\\\\)*\\[vrms]'}}}
    severity: info
    score: 1.0
    message: "{subject} holds an agetty escape (\\s, \\r, \\v or \\m), so whoever reaches the login prompt reads the operating system, kernel release or architecture"
    rationale: an attacker at the login prompt learns the exact operating system and kernel, and can pick an exploit that fits
    fix: remove the “\s”, “\r”, “\v” and “\m” escapes from the file
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/agetty.8.html
    references:
      - {title: Lynis BANN-7126, url: "https://cisofy.com/lynis/controls/BANN-7126/"}
      - {title: Lynis BANN-7130, url: "https://cisofy.com/lynis/controls/BANN-7130/"}
    tags: [banner, lynis, cis-ubuntu-26.04:1.6.1, cis-ubuntu-26.04:1.6.2, cis-ubuntu-26.04:1.6.3, cis-ubuntu-26.04:1.6.4, cis-ubuntu-26.04:1.6.5, '!default']
  banner/writable:
    title: The login banner is writable by other users
    facts:
      all:
        - {fact: banner.*.*.world-writable, expect: {const: false}}
        - {fact: banner.*.*.group-writable, expect: {const: false}}
    severity: info
    score: 3.0
    message: "{subject} is writable by its group or by every user, who can then show a forged notice to everyone who logs in and ask for their password"
    rationale: any user who can write to the banner can show every person logging in a forged notice, for instance a request for their password
    fix: run “chmod go-w” on the file
    remedy: {chmod: go-w}
    docs: https://manpages.debian.org/unstable/manpages/motd.5.en.html
    tags: [banner, cis-ubuntu-26.04:1.6.6, cis-ubuntu-26.04:1.6.7, cis-ubuntu-26.04:1.6.8, cis-ubuntu-26.04:1.6.9, cis-ubuntu-26.04:1.6.10, cis-controls-v8:3.3, hipaa:164.312(a)(1), iso-27001-2022:A5.15, iso-27001-2022:A8.3, nist-800-171-r2:3.1.2, nist-800-171-r3:03.01.02, nist-800-53:AC-3, nist-800-53:AC-6]
  banner/owner:
    title: The login banner is not owned by root
    fact: banner.*.*.uid
    expect: {const: 0}
    severity: info
    score: 2.0
    message: "{subject} is owned by uid {got}, so that user can show a forged notice to everyone who logs in"
    rationale: a non-root owner can show every person logging in a forged notice, for instance a request for their password
    fix: run “chown root” on the file
    remedy: {chown: 0}
    docs: https://manpages.debian.org/unstable/manpages/motd.5.en.html
    tags: [banner, cis-ubuntu-26.04:1.6.6, cis-ubuntu-26.04:1.6.7, cis-ubuntu-26.04:1.6.8, cis-ubuntu-26.04:1.6.9, cis-ubuntu-26.04:1.6.10, cis-controls-v8:3.3, hipaa:164.312(a)(1), iso-27001-2022:A5.15, iso-27001-2022:A8.3, nist-800-171-r2:3.1.2, nist-800-171-r3:03.01.02, nist-800-53:AC-3, nist-800-53:AC-6]
  banner/update-notifier-service:
    title: The update-notifier motd service is enabled or running
    fact: systemd.state.*
    keys: {enum: [update-notifier-motd.service]}
    expect: &off
      anyOf:
        - {properties: {masked: {const: true}}, required: [masked]}
        - properties:
            enabled: {const: false}
            active: {not: {enum: [active, activating, reloading]}}
    severity: info
    score: 1.0
    message: "{subject} is enabled or running: it writes the pending and security update counts into the message of the day every user reads at login"
    rationale: every user who logs in is told which updates are pending, which reveals unpatched flaws an attacker can use
    fix: run “systemctl mask --now” on the unit
    remedy: mask
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/pam_motd.8.html
    tags: [banner, cis-ubuntu-26.04:1.6.11, cis-controls-v8:4.8, iso-27001-2022:A8.9, nist-800-171-r2:3.4.7, nist-800-171-r3:03.04.06, nist-800-53:CM-6, nist-800-53:CM-7, pci-dss-4:2.2.4, '!default']
  banner/update-notifier-timer:
    title: The update-notifier motd timer is enabled or running
    fact: systemd.state.*
    keys: {enum: [update-notifier-motd.timer]}
    expect: *off
    severity: info
    score: 1.0
    message: "{subject} is enabled or running: it starts update-notifier-motd.service again on a schedule, which writes the update counts into the message of the day"
    rationale: every user who logs in is told which updates are pending, which reveals unpatched flaws an attacker can use
    fix: run “systemctl mask --now” on the unit
    remedy: mask
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/pam_motd.8.html
    tags: [banner, cis-ubuntu-26.04:1.6.12, cis-controls-v8:4.8, iso-27001-2022:A8.9, nist-800-171-r2:3.4.7, nist-800-171-r3:03.04.06, nist-800-53:CM-6, nist-800-53:CM-7, pci-dss-4:2.2.4, '!default']
  banner/stig-issue-empty:
    title: The local login banner is empty
    fact: banner-text.files
    expect: {required: [/etc/issue], properties: {/etc/issue: {contains: {pattern: "\\S"}}}}
    severity: info
    score: 1.0
    message: "/etc/issue is missing or blank, so the console login prompt shows no notice before access; the STIG asks the site’s notice there"
    rationale: a person who logs in is shown no notice that access is restricted and monitored, which weakens the host owner’s hand against someone who abuses it
    fix: write the site’s login notice to “/etc/issue”
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/agetty.8.html
    tags: ['!default', banner, stig-ubuntu-26.04:UBTU-24-200660]
