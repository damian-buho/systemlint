description: each user’s ~/.ssh and what is in it, kept from other users
topic: Files and permissions
tags: [default]
rules:
  ssh-user/world-writable:
    title: An SSH user file is writable by every user
    fact: ssh-user.*.*.world-writable
    expect: {const: false}
    severity: error
    score: 9.0
    message: "{subject} is writable by every user, who can then add a key or a command and log in as its owner"
    rationale: any local user can add their own key or command and log in as the file’s owner
    fix: run “chmod o-w” on the file
    remedy: {chmod: o-w}
    docs: https://man.openbsd.org/sshd#FILES
    tags: [ssh]
  ssh-user/directory-mode:
    title: "~/.ssh is open to other users"
    fact: ssh-user.directories.*.mode
    expect: {pattern: "^[0-7]{3}0$"}
    severity: warning
    score: 3.0
    message: "{subject} has mode {got}; other users can reach its public keys, known_hosts and config, which name the hosts its owner logs in to"
    rationale: other local users can see which hosts the owner connects to and which keys are used, which helps them pick targets
    fix: run “chmod 0700” on the directory
    remedy: {chmod: o-rwx}
    docs: https://man.openbsd.org/ssh#FILES
    tags: [ssh]
