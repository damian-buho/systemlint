description: An installed ufw firewall left switched off, or never started at boot
topic: Network
tags: [default]
rules:
  ufw/not-installed:
    title: ufw is not installed
    fact: ufw.binary
    expect: {minProperties: 1}
    severity: info
    score: 1.0
    message: "no ufw program is in /usr/sbin, /sbin or /usr/local/sbin; the benchmark asks for ufw as the host firewall"
    rationale: the host has no firewall managed by ufw, so every service it runs listens to whoever can reach it
    fix:
      - 'Install ufw:'
      - run: apt install ufw
      - 'Allow your own SSH session:'
      - run: ufw allow ssh
      - 'Then turn the firewall on:'
      - run: ufw enable
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/ufw.8.html
    tags: [ufw, firewall, cis-ubuntu-26.04:4.1.1, stig-ubuntu-26.04:UBTU-24-100300, cis-controls-v8:4.4, cis-controls-v8:4.5, nist-800-171-r3:03.13.06, nist-800-53:SC-7, nist-800-53:SC-7(5), pci-dss-4:1.2.1, pci-dss-4:1.4.1, '!default']
  ufw/disabled:
    title: ufw is installed but switched off
    fact: ufw.conf.ENABLED
    when: {ufw.binary: {minProperties: 1}}
    expect: {const: "yes"}
    severity: warning
    score: 5.5
    message: "/etc/ufw/ufw.conf sets ENABLED={got}, so ufw loads no rules at boot and the host runs without its firewall"
    rationale: the host runs with no firewall, so every listening service is open to the network
    fix: run “ufw enable” once the rules allow your own SSH session, or uninstall ufw if another firewall guards the host
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/ufw.8.html
    references:
      - {title: Lynis FIRE-4590, url: "https://cisofy.com/lynis/controls/FIRE-4590/"}
    tags: [ufw, firewall, lynis]
  ufw/service-masked:
    title: ufw is switched on but its service is masked
    fact: systemd.state.*.masked
    keys: {const: ufw.service}
    when: {ufw.binary: {minProperties: 1}, ufw.conf.ENABLED: "yes"}
    expect: {const: false}
    severity: warning
    score: 5.5
    message: "ufw.service is masked, so systemd never starts it and the rules /etc/ufw/ufw.conf enables are never loaded at boot"
    rationale: after each reboot the firewall rules are not loaded, so the host comes up open to the network
    fix:
      - 'Let the service start again:'
      - run: systemctl unmask ufw.service
      - 'Then enable and start it:'
      - run: systemctl enable --now ufw.service
    docs: https://www.freedesktop.org/software/systemd/man/latest/systemctl.html#mask%20UNIT%E2%80%A6
    references:
      - {title: Lynis FIRE-4590, url: "https://cisofy.com/lynis/controls/FIRE-4590/"}
    tags: [ufw, firewall, systemd, lynis]
  ufw/service-failed:
    title: ufw is switched on but its service failed
    fact: systemd.state.*.active
    keys: {const: ufw.service}
    when: {ufw.binary: {minProperties: 1}, ufw.conf.ENABLED: "yes", systemd.state.*: {required: [active]}}
    expect: {not: {const: failed}}
    severity: warning
    score: 5.5
    message: "ufw.service failed, so the rules /etc/ufw/ufw.conf enables are not loaded and the host runs without its firewall"
    rationale: the firewall rules are not loaded, so every listening service is open to the network
    fix:
      - 'Read the error:'
      - run: journalctl --unit ufw.service
      - Fix the rules it names.
      - 'Then restart the service:'
      - run: systemctl restart ufw.service
    docs: https://www.freedesktop.org/software/systemd/man/latest/journalctl.html
    references:
      - {title: Lynis FIRE-4590, url: "https://cisofy.com/lynis/controls/FIRE-4590/"}
    tags: [ufw, firewall, systemd, lynis]
  ufw/service-disabled:
    title: ufw is switched on but its service is disabled
    fact: systemd.state.*.enabled
    keys: {const: ufw.service}
    when: {ufw.binary: {minProperties: 1}, ufw.conf.ENABLED: "yes", systemd.state.*.masked: false}
    expect: {const: true}
    severity: warning
    score: 5.5
    message: "no .wants or .requires link pulls in ufw.service, so systemd never starts it and the rules /etc/ufw/ufw.conf enables are never loaded at boot"
    rationale: after each reboot the firewall rules are not loaded, so the host comes up open to the network
    fix: run “systemctl enable --now ufw.service”
    docs: https://www.freedesktop.org/software/systemd/man/latest/systemctl.html#enable%20UNIT%E2%80%A6
    references:
      - {title: Lynis FIRE-4590, url: "https://cisofy.com/lynis/controls/FIRE-4590/"}
    tags: [ufw, firewall, systemd, lynis]
  ufw/input-accepted:
    title: ufw is switched on but accepts incoming traffic by default
    fact: ufw.defaults.DEFAULT_INPUT_POLICY
    when: &on {ufw.binary: {minProperties: 1}, ufw.conf.ENABLED: "yes"}
    expect: &deny {pattern: "(?i)^(drop|reject)$"}
    severity: warning
    score: 5.5
    message: "/etc/default/ufw sets DEFAULT_INPUT_POLICY={got}, so every port no rule denies is open to the network although ufw is on"
    rationale: every service listening on an unlisted port, including ones installed by accident, can be reached from the network
    fix: run “ufw default deny incoming” once the rules allow your own SSH session
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/ufw.8.html
    tags: [ufw, firewall, cis-ubuntu-26.04:4.1.3, cis-controls-v8:4.4, cis-controls-v8:4.5, nist-800-171-r3:03.13.06, nist-800-53:SC-7, nist-800-53:SC-7(5), pci-dss-4:1.2.1, pci-dss-4:1.4.1]
  ufw/output-accepted:
    title: ufw accepts outgoing traffic by default
    fact: ufw.defaults.DEFAULT_OUTPUT_POLICY
    when: *on
    expect: *deny
    severity: info
    score: 1.0
    message: "/etc/default/ufw sets DEFAULT_OUTPUT_POLICY={got}; the benchmark asks to deny outgoing traffic no rule allows"
    rationale: malware on the host can call out to any address and send data away without the firewall stopping it
    fix:
      - 'Allow the outgoing traffic the host needs, for example DNS:'
      - run: ufw allow out 53
      - Do the same for ports 123, 443 and the like.
      - 'Then deny the rest:'
      - run: ufw default deny outgoing
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/ufw.8.html
    tags: [ufw, firewall, cis-ubuntu-26.04:4.1.4, cis-controls-v8:4.4, cis-controls-v8:4.5, nist-800-171-r3:03.13.06, nist-800-53:SC-7, nist-800-53:SC-7(5), pci-dss-4:1.2.1, pci-dss-4:1.4.1, '!default']
  ufw/routed-accepted:
    title: ufw does not deny routed traffic by default
    fact: ufw.defaults.DEFAULT_FORWARD_POLICY
    when: *on
    expect: {pattern: "(?i)^drop$"}
    severity: info
    score: 1.0
    message: "/etc/default/ufw sets DEFAULT_FORWARD_POLICY={got}; the benchmark asks to deny routed traffic no rule allows, whether or not the kernel forwards"
    rationale: a host that forwards packets passes traffic between networks that nobody approved, so one segment can reach another
    fix:
      - 'Deny routed traffic by default:'
      - run: ufw default deny routed
      - Then run “ufw route allow” for each forward the host needs.
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/ufw.8.html
    tags: [ufw, firewall, cis-ubuntu-26.04:4.1.5, cis-controls-v8:4.4, cis-controls-v8:4.5, nist-800-171-r3:03.13.06, nist-800-53:SC-7, nist-800-53:SC-7(5), pci-dss-4:1.2.1, pci-dss-4:1.4.1, '!default']
  ufw/logging-off:
    title: ufw logs no blocked packet
    fact: ufw.conf
    when: {ufw.binary: {minProperties: 1}, ufw.conf.ENABLED: "yes"}
    expect: {properties: {LOGLEVEL: {not: {pattern: "(?i)^off$"}}}}
    severity: info
    score: 1.0
    message: "/etc/ufw/ufw.conf sets LOGLEVEL=off, so a blocked probe or a refused connection leaves no trace"
    rationale: port scans and attack attempts leave no record, so an intrusion attempt goes unseen
    fix: run “ufw logging low”
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/ufw.8.html
    references:
      - {title: Lynis FIRE-4586, url: "https://cisofy.com/lynis/controls/FIRE-4586/"}
    tags: [ufw, firewall, lynis]
