description: Services written on this host that run as root with nothing confining them
topic: Services
tags: [default]
when: {systemd.units: {minProperties: 1}}
rules:
  services/unconfined-root:
    title: A local service runs as root with no sandbox
    facts:
      any:
        - {fact: systemd.units.*.sandbox.user, expect: {not: {enum: [root, "0"]}}}
        - {fact: systemd.units.*.sandbox.no-new-privileges, expect: {const: true}}
        - {fact: systemd.units.*.sandbox.protect-system, expect: {not: {const: "no"}}}
        - {fact: systemd.units.*.sandbox.capability-bounding-set, expect: {not: {const: all}}}
    when:
      systemd.units.*.file: {not: {pattern: "^/(usr/lib|lib|run)/"}}
      systemd.units.*.alias-of: null
      systemd.units.*.type: {not: {const: oneshot}}
      systemd.units.*.sections: {properties: {Unit: {not: {required: [X-Snappy]}}}}
      systemd.state.*.enabled: true
      systemd.state.*.masked: false
    severity: info
    score: 3.0
    message: "{subject} runs as root with every capability, may gain privileges through setuid programs and may write anywhere, so any bug in it hands over the whole host"
    rationale: a single flaw in the service gives an attacker complete control of the host
    fix:
      - Run “systemctl edit” on the unit and add “DynamicUser=yes”, or “User=” with a service account.
      - 'If it must stay root, add these lines in the same way:'
      - lines: ["NoNewPrivileges=yes", "ProtectSystem=strict"]
      - Also add a “CapabilityBoundingSet=” of only what it needs.
    docs: https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html#Sandboxing
    references:
      - {title: systemd-analyze security, url: "https://www.freedesktop.org/software/systemd/man/latest/systemd-analyze.html#systemd-analyze%20security%20%5BUNIT...%5D"}
    tags: [services, systemd, systemd-analyze]
