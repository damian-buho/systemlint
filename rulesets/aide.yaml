description: No file integrity checker on disk, or one that never runs
rules:
  aide/not-installed:
    title: No AIDE on disk
    fact: aide.binary
    expect: {minProperties: 1}
    severity: info
    score: 2.0
    message: "no aide program is in /usr/bin, /bin or /usr/local/bin, so a changed system file goes unnoticed"
    fix: install aide (apt install aide aide-common on Ubuntu), then run aideinit to build its first database
    docs: https://manpages.ubuntu.com/manpages/resolute/man1/aide.1.html
    references:
      - {title: Lynis FINT-4350, url: "https://cisofy.com/lynis/controls/FINT-4350/"}
    tags: [integrity, cis-ubuntu-26.04:6.3.1, lynis, stig-ubuntu-26.04:UBTU-24-100100]
  aide/unscheduled:
    title: AIDE installed but never run on a schedule
    fact: systemd.state
    when: {aide.binary: {minProperties: 1}}
    expect:
      required: [dailyaidecheck.timer]
      properties:
        dailyaidecheck.timer: {required: [enabled], properties: {enabled: {const: true}, active: {const: active}}}
        dailyaidecheck.service: {properties: {masked: {const: false}}}
    severity: info
    score: 2.0
    message: "dailyaidecheck.timer is missing, not enabled or not active, or dailyaidecheck.service is masked, so AIDE never compares the disk against its database"
    fix: run systemctl unmask dailyaidecheck.timer dailyaidecheck.service, then systemctl enable --now dailyaidecheck.timer
    docs: https://manpages.ubuntu.com/manpages/resolute/man1/aide.1.html
    tags: [integrity, cis-ubuntu-26.04:6.3.2, stig-ubuntu-26.04:UBTU-24-100120]
  aide/no-config:
    title: AIDE installed without a configuration file
    fact: aide.config
    when: {aide.binary: {minProperties: 1}}
    expect: {minProperties: 1}
    severity: info
    score: 1.0
    message: "aide is on disk but neither /etc/aide/aide.conf nor /etc/aide.conf is, so AIDE knows no file to watch"
    fix: reinstall aide-common, or write /etc/aide/aide.conf naming the paths to check
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/aide.conf.5.html
    references:
      - {title: Lynis FINT-4315, url: "https://cisofy.com/lynis/controls/FINT-4315/"}
    tags: [integrity, lynis]
  aide/no-database:
    title: AIDE installed without a database
    fact: aide.database
    when: {aide.binary: {minProperties: 1}}
    expect: {minProperties: 1}
    severity: info
    score: 2.0
    message: "aide is on disk but /var/lib/aide/aide.db is not, so AIDE has no baseline to compare the disk against"
    fix: run aideinit, then move /var/lib/aide/aide.db.new to /var/lib/aide/aide.db
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/aideinit.8.html
    references:
      - {title: Lynis FINT-4316, url: "https://cisofy.com/lynis/controls/FINT-4316/"}
    tags: [integrity, lynis, stig-ubuntu-26.04:UBTU-24-100110]
  aide/silent-reports:
    title: AIDE’s daily check mails no report
    fact: aide.default
    when: {aide.binary: {minProperties: 1}}
    expect: {required: [SILENTREPORTS], properties: {SILENTREPORTS: {const: "no"}}}
    severity: info
    score: 1.0
    message: "SILENTREPORTS in /etc/default/aide is unset or not no, so the daily check reports a changed file to nobody"
    fix: set SILENTREPORTS=no in /etc/default/aide, and MAILTO to the address that reads the reports
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/aideinit.8.html
    tags: [integrity, stig-ubuntu-26.04:UBTU-24-100130, '!default']
