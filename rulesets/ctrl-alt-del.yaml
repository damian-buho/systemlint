description: A Ctrl-Alt-Del at the console that reboots the host
topic: Boot and kernel
tags: [default]
when: {os.init: {not: {minProperties: 1, additionalProperties: {not: {contains: {enum: [systemd, init, openrc-init, runit]}}}}}}
rules:
  ctrl-alt-del/reboots:
    title: Ctrl-Alt-Del at the console reboots the host
    fact: systemd.state.*
    keys: {const: ctrl-alt-del.target}
    expect: {required: [masked], properties: {masked: {const: true}}}
    severity: info
    score: 1.0
    message: "ctrl-alt-del.target is not masked, so anyone at the console, or a stray key press, reboots the host without logging in"
    rationale: anyone at the keyboard, or a stray key press, restarts the host and cuts off its users and services
    fix:
      - 'Mask the target:'
      - run: systemctl mask ctrl-alt-del.target
      - 'Then set this line in a file under “/etc/systemd/system.conf.d/”:'
      - lines: ["CtrlAltDelBurstAction=none"]
    docs: https://manpages.ubuntu.com/manpages/resolute/man1/systemd.1.html
    tags: [boot, stig-ubuntu-26.04:UBTU-24-300026]
