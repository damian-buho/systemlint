description: files that grant root, hold password hashes or host keys, or sit in the PATH, kept to root alone
topic: Files and permissions
tags: [default]
vars:
  system-gid-max: {default: 999, minimum: 0, maximum: 4294967294}
rules:
  files/world-writable:
    title: A file is writable by every user
    fact: files.*.*.world-writable
    expect: {const: false}
    severity: error
    score: 9.5
    message: "{subject} is writable by every user, who can then act as root through it"
    rationale: any local user can change the file and so run their own commands as root
    fix: run “chmod o-w” on the file
    remedy: {chmod: o-w}
    docs: https://man7.org/linux/man-pages/man7/inode.7.html
    references:
      - {title: Lynis FILE-7524, url: "https://cisofy.com/lynis/controls/FILE-7524/"}
      - {title: Lynis AUTH-9252, url: "https://cisofy.com/lynis/controls/AUTH-9252/"}
      - {title: Lynis BOOT-5184, url: "https://cisofy.com/lynis/controls/BOOT-5184/"}
    tags: [files, lynis]
  files/group-writable:
    title: A file is writable by its group
    fact: files.*.*.group-writable
    expect: {const: false}
    severity: warning
    score: 6.0
    message: "{subject} is writable by its group, whose every member can then act as root through it"
    rationale: any member of that group can change the file and so run their own commands as root
    fix: run “chmod g-w” on the file, or check that only administrators are in its group
    docs: https://man7.org/linux/man-pages/man7/inode.7.html
    references:
      - {title: Lynis FILE-7524, url: "https://cisofy.com/lynis/controls/FILE-7524/"}
      - {title: Lynis AUTH-9252, url: "https://cisofy.com/lynis/controls/AUTH-9252/"}
    tags: [files, lynis]
  files/owner:
    title: A file is not owned by root
    fact: files.*.*.uid
    expect: {const: 0}
    severity: warning
    score: 5.5
    message: "{subject} is owned by uid {got}, not root, so that user can change it"
    rationale: that user can rewrite the file and take over whatever root runs from it
    fix: run “chown root” on the file
    remedy: {chown: 0}
    docs: https://man7.org/linux/man-pages/man7/inode.7.html
    references:
      - {title: Lynis FILE-7524, url: "https://cisofy.com/lynis/controls/FILE-7524/"}
      - {title: Lynis AUTH-9252, url: "https://cisofy.com/lynis/controls/AUTH-9252/"}
    tags: [files, lynis]
  files/shadow-mode:
    title: Password hashes are readable too widely
    fact: files.shadow.*.mode
    expect: {pattern: "^0[0246][04]0$"}
    severity: warning
    score: 6.5
    message: "{subject} has mode {got}; password hashes need 0640 or stricter, readable by root and the shadow group alone"
    rationale: a user who can read the password hashes can crack them offline and log in as anyone
    fix: run “chmod 0640” on the file
    remedy: {chmod: "u-xs,g-wxs,o-rwxt"}
    docs: https://manpages.debian.org/unstable/passwd/shadow.5.en.html
    tags: [files]
  files/ssh-host-key-mode:
    title: An SSH host key is readable too widely
    fact: files.ssh-host-keys.*.mode
    expect: {pattern: "^0[0246][04]0$"}
    severity: warning
    score: 6.0
    message: "{subject} has mode {got}; a private host key needs 0600, or 0640 for an ssh_keys group, or any user can impersonate this host"
    rationale: a user who reads the private key can pose as this server and capture the passwords of people who log in
    fix: run “chmod 0600” on the key
    remedy: {chmod: "u-xs,g-wxs,o-rwxt"}
    docs: https://man.openbsd.org/sshd#FILES
    tags: [files, ssh]
  files/apt-auth-readable:
    title: APT repository credentials are readable by every user
    fact: files.apt-auth.*.mode
    when: {files.apt-auth.*.kind: file}
    expect: {pattern: "^[0-7]{3}[0-3]$"}
    severity: warning
    score: 5.5
    message: "{subject} has mode {got}, so every user reads the logins and passwords APT uses for private repositories and proxies"
    rationale: any local user can read the logins and passwords for private package repositories and proxies
    fix: run “chmod 0640” on the file, or “chmod 0600”
    remedy: {chmod: o-r}
    docs: https://manpages.debian.org/unstable/apt/apt_auth.conf.5.en.html
    tags: [files, apt, cis-ubuntu-26.04:1.2.1.6]
  files/accounts-mode:
    title: An account database is more open than 0644
    fact: files.accounts.*.mode
    when: {files.accounts.*.kind: file}
    expect: {pattern: "^0[0246][04][04]$"}
    severity: warning
    score: 6.0
    message: "{subject} has mode {got}, beyond 0644, so someone other than root may rewrite the accounts it lists, or it carries an execute or special bit no database needs"
    rationale: a user who can rewrite the account list can add an account with root’s rights or unlock one without a password
    fix: run “chmod 0644” on the file
    remedy: {chmod: "u-xs,g-wxs,o-wxt"}
    docs: https://manpages.debian.org/unstable/manpages/passwd.5.en.html
    tags: [files, cis-ubuntu-26.04:7.1.1, cis-ubuntu-26.04:7.1.2, cis-ubuntu-26.04:7.1.3, cis-ubuntu-26.04:7.1.4, cis-ubuntu-26.04:7.1.9]
  files/bootloader-readable:
    title: The bootloader configuration is readable by other users
    fact: files.boot.*.mode
    when: {files.boot.*.kind: file}
    expect: {pattern: "^0[0-7]00$"}
    severity: info
    score: 3.0
    message: "{subject} has mode {got}; the benchmark asks 0600, so a GRUB password hash in it reaches no other user"
    rationale: any local user can read the boot password hash and crack it offline to edit the boot menu
    fix: run “chmod 0600” on the file, and keep it so across “update-grub” with a password set in “/etc/grub.d”
    remedy: {chmod: "g-rwxs,o-rwxt"}
    docs: https://www.gnu.org/software/grub/manual/grub/html_node/Authentication-and-authorisation.html
    tags: [files, boot, cis-ubuntu-26.04:1.4.2]
  files/audit-config-mode:
    title: The audit configuration is readable by other users
    fact: files.audit-config.*.mode
    when: {files.audit-config.*.kind: file}
    expect: {pattern: "^0[0246][04]0$"}
    severity: info
    score: 2.5
    message: "{subject} has mode {got}; the benchmark asks 0640 or stricter, so other users cannot read what is watched and plan around it"
    rationale: any local user can read what the audit system watches and choose actions that go unrecorded
    fix: run “chmod 0640” on the file
    remedy: {chmod: "u-xs,g-wxs,o-rwxt"}
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/auditd.conf.5.html
    tags: [files, audit, cis-ubuntu-26.04:6.2.4.5, stig-ubuntu-26.04:UBTU-24-900040]
  files/accounts-group:
    title: An account database is not in group root
    fact: files.accounts.*.gid
    when: {files.accounts.*.kind: file}
    expect: {const: 0}
    severity: info
    score: 1.5
    message: "{subject} belongs to gid {got}; the benchmark asks group root, so no other group’s change of mode can open it"
    rationale: a member of another group could be given access to the account list when its mode changes, and rewrite who may log in
    fix: run “chgrp 0” on the file
    remedy: {chgrp: 0}
    docs: https://manpages.debian.org/unstable/manpages/passwd.5.en.html
    tags: [files, cis-ubuntu-26.04:7.1.1, cis-ubuntu-26.04:7.1.2, cis-ubuntu-26.04:7.1.3, cis-ubuntu-26.04:7.1.4, cis-ubuntu-26.04:7.1.9, dev-sec-linux-baseline:os-03]
  files/shadow-group:
    title: Password hashes are in a group other than root or shadow
    fact: files.shadow.*.gid
    keys: {enum: [/etc/shadow, /etc/shadow-, /etc/gshadow, /etc/gshadow-]}
    when: {files.shadow.*.kind: file, accounts.group.shadow.gid: 42}
    expect: {enum: [0, 42]}
    severity: warning
    score: 6.0
    message: "{subject} belongs to gid {got}, so that group’s members can read the password hashes its mode lets the group read"
    rationale: every member of that group can read the password hashes and crack them offline
    fix: run “chgrp shadow” on the file
    docs: https://manpages.debian.org/unstable/passwd/shadow.5.en.html
    tags: [files, cis-ubuntu-26.04:7.1.5, cis-ubuntu-26.04:7.1.6, cis-ubuntu-26.04:7.1.7, cis-ubuntu-26.04:7.1.8, dev-sec-linux-baseline:os-02]
  files/audit-config-group:
    title: The audit configuration is not in group root
    fact: files.audit-config.*.gid
    expect: {const: 0}
    severity: info
    score: 1.5
    message: "{subject} belongs to gid {got}; the benchmark asks group root, so no other group’s change of mode can let it rewrite what is audited"
    rationale: members of another group could rewrite what the audit system records, and cover their tracks
    fix: run “chgrp 0” on the file
    remedy: {chgrp: 0}
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/auditd.conf.5.html
    tags: [files, audit, cis-ubuntu-26.04:6.2.4.7, stig-ubuntu-26.04:UBTU-24-900060]
  files/audit-tools-mode:
    title: An audit tool is more open than 0755
    fact: files.audit-tools.*.mode
    when: {files.audit-tools.*.kind: file}
    expect: {pattern: "^0[0-7][0145][0145]$"}
    severity: warning
    score: 4.0
    message: "{subject} has mode {got}, beyond 0755, so someone other than root may swap the tool that reads or changes the audit trail, or it runs with a set-ID or sticky bit it does not need"
    rationale: a user who can replace an audit tool can hide their own actions, or run their own code with the tool’s rights
    fix: run “chmod 0755” on the file
    remedy: {chmod: "ugo-st,go-w"}
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/auditctl.8.html
    tags: [files, audit, cis-ubuntu-26.04:6.2.4.8, stig-ubuntu-26.04:UBTU-24-901230]
  files/audit-tools-group:
    title: An audit tool is not in group root
    fact: files.audit-tools.*.gid
    when: {files.audit-tools.*.kind: file}
    expect: {const: 0}
    severity: info
    score: 3.0
    message: "{subject} belongs to gid {got}, not root, so the members of that group get the group’s access to a tool that reads or changes the audit trail"
    rationale: members of that group can tamper with the tools that read or change the audit trail and so erase evidence
    fix: run “chgrp 0” on the file
    remedy: {chgrp: 0}
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/auditctl.8.html
    tags: [files, audit, cis-ubuntu-26.04:6.2.4.10, stig-ubuntu-26.04:UBTU-24-901250]
  files/library-group:
    title: A shared library belongs to a group of user accounts
    fact: files.libraries.*.gid
    when: {files.libraries.*.kind: file}
    expect: {maximum: "${system-gid-max}"}
    severity: warning
    score: 6.0
    message: "{subject} belongs to gid {got}, above ${system-gid-max}, a group of user accounts, so those users get the group’s access to code every program loading it runs"
    rationale: any member of that group can modify code that every program loading the library runs, root’s programs included
    fix: run “chgrp 0” on the file
    remedy: {chgrp: 0}
    docs: https://man7.org/linux/man-pages/man8/ld.so.8.html
    tags: [files, stig-ubuntu-26.04:UBTU-24-300009]
  files/library-directory-group:
    title: A shared library directory is not in group root
    fact: files.libraries.*.gid
    when: {files.libraries.*.kind: directory}
    expect: {const: 0}
    severity: warning
    score: 5.0
    message: "{subject} belongs to gid {got}, not root, so the members of that group get the group’s access to a directory programs load their libraries from"
    rationale: members of that group can drop in a replacement library that programs, root’s included, then load
    fix: run “chgrp 0” on the directory
    remedy: {chgrp: 0}
    docs: https://man7.org/linux/man-pages/man8/ld.so.8.html
    tags: [files, stig-ubuntu-26.04:UBTU-24-300010]
  files/command-group:
    title: A system command belongs to a group of user accounts
    fact: files.commands.*.gid
    expect: {maximum: "${system-gid-max}"}
    severity: warning
    score: 6.0
    message: "{subject} belongs to gid {got}, above ${system-gid-max}, a group of user accounts, so those users get the group’s access to a command root and every user run"
    rationale: any member of that group can change a command that root and every user run, and so run their code as root
    fix: run “chgrp 0” on the file
    remedy: {chgrp: 0}
    docs: https://manpages.ubuntu.com/manpages/resolute/man1/chgrp.1.html
    tags: [files, stig-ubuntu-26.04:UBTU-24-300013]
  files/library-mode:
    title: A shared library is writable by its group or other users
    fact: files.libraries.*.mode
    when: {files.libraries.*.kind: file}
    expect: {pattern: "^[0-7][0-7][0145][0145]$"}
    severity: error
    score: 7.0
    message: "{subject} has mode {got}, beyond 0755, so someone other than its owner can change code every program loading it runs"
    rationale: whoever can write the library runs their own code inside every program that loads it, root’s programs included
    fix: run “chmod go-w” on the file
    remedy: {chmod: go-w}
    docs: https://man7.org/linux/man-pages/man8/ld.so.8.html
    tags: [files, stig-ubuntu-26.04:UBTU-24-300006, '!default']
  files/library-owner:
    title: A shared library or its directory is not owned by root
    fact: files.libraries.*.uid
    expect: {const: 0}
    severity: warning
    score: 5.5
    message: "{subject} is owned by uid {got}, not root, so that user can replace code programs load, root’s programs included"
    rationale: the owner of a library or its directory can swap in their own code, which every program loading it then runs
    fix: run “chown root” on it
    remedy: {chown: 0}
    docs: https://man7.org/linux/man-pages/man8/ld.so.8.html
    tags: [files, stig-ubuntu-26.04:UBTU-24-300007, stig-ubuntu-26.04:UBTU-24-300008, '!default']
  files/command-mode:
    title: A system command is writable by its group or other users
    fact: files.commands.*.mode
    expect: {pattern: "^[0-7][0-7][0145][0145]$"}
    severity: error
    score: 7.0
    message: "{subject} has mode {got}, beyond 0755, so someone other than its owner can change a command root and every user run"
    rationale: whoever can write a system command runs their own code as the next user to call it, root included
    fix: run “chmod go-w” on the file
    remedy: {chmod: go-w}
    docs: https://manpages.ubuntu.com/manpages/resolute/man1/chmod.1.html
    tags: [files, stig-ubuntu-26.04:UBTU-24-300011, '!default']
  files/command-owner:
    title: A system command is not owned by root
    fact: files.commands.*.uid
    expect: {const: 0}
    severity: warning
    score: 5.5
    message: "{subject} is owned by uid {got}, not root, so that user can change a command root and every user run"
    rationale: the owner of a system command can rewrite it and run their own code as the next user to call it, root included
    fix: run “chown root” on the file
    remedy: {chown: 0}
    docs: https://manpages.ubuntu.com/manpages/resolute/man1/chown.1.html
    tags: [files, stig-ubuntu-26.04:UBTU-24-300012, '!default']
  files/audit-config-owner:
    title: The audit configuration is not owned by root
    fact: files.audit-config.*.uid
    expect: {const: 0}
    severity: info
    score: 2.0
    message: "{subject} is owned by uid {got}, not root, so that user can change what is audited"
    rationale: the owner of the audit configuration can stop the recording of their own actions
    fix: run “chown root” on the file
    remedy: {chown: 0}
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/auditd.conf.5.html
    tags: [files, audit, stig-ubuntu-26.04:UBTU-24-900050, '!default']
  files/audit-tools-owner:
    title: An audit tool is not owned by root
    fact: files.audit-tools.*.uid
    when: {files.audit-tools.*.kind: file}
    expect: {const: 0}
    severity: info
    score: 3.0
    message: "{subject} is owned by uid {got}, not root, so that user can swap the tool that reads or changes the audit trail"
    rationale: the owner of an audit tool can replace it with one that hides their actions from the audit trail
    fix: run “chown root” on the file
    remedy: {chown: 0}
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/auditctl.8.html
    tags: [files, audit, stig-ubuntu-26.04:UBTU-24-901240, '!default']
