description: files that grant root, hold password hashes or host keys, or sit in the PATH, kept to root alone
tags: [default]
rules:
  files/world-writable:
    title: File writable by every user
    fact: files.*.*.world-writable
    expect: {const: false}
    severity: error
    score: 9.5
    message: "{subject} is writable by every user, who can then act as root through it"
    fix: chmod o-w the file
    remedy: {chmod: o-w}
    docs: https://man7.org/linux/man-pages/man7/inode.7.html
    references:
      - {title: Lynis FILE-7524, url: "https://cisofy.com/lynis/controls/FILE-7524/"}
      - {title: Lynis AUTH-9252, url: "https://cisofy.com/lynis/controls/AUTH-9252/"}
    tags: [files, lynis]
  files/group-writable:
    title: File writable by its group
    fact: files.*.*.group-writable
    expect: {const: false}
    severity: warning
    score: 6.0
    message: "{subject} is writable by its group, whose every member can then act as root through it"
    fix: chmod g-w the file, or check that only administrators are in its group
    docs: https://man7.org/linux/man-pages/man7/inode.7.html
    references:
      - {title: Lynis FILE-7524, url: "https://cisofy.com/lynis/controls/FILE-7524/"}
      - {title: Lynis AUTH-9252, url: "https://cisofy.com/lynis/controls/AUTH-9252/"}
    tags: [files, lynis]
  files/owner:
    title: File not owned by root
    fact: files.*.*.uid
    expect: {const: 0}
    severity: error
    score: 8.0
    message: "{subject} is owned by uid {got}, not root, so that user can change it"
    fix: chown root the file
    remedy: {chown: 0}
    docs: https://man7.org/linux/man-pages/man7/inode.7.html
    references:
      - {title: Lynis FILE-7524, url: "https://cisofy.com/lynis/controls/FILE-7524/"}
      - {title: Lynis AUTH-9252, url: "https://cisofy.com/lynis/controls/AUTH-9252/"}
    tags: [files, lynis]
  files/shadow-mode:
    title: Password hashes readable too widely
    fact: files.shadow.*.mode
    expect: {pattern: "^0[0246][04]0$"}
    severity: error
    score: 8.5
    message: "{subject} has mode {got}; password hashes need 0640 or stricter, readable by root and the shadow group alone"
    fix: chmod 0640 the file
    remedy: {chmod: "u-xs,g-wxs,o-rwxt"}
    docs: https://manpages.debian.org/unstable/passwd/shadow.5.en.html
    tags: [files]
  files/ssh-host-key-mode:
    title: SSH host key readable too widely
    fact: files.ssh-host-keys.*.mode
    expect: {pattern: "^0[0246][04]0$"}
    severity: error
    score: 8.5
    message: "{subject} has mode {got}; a private host key needs 0600, or 0640 for an ssh_keys group, or any user can impersonate this host"
    fix: chmod 0600 the key
    remedy: {chmod: "u-xs,g-wxs,o-rwxt"}
    docs: https://man.openbsd.org/sshd#FILES
    tags: [files, ssh]
  files/apt-auth-readable:
    title: APT repository credentials readable by every user
    fact: files.apt-auth.*.mode
    when: {files.apt-auth.*.kind: file}
    expect: {pattern: "^[0-7]{3}[0-3]$"}
    severity: error
    score: 7.5
    message: "{subject} has mode {got}, so every user reads the logins and passwords APT uses for private repositories and proxies"
    fix: chmod 0640 the file, or 0600
    remedy: {chmod: o-r}
    docs: https://manpages.debian.org/unstable/apt/apt_auth.conf.5.en.html
    tags: [files, apt, cis-ubuntu-26.04:1.2.1.6]
  files/accounts-mode:
    title: Account database more open than 0644
    fact: files.accounts.*.mode
    when: {files.accounts.*.kind: file}
    expect: {pattern: "^0[0246][04][04]$"}
    severity: info
    score: 1.0
    message: "{subject} has mode {got}; the benchmark asks 0644 or stricter, with no execute or special bit"
    fix: chmod 0644 the file
    remedy: {chmod: "u-xs,g-wxs,o-wxt"}
    docs: https://manpages.debian.org/unstable/manpages/passwd.5.en.html
    tags: [files, cis-ubuntu-26.04:7.1.1, cis-ubuntu-26.04:7.1.2, cis-ubuntu-26.04:7.1.3, cis-ubuntu-26.04:7.1.4, cis-ubuntu-26.04:7.1.9, '!default']
  files/bootloader-readable:
    title: Bootloader configuration readable by other users
    fact: files.boot.*.mode
    when: {files.boot.*.kind: file}
    expect: {pattern: "^0[0-7]00$"}
    severity: info
    score: 2.0
    message: "{subject} has mode {got}; the benchmark asks 0600, so a GRUB password hash in it reaches no other user"
    fix: chmod 0600 the file, and keep it so across update-grub with a password set in /etc/grub.d
    remedy: {chmod: "g-rwxs,o-rwxt"}
    docs: https://www.gnu.org/software/grub/manual/grub/html_node/Authentication-and-authorisation.html
    tags: [files, boot, cis-ubuntu-26.04:1.4.2, '!default']
  files/audit-config-mode:
    title: Audit configuration readable by other users
    fact: files.audit-config.*.mode
    when: {files.audit-config.*.kind: file}
    expect: {pattern: "^0[0246][04]0$"}
    severity: info
    score: 2.0
    message: "{subject} has mode {got}; the benchmark asks 0640 or stricter, so other users cannot read what is watched and plan around it"
    fix: chmod 0640 the file
    remedy: {chmod: "u-xs,g-wxs,o-rwxt"}
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/auditd.conf.5.html
    tags: [files, audit, cis-ubuntu-26.04:6.2.4.5, '!default']
