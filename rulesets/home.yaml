description: each user’s home directory, kept from other users
topic: Files and permissions
tags: [default]
when: {os.init: {not: {minProperties: 1, additionalProperties: {not: {contains: {enum: [systemd, init, openrc-init, runit]}}}}}}
vars:
  uid-min: {default: 1000, minimum: 1, maximum: 4294967294}
  uid-max: {default: 60000, minimum: 1, maximum: 4294967294}
rules:
  home/open-to-others:
    title: A home directory is open to other users
    fact: home.directories.*.mode
    when:
      home.directories.*.exists: true
      home.directories.*.kind: directory
      home.directories.*.uid: {minimum: "${uid-min}", maximum: "${uid-max}"}
    expect: {pattern: "^[0-7]{3}0$"}
    severity: warning
    score: 4.0
    message: "{subject} has mode {got}, so every user can list it and read whatever its owner leaves readable there"
    rationale: any local user can browse another user’s home and read the files left readable in it, such as notes and configuration
    fix:
      - 'Take access away from other users:'
      - run: chmod o-rwx {subject}
      - 'Then set this line in “/etc/login.defs” for new accounts:'
      - lines: ["HOME_MODE 0750"]
    remedy: {chmod: o-rwx}
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/login.defs.5.html
    references:
      - {title: Lynis HOME-9304, url: "https://cisofy.com/lynis/controls/HOME-9304/"}
    tags: [files, lynis]
  home/not-owned:
    title: A home directory is not owned by its account
    fact: accounts.passwd.*.uid
    same: home.directories.{accounts.passwd.*.home}.uid
    when:
      accounts.passwd.*.uid: {minimum: "${uid-min}", maximum: "${uid-max}"}
      home.directories.{accounts.passwd.*.home}.exists: true
      home.directories.{accounts.passwd.*.home}.kind: directory
    severity: warning
    score: 5.0
    message: "{subject}’s home is owned by uid {same}, not by its own uid {got}, so that owner can read, change or replace its files and shell startup scripts"
    rationale: the actual owner of the directory can read the account’s files and plant startup scripts that run as the account’s user
    fix: give the home to {subject} with “chown”, or point the account at a home of its own with “usermod --home”
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/usermod.8.html
    references:
      - {title: Lynis HOME-9306, url: "https://cisofy.com/lynis/controls/HOME-9306/"}
    tags: [files, lynis]
  home/dot-file-mode:
    title: A dot file in a home is more open than 0644
    fact: home.dots.*.mode
    keys: {not: {pattern: "/\\.bash_history$"}}
    when: {home.dots.*.kind: file}
    expect: {pattern: "^0[0246][04][04]$"}
    severity: info
    score: 1.0
    message: "{subject} has mode {got}; the benchmark asks 0644 or stricter, so no other user changes what its owner’s shell or tools run"
    rationale: another user can edit the shell and tool settings in this file, so they run commands as its owner at the next login
    fix: run “chmod 0644” on the file, or “chmod 0600” if it holds anything private
    remedy: {chmod: "u-xs,g-wxs,o-wxt"}
    docs: https://manpages.ubuntu.com/manpages/resolute/man1/bash.1.html#files
    tags: [files, cis-ubuntu-26.04:7.2.10, cis-controls-v8:3.3, hipaa:164.308(a)(3)(i), hipaa:164.308(a)(3)(ii)(A), hipaa:164.312(a)(1), iso-27001-2022:A5.10, iso-27001-2022:A5.15, iso-27001-2022:A8.3, iso-27001-2022:A8.4, nist-800-171-r2:3.1.1, nist-800-171-r2:3.1.2, nist-800-171-r2:3.8.2, nist-800-171-r3:03.01.01, nist-800-171-r3:03.01.02, nist-800-171-r3:03.01.03, nist-800-171-r3:3.8.2, nist-800-53:AC-3, nist-800-53:AC-5, nist-800-53:AC-6, nist-800-53:CA-3(6), nist-800-53:MP-2, pci-dss-4:1.3.1, pci-dss-4:7.1, '!default']
  home/history-mode:
    title: A shell history is readable by other users
    fact: home.dots.*.mode
    keys: {pattern: "/\\.bash_history$"}
    when: {home.dots.*.kind: file}
    expect: {pattern: "^0[0246]00$"}
    severity: warning
    score: 3.5
    message: "{subject} has mode {got}, beyond 0600, so other users read the commands its owner typed, and any password typed into one"
    rationale: any other user can read the commands the owner typed, including passwords typed on a command line by mistake
    fix: run “chmod 0600” on the file
    remedy: {chmod: "u-xs,g-rwxs,o-rwxt"}
    docs: https://manpages.ubuntu.com/manpages/resolute/man1/bash.1.html#files
    tags: [files, cis-ubuntu-26.04:7.2.10, cis-controls-v8:3.3, hipaa:164.308(a)(3)(i), hipaa:164.308(a)(3)(ii)(A), hipaa:164.312(a)(1), iso-27001-2022:A5.10, iso-27001-2022:A5.15, iso-27001-2022:A8.3, iso-27001-2022:A8.4, nist-800-171-r2:3.1.1, nist-800-171-r2:3.1.2, nist-800-171-r2:3.8.2, nist-800-171-r3:03.01.01, nist-800-171-r3:03.01.02, nist-800-171-r3:03.01.03, nist-800-171-r3:3.8.2, nist-800-53:AC-3, nist-800-53:AC-5, nist-800-53:AC-6, nist-800-53:CA-3(6), nist-800-53:MP-2, pci-dss-4:1.3.1, pci-dss-4:7.1]
  home/forward:
    title: A user forwards their mail with ~/.forward
    fact: home.dots.*.kind
    keys: {pattern: "/\\.forward$"}
    expect: {not: {}}
    severity: info
    score: 1.0
    message: "{subject} exists, so the local mail of its owner leaves the host, or is piped into a command the mail system runs"
    rationale: a user’s mail can be quietly redirected to an outside address or into a program, which hides mail or runs commands on delivery
    fix:
      - Remove {subject}.
      - Set the forward in “/etc/aliases” if the site wants one.
    docs: https://www.postfix.org/local.8.html
    tags: [files, cis-ubuntu-26.04:7.2.10, cis-controls-v8:3.3, hipaa:164.308(a)(3)(i), hipaa:164.308(a)(3)(ii)(A), hipaa:164.312(a)(1), iso-27001-2022:A5.10, iso-27001-2022:A5.15, iso-27001-2022:A8.3, iso-27001-2022:A8.4, nist-800-171-r2:3.1.1, nist-800-171-r2:3.1.2, nist-800-171-r2:3.8.2, nist-800-171-r3:03.01.01, nist-800-171-r3:03.01.02, nist-800-171-r3:03.01.03, nist-800-171-r3:3.8.2, nist-800-53:AC-3, nist-800-53:AC-5, nist-800-53:AC-6, nist-800-53:CA-3(6), nist-800-53:MP-2, pci-dss-4:1.3.1, pci-dss-4:7.1, '!default']
  home/dot-directory-mode:
    title: A dot directory in a home is more open than 0750
    fact: home.dots.*.mode
    keys: {not: {pattern: "/\\.ssh$"}}
    when: {home.dots.*.kind: directory}
    expect: {pattern: "^0[0-7][0145]0$"}
    severity: info
    score: 1.0
    message: "{subject} has mode {got}; the benchmark asks 0750 or stricter, so no other user reads its owner’s configuration, keys or cached sessions"
    rationale: other users can read the owner’s configuration, keys and cached sessions and then act as them
    fix: run “chmod 0750” on the directory, or “chmod 0700”
    remedy: {chmod: "g-w,o-rwx"}
    docs: https://specifications.freedesktop.org/basedir-spec/latest/
    tags: [files, cis-ubuntu-26.04:7.2.11, cis-controls-v8:3.3, hipaa:164.308(a)(3)(i), hipaa:164.308(a)(3)(ii)(A), hipaa:164.312(a)(1), iso-27001-2022:A5.10, iso-27001-2022:A5.15, iso-27001-2022:A8.3, iso-27001-2022:A8.4, nist-800-171-r2:3.1.1, nist-800-171-r2:3.1.2, nist-800-171-r2:3.8.2, nist-800-171-r3:03.01.01, nist-800-171-r3:03.01.02, nist-800-171-r3:03.01.03, nist-800-171-r3:3.8.2, nist-800-53:AC-3, nist-800-53:AC-5, nist-800-53:AC-6, nist-800-53:CA-3(6), nist-800-53:MP-2, pci-dss-4:1.3.1, pci-dss-4:7.1, '!default']
  home/ssh-directory-mode:
    title: "~/.ssh is more open than 0700"
    fact: home.dots.*.mode
    keys: {pattern: "/\\.ssh$"}
    when: {home.dots.*.kind: directory}
    expect: {pattern: "^0[0-7]00$"}
    severity: info
    score: 2.0
    message: "{subject} has mode {got}; the benchmark asks 0700, so neither the owner’s group nor other users reach its keys"
    rationale: another user can read or replace the owner’s SSH keys and authorized keys, then log in as them
    fix: run “chmod 0700” on the directory
    remedy: {chmod: "g-rwx,o-rwx"}
    docs: https://man.openbsd.org/ssh#FILES
    tags: [files, ssh, cis-ubuntu-26.04:7.2.11, cis-controls-v8:3.3, hipaa:164.308(a)(3)(i), hipaa:164.308(a)(3)(ii)(A), hipaa:164.312(a)(1), iso-27001-2022:A5.10, iso-27001-2022:A5.15, iso-27001-2022:A8.3, iso-27001-2022:A8.4, nist-800-171-r2:3.1.1, nist-800-171-r2:3.1.2, nist-800-171-r2:3.8.2, nist-800-171-r3:03.01.01, nist-800-171-r3:03.01.02, nist-800-171-r3:03.01.03, nist-800-171-r3:3.8.2, nist-800-53:AC-3, nist-800-53:AC-5, nist-800-53:AC-6, nist-800-53:CA-3(6), nist-800-53:MP-2, pci-dss-4:1.3.1, pci-dss-4:7.1]
