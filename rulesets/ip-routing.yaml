description: Interfaces that let a remote sender choose how this host routes its traffic
topic: Network
tags: [default]
rules:
  ip-routing/ipv4-redirects:
    title: IPv4 ICMP redirects are accepted
    fact: sysctl.settings.net.ipv4.conf.*.accept_redirects
    keys: {not: {const: lo}}
    when: {sysctl.settings.net.ipv4.conf.*.forwarding: 0}
    expect: {const: 0}
    severity: warning
    score: 5.0
    message: "{subject} accepts IPv4 ICMP redirects (accept_redirects {got}), so anyone on the link can reroute this host’s traffic through themselves"
    rationale: a neighbour on the same network can send a forged message that routes this host’s traffic through their machine
    remedy: {drop-in: {into: sysctl, name: ip-routing-ipv4-redirects, lines: ["net.ipv4.conf.all.accept_redirects = 0", "net.ipv4.conf.default.accept_redirects = 0", "net.ipv4.conf.{subject}.accept_redirects = 0"]}}
    docs: https://docs.kernel.org/networking/ip-sysctl.html
    references:
      - {title: Lynis KRNL-6000, url: "https://cisofy.com/lynis/controls/KRNL-6000/"}
    tags: [ip-routing, sysctl, lynis]
  ip-routing/ipv6-redirects:
    title: IPv6 ICMP redirects are accepted
    fact: sysctl.settings.net.ipv6.conf.*.accept_redirects
    keys: {not: {enum: [all, lo]}}
    when: {sysctl.settings.net.ipv6.conf.*.forwarding: 0}
    expect: {const: 0}
    severity: warning
    score: 5.0
    message: "{subject} accepts IPv6 ICMP redirects (accept_redirects {got}), so anyone on the link can reroute this host’s traffic through themselves"
    rationale: a neighbour on the same network can send a forged message that routes this host’s traffic through their machine
    remedy: {drop-in: {into: sysctl, name: ip-routing-ipv6-redirects, lines: ["net.ipv6.conf.default.accept_redirects = 0", "net.ipv6.conf.{subject}.accept_redirects = 0"]}}
    docs: https://docs.kernel.org/networking/ip-sysctl.html
    references:
      - {title: Lynis KRNL-6000, url: "https://cisofy.com/lynis/controls/KRNL-6000/"}
    tags: [ip-routing, sysctl, lynis]
  ip-routing/ipv4-source-route:
    title: IPv4 source-routed packets are accepted
    keys: {not: {const: all}}
    facts:
      any:
        - {fact: sysctl.settings.net.ipv4.conf.*.accept_source_route, expect: {const: 0}}
        - {fact: sysctl.settings.net.ipv4.conf.all.accept_source_route, expect: {const: 0}}
    severity: warning
    score: 5.5
    message: "{subject} and all both set accept_source_route, so a sender can dictate the path replies take and slip past filters that trust the source address"
    rationale: a sender can choose the path of a packet and bypass firewalls that trust where it appears to come from
    fix: set “net.ipv4.conf.all.accept_source_route = 0”
    docs: https://docs.kernel.org/networking/ip-sysctl.html
    references:
      - {title: Lynis KRNL-6000, url: "https://cisofy.com/lynis/controls/KRNL-6000/"}
    tags: [ip-routing, sysctl, lynis]
  ip-routing/ipv4-secure-redirects:
    title: IPv4 redirects from listed gateways are accepted
    fact: sysctl.settings.net.ipv4.conf.*.secure_redirects
    keys: {enum: [all, default]}
    expect: {const: 0}
    severity: info
    score: 2.5
    message: "net.ipv4.conf.{subject}.secure_redirects is {got}, so a redirect is accepted from any packet claiming a listed gateway’s address, which a spoofed source satisfies; ip-routing/ipv4-redirects judges the wider setting"
    rationale: an attacker who spoofs a gateway’s address can still redirect this host’s traffic to their machine
    remedy: {drop-in: {into: sysctl, name: ip-routing-ipv4-secure-redirects, lines: ["net.ipv4.conf.all.secure_redirects = 0", "net.ipv4.conf.default.secure_redirects = 0"]}}
    docs: https://docs.kernel.org/networking/ip-sysctl.html
    tags: [ip-routing, sysctl, cis-ubuntu-26.04:3.3.1.10, cis-ubuntu-26.04:3.3.1.11, dev-sec-linux-baseline:sysctl-15]
  ip-routing/route-localnet:
    title: Loopback addresses are routed from the network
    fact: sysctl.settings.net.ipv4.conf.*.route_localnet
    keys: {not: {const: lo}}
    expect: {const: 0}
    severity: warning
    score: 5.5
    message: "{subject} sets route_localnet {got}, so a packet from the link addressed to 127.0.0.1 is delivered, and services bound to loopback only answer anyone next to this host"
    rationale: a machine on the network can reach services meant to be open only to this host, such as a database bound to 127.0.0.1
    remedy: {drop-in: {into: sysctl, name: ip-routing-route-localnet, lines: ["net.ipv4.conf.all.route_localnet = 0", "net.ipv4.conf.default.route_localnet = 0", "net.ipv4.conf.{subject}.route_localnet = 0"]}}
    docs: https://docs.kernel.org/networking/ip-sysctl.html
    tags: [ip-routing, sysctl, cis-ubuntu-26.04:3.3.1.19]
  ip-routing/ipv4-ip-forward:
    title: IPv4 forwarding is on
    fact: sysctl.settings.net.ipv4.ip_forward
    expect: {const: 0}
    severity: info
    score: 3.0
    message: "net.ipv4.ip_forward is {got}, so this host routes IPv4 packets between its interfaces"
    rationale: a compromised or misconfigured host becomes a bridge that passes an attacker from one network to another
    fix: set “net.ipv4.ip_forward = 0”, unless this host is a router or runs containers that need it
    docs: https://docs.kernel.org/networking/ip-sysctl.html
    tags: [ip-routing, sysctl, cis-ubuntu-26.04:3.3.1.1, dev-sec-linux-baseline:sysctl-01, '!default']
  ip-routing/ipv4-forwarding:
    title: IPv4 forwarding is on
    fact: sysctl.settings.net.ipv4.conf.*.forwarding
    keys: {enum: [all, default]}
    expect: {const: 0}
    severity: info
    score: 3.0
    message: "net.ipv4.conf.{subject}.forwarding is {got}, so this host routes IPv4 packets between its interfaces"
    rationale: a compromised or misconfigured host becomes a bridge that passes an attacker from one network to another
    fix: set “net.ipv4.conf.all.forwarding = 0” and “net.ipv4.conf.default.forwarding = 0”, unless this host is a router or runs containers that need it
    docs: https://docs.kernel.org/networking/ip-sysctl.html
    tags: [ip-routing, sysctl, cis-ubuntu-26.04:3.3.1.2, cis-ubuntu-26.04:3.3.1.3, dev-sec-linux-baseline:sysctl-01, '!default']
  ip-routing/ipv6-forwarding:
    title: IPv6 forwarding is on
    fact: sysctl.settings.net.ipv6.conf.*.forwarding
    keys: {enum: [all, default]}
    expect: {const: 0}
    severity: info
    score: 3.0
    message: "net.ipv6.conf.{subject}.forwarding is {got}, so this host routes IPv6 packets between its interfaces"
    rationale: a compromised or misconfigured host becomes a bridge that passes an attacker from one network to another
    fix: set “net.ipv6.conf.all.forwarding = 0” and “net.ipv6.conf.default.forwarding = 0”, unless this host is a router or runs containers that need it
    docs: https://docs.kernel.org/networking/ip-sysctl.html
    tags: [ip-routing, sysctl, cis-ubuntu-26.04:3.3.2.1, cis-ubuntu-26.04:3.3.2.2, dev-sec-linux-baseline:sysctl-19, '!default']
  ip-routing/ipv4-send-redirects:
    title: IPv4 redirects are sent
    fact: sysctl.settings.net.ipv4.conf.*.send_redirects
    keys: {enum: [all, default]}
    expect: {const: 0}
    severity: info
    score: 2.5
    message: "net.ipv4.conf.{subject}.send_redirects is {got}, so this host tells its neighbours to reroute traffic, which only a router should"
    rationale: a host that is not a router can be made to steer its neighbours’ traffic along paths an attacker picks
    remedy: {drop-in: {into: sysctl, name: ip-routing-ipv4-send-redirects, lines: ["net.ipv4.conf.all.send_redirects = 0", "net.ipv4.conf.default.send_redirects = 0"]}}
    docs: https://docs.kernel.org/networking/ip-sysctl.html
    tags: [ip-routing, sysctl, cis-ubuntu-26.04:3.3.1.4, cis-ubuntu-26.04:3.3.1.5, dev-sec-linux-baseline:sysctl-16]
  ip-routing/ipv4-rp-filter-strict:
    title: The IPv4 reverse path filter is not strict
    fact: sysctl.settings.net.ipv4.conf.*.rp_filter
    keys: {enum: [all, default]}
    expect: {const: 1}
    severity: info
    score: 3.0
    message: "net.ipv4.conf.{subject}.rp_filter is {got}, not the strict 1 the benchmark asks; systemd ships the loose 2, which a host with several uplinks needs"
    rationale: packets with forged source addresses are accepted and can be used to spoof trusted machines or aim floods at a victim
    fix: set “net.ipv4.conf.all.rp_filter = 1” and “net.ipv4.conf.default.rp_filter = 1”, unless replies may arrive on another interface than the request left
    docs: https://docs.kernel.org/networking/ip-sysctl.html
    tags: [ip-routing, sysctl, cis-ubuntu-26.04:3.3.1.12, cis-ubuntu-26.04:3.3.1.13, dev-sec-linux-baseline:sysctl-02, '!default']
  ip-routing/ipv4-log-martians:
    title: Martian IPv4 packets are not logged
    fact: sysctl.settings.net.ipv4.conf.*.log_martians
    keys: {enum: [all, default]}
    expect: {const: 1}
    severity: info
    score: 1.0
    message: "net.ipv4.conf.{subject}.log_martians is {got}, so packets with impossible source addresses arrive unlogged"
    rationale: spoofed or misrouted packets arrive silently, so an attack or a broken route leaves no trace
    remedy: {drop-in: {into: sysctl, name: ip-routing-ipv4-log-martians, lines: ["net.ipv4.conf.all.log_martians = 1", "net.ipv4.conf.default.log_martians = 1"]}}
    docs: https://docs.kernel.org/networking/ip-sysctl.html
    tags: [ip-routing, sysctl, cis-ubuntu-26.04:3.3.1.16, cis-ubuntu-26.04:3.3.1.17, dev-sec-linux-baseline:sysctl-17]
  ip-routing/ipv6-source-route:
    title: IPv6 source routing is accepted
    fact: sysctl.settings.net.ipv6.conf.*.accept_source_route
    keys: {enum: [all, default]}
    expect: {const: 0}
    severity: warning
    score: 5.5
    message: "net.ipv6.conf.{subject}.accept_source_route is {got}, so a sender may choose the path its IPv6 packets take through this host"
    rationale: a sender can choose the path of a packet and bypass firewalls that trust where it appears to come from
    remedy: {drop-in: {into: sysctl, name: ip-routing-ipv6-source-route, lines: ["net.ipv6.conf.all.accept_source_route = 0", "net.ipv6.conf.default.accept_source_route = 0"]}}
    docs: https://docs.kernel.org/networking/ip-sysctl.html
    tags: [ip-routing, sysctl, cis-ubuntu-26.04:3.3.2.5, cis-ubuntu-26.04:3.3.2.6, dev-sec-linux-baseline:sysctl-13]
  ip-routing/ipv6-accept-ra:
    title: IPv6 router advertisements are accepted
    fact: sysctl.settings.net.ipv6.conf.*.accept_ra
    keys: {enum: [all, default]}
    expect: {const: 0}
    severity: warning
    score: 4.5
    message: "net.ipv6.conf.{subject}.accept_ra is {got}, so any host on the link may announce itself as the IPv6 router; a host that takes its address from SLAAC needs it"
    rationale: anyone on the network can announce themselves as the router and carry all of this host’s traffic
    fix: set “net.ipv6.conf.all.accept_ra = 0” and “net.ipv6.conf.default.accept_ra = 0”, unless this host configures IPv6 from router advertisements
    docs: https://docs.kernel.org/networking/ip-sysctl.html
    tags: [ip-routing, sysctl, cis-ubuntu-26.04:3.3.2.7, cis-ubuntu-26.04:3.3.2.8, dev-sec-linux-baseline:sysctl-25, '!default']
  ip-routing/arp-ignore:
    title: ARP is answered for addresses of other interfaces
    fact: sysctl.settings.net.ipv4.conf.*.arp_ignore
    keys: {enum: [all]}
    expect: {enum: [1, 2]}
    severity: info
    score: 2.0
    message: "net.ipv4.conf.all.arp_ignore is {got}, so this host answers ARP for an address on any of its interfaces"
    rationale: a host can be tricked into answering for addresses it should not, which helps an attacker map or impersonate it
    fix: set “net.ipv4.conf.all.arp_ignore = 1”
    docs: https://docs.kernel.org/networking/ip-sysctl.html
    tags: [ip-routing, sysctl, dev-sec-linux-baseline:sysctl-08, '!default']
  ip-routing/arp-announce:
    title: ARP requests carry any local address
    fact: sysctl.settings.net.ipv4.conf.*.arp_announce
    keys: {enum: [all]}
    expect: {const: 2}
    severity: info
    score: 2.0
    message: "net.ipv4.conf.all.arp_announce is {got}, so ARP requests may name a source address from another interface"
    rationale: a host leaks addresses from its other networks into requests on the wrong network, revealing its layout
    fix: set “net.ipv4.conf.all.arp_announce = 2”
    docs: https://docs.kernel.org/networking/ip-sysctl.html
    tags: [ip-routing, sysctl, dev-sec-linux-baseline:sysctl-09, '!default']
  ip-routing/shared-media:
    title: Redirects for gateways on other subnets are refused
    fact: sysctl.settings.net.ipv4.conf.*.shared_media
    keys: {enum: [all, default]}
    expect: {const: 1}
    severity: info
    score: 2.0
    message: "net.ipv4.conf.{subject}.shared_media is {got}, not the kernel’s default 1 dev-sec asks"
    rationale: a host accepts redirects to gateways it cannot reach directly, which a forged message can use to misroute traffic
    fix: set “net.ipv4.conf.all.shared_media = 1” and “net.ipv4.conf.default.shared_media = 1”
    docs: https://docs.kernel.org/networking/ip-sysctl.html
    tags: [ip-routing, sysctl, dev-sec-linux-baseline:sysctl-12, '!default']
  ip-routing/ipv6-router-solicitations:
    title: IPv6 router solicitations are sent
    fact: sysctl.settings.net.ipv6.conf.*.router_solicitations
    keys: {enum: [all, default]}
    expect: {const: 0}
    severity: info
    score: 1.0
    message: "net.ipv6.conf.{subject}.router_solicitations is {got}, so this host asks the link for an IPv6 router; a host configured by SLAAC needs it"
    rationale: the host asks the network for a router and trusts whoever answers first, including an attacker
    fix: set “net.ipv6.conf.all.router_solicitations = 0” and “net.ipv6.conf.default.router_solicitations = 0”, unless this host configures IPv6 from router advertisements
    docs: https://docs.kernel.org/networking/ip-sysctl.html
    tags: [ip-routing, sysctl, dev-sec-linux-baseline:sysctl-21, '!default']
  ip-routing/ipv6-ra-router-preference:
    title: IPv6 router preference is taken from advertisements
    fact: sysctl.settings.net.ipv6.conf.*.accept_ra_rtr_pref
    keys: {enum: [default]}
    expect: {const: 0}
    severity: info
    score: 3.0
    message: "net.ipv6.conf.default.accept_ra_rtr_pref is {got}, so a router advertisement may rank itself above the real router"
    rationale: an attacker’s advertisement can claim high priority and take over from the real router
    fix: set “net.ipv6.conf.default.accept_ra_rtr_pref = 0”, unless this host configures IPv6 from router advertisements
    docs: https://docs.kernel.org/networking/ip-sysctl.html
    tags: [ip-routing, sysctl, dev-sec-linux-baseline:sysctl-22, '!default']
  ip-routing/ipv6-ra-prefix-info:
    title: IPv6 prefixes are taken from advertisements
    fact: sysctl.settings.net.ipv6.conf.*.accept_ra_pinfo
    keys: {enum: [default]}
    expect: {const: 0}
    severity: warning
    score: 3.5
    message: "net.ipv6.conf.default.accept_ra_pinfo is {got}, so a router advertisement may hand this host an address prefix"
    rationale: an attacker’s advertisement can give the host an address range that sends its traffic through the attacker
    fix: set “net.ipv6.conf.default.accept_ra_pinfo = 0”, unless this host configures IPv6 from router advertisements
    docs: https://docs.kernel.org/networking/ip-sysctl.html
    tags: [ip-routing, sysctl, dev-sec-linux-baseline:sysctl-23, '!default']
  ip-routing/ipv6-ra-default-router:
    title: The IPv6 default router is taken from advertisements
    fact: sysctl.settings.net.ipv6.conf.*.accept_ra_defrtr
    keys: {enum: [default]}
    expect: {const: 0}
    severity: warning
    score: 4.0
    message: "net.ipv6.conf.default.accept_ra_defrtr is {got}, so a router advertisement may become this host’s default route"
    rationale: an attacker’s advertisement can make their machine the path for all of this host’s outgoing traffic
    fix: set “net.ipv6.conf.default.accept_ra_defrtr = 0”, unless this host configures IPv6 from router advertisements
    docs: https://docs.kernel.org/networking/ip-sysctl.html
    tags: [ip-routing, sysctl, dev-sec-linux-baseline:sysctl-24, '!default']
  ip-routing/ipv6-autoconf:
    title: IPv6 addresses are configured from advertisements
    fact: sysctl.settings.net.ipv6.conf.*.autoconf
    keys: {enum: [all, default]}
    expect: {const: 0}
    severity: info
    score: 3.0
    message: "net.ipv6.conf.{subject}.autoconf is {got}, so this host takes an IPv6 address from any router advertisement; a host configured by SLAAC needs it"
    rationale: an attacker’s advertisement can give the host an address of the attacker’s choosing
    fix: set “net.ipv6.conf.all.autoconf = 0” and “net.ipv6.conf.default.autoconf = 0”, unless this host configures IPv6 from router advertisements
    docs: https://docs.kernel.org/networking/ip-sysctl.html
    tags: [ip-routing, sysctl, dev-sec-linux-baseline:sysctl-26, '!default']
  ip-routing/ipv6-max-addresses:
    title: An interface takes more than one IPv6 address
    fact: sysctl.settings.net.ipv6.conf.*.max_addresses
    keys: {enum: [default]}
    expect: {const: 1}
    severity: info
    score: 1.0
    message: "net.ipv6.conf.default.max_addresses is {got}; dev-sec asks 1, which leaves no room for RFC 8981 temporary addresses beside the stable one"
    rationale: a flood of advertisements can pile addresses onto the interface and exhaust memory
    fix: set “net.ipv6.conf.default.max_addresses = 1”, unless this host uses temporary addresses
    docs: https://docs.kernel.org/networking/ip-sysctl.html
    tags: [ip-routing, sysctl, dev-sec-linux-baseline:sysctl-28, '!default']
