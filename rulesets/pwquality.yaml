description: pam_pwquality settings that let a short, guessable or unchecked new password through
tags: [default]
when: {"/auth/pam/~1etc~1pam.d~1common-password": {contains: &called {required: [type, module], properties: {type: {pattern: "(?i)^-?password$"}, module: {pattern: "(^|/)pam_pwquality\\.so$"}}}}}
vars:
  pwquality-minlen: {default: 14}
  pwquality-single-factor-minlen: {default: 15}
  pwquality-difok: {default: 2}
  pwquality-stig-difok: {default: 8}
  pwquality-maxrepeat: {default: 3}
  pwquality-maxsequence: {default: 3}
rules:
  pwquality/minlen:
    title: New passwords may be shorter than the benchmark’s minimum
    fact: auth.pwquality
    when: {"/auth/pam/~1etc~1pam.d~1common-password": {not: {contains: {allOf: [*called, {required: [arguments], properties: {arguments: {contains: {pattern: "^minlen="}}}}]}}}}
    expect: {required: [minlen], properties: {minlen: {type: integer, minimum: "${pwquality-minlen}"}}}
    severity: info
    score: 2.0
    message: "pwquality.conf leaves minlen unset (8) or below ${pwquality-minlen}, so a new password that short is accepted"
    fix: set “minlen = ${pwquality-minlen}” in “/etc/security/pwquality.conf.d/50-pwlength.conf”
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/pwquality.conf.5.html
    references:
      - {title: Lynis AUTH-9262, url: "https://cisofy.com/lynis/controls/AUTH-9262/"}
    tags: [auth, pwquality, cis-ubuntu-26.04:5.3.3.2.2, lynis, '!default']
  pwquality/minlen-single-factor:
    title: New passwords may be shorter than 15 characters
    fact: auth.pwquality
    when: {"/auth/pam/~1etc~1pam.d~1common-password": {not: {contains: {allOf: [*called, {required: [arguments], properties: {arguments: {contains: {pattern: "^minlen="}}}}]}}}}
    expect: {required: [minlen], properties: {minlen: {type: integer, minimum: "${pwquality-single-factor-minlen}"}}}
    severity: warning
    score: 3.0
    message: "pwquality.conf leaves minlen unset (8) or below ${pwquality-single-factor-minlen}, so a password that alone guards a login may be short enough to guess offline from its hash"
    fix: set “minlen = ${pwquality-single-factor-minlen}” in “/etc/security/pwquality.conf.d/50-pwlength.conf”
    docs: https://pages.nist.gov/800-63-4/sp800-63b.html#passwordver
    references:
      - {title: NIST SP 800-63B-4 3.1.1.2, url: "https://pages.nist.gov/800-63-4/sp800-63b.html#passwordver"}
    tags: [auth, pwquality, nist-sp-800-63b-4:3.1.1.2, stig-ubuntu-26.04:UBTU-24-400320]
  pwquality/credit:
    title: Character classes count toward the minimum length
    fact: auth.pwquality
    when: {"/auth/pam/~1etc~1pam.d~1common-password": {not: {contains: {allOf: [*called, {required: [arguments], properties: {arguments: {contains: {pattern: "^[dulo]credit="}}}}]}}}}
    expect:
      properties:
        dcredit: &credit {not: {type: integer, exclusiveMinimum: 0}}
        ucredit: *credit
        lcredit: *credit
        ocredit: *credit
    severity: warning
    score: 3.0
    message: "pwquality.conf sets {field} to {got}, a positive credit, so each such character counts as an extra one and a password shorter than minlen is accepted"
    fix: set “{field} = 0” in “/etc/security/pwquality.conf”, or a negative value to require that class
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/pwquality.conf.5.html
    tags: [auth, pwquality, cis-ubuntu-26.04:5.3.3.2.3]
  pwquality/composition:
    title: New passwords must mix character classes
    fact: auth.pwquality
    when: {"/auth/pam/~1etc~1pam.d~1common-password": {not: {contains: {allOf: [*called, {required: [arguments], properties: {arguments: {contains: {pattern: "^([dulo]credit|minclass)="}}}}]}}}}
    expect:
      properties:
        dcredit: &composed {not: {type: integer, exclusiveMaximum: 0}}
        ucredit: *composed
        lcredit: *composed
        ocredit: *composed
        minclass: {not: {type: integer, exclusiveMinimum: 1}}
    severity: info
    score: 2.0
    message: "pwquality.conf sets {field} to {got}, a composition rule, which steers people to predictable patterns such as a capital first and a digit and a symbol last"
    fix: remove “{field}” from “/etc/security/pwquality.conf” and its “conf.d” files, and rely on “minlen” and “dictcheck”
    docs: https://pages.nist.gov/800-63-4/sp800-63b.html#passwordver
    references:
      - {title: NIST SP 800-63B-4 3.1.1.2, url: "https://pages.nist.gov/800-63-4/sp800-63b.html#passwordver"}
    tags: [auth, pwquality, nist-sp-800-63b-4:3.1.1.2]
    conflicts: [pwquality/stig-ucredit, pwquality/stig-lcredit, pwquality/stig-dcredit, pwquality/stig-ocredit]
  pwquality/stig-ucredit:
    title: New passwords need no uppercase letter
    fact: auth.pwquality
    when: {"/auth/pam/~1etc~1pam.d~1common-password": {not: {contains: {allOf: [*called, {required: [arguments], properties: {arguments: {contains: {pattern: "^ucredit="}}}}]}}}}
    expect: {required: [ucredit], properties: {ucredit: {type: integer, maximum: -1}}}
    severity: info
    score: 1.0
    message: "pwquality.conf leaves ucredit unset (0) or above -1, so a new password needs no uppercase letter"
    fix: set “ucredit = -1” in “/etc/security/pwquality.conf”
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/pwquality.conf.5.html
    tags: [auth, pwquality, stig-ubuntu-26.04:UBTU-24-400260, '!default']
    conflicts: [pwquality/composition]
  pwquality/stig-lcredit:
    title: New passwords need no lowercase letter
    fact: auth.pwquality
    when: {"/auth/pam/~1etc~1pam.d~1common-password": {not: {contains: {allOf: [*called, {required: [arguments], properties: {arguments: {contains: {pattern: "^lcredit="}}}}]}}}}
    expect: {required: [lcredit], properties: {lcredit: {type: integer, maximum: -1}}}
    severity: info
    score: 1.0
    message: "pwquality.conf leaves lcredit unset (0) or above -1, so a new password needs no lowercase letter"
    fix: set “lcredit = -1” in “/etc/security/pwquality.conf”
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/pwquality.conf.5.html
    tags: [auth, pwquality, stig-ubuntu-26.04:UBTU-24-400270, '!default']
    conflicts: [pwquality/composition]
  pwquality/stig-dcredit:
    title: New passwords need no digit
    fact: auth.pwquality
    when: {"/auth/pam/~1etc~1pam.d~1common-password": {not: {contains: {allOf: [*called, {required: [arguments], properties: {arguments: {contains: {pattern: "^dcredit="}}}}]}}}}
    expect: {required: [dcredit], properties: {dcredit: {type: integer, maximum: -1}}}
    severity: info
    score: 1.0
    message: "pwquality.conf leaves dcredit unset (0) or above -1, so a new password needs no digit"
    fix: set “dcredit = -1” in “/etc/security/pwquality.conf”
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/pwquality.conf.5.html
    tags: [auth, pwquality, stig-ubuntu-26.04:UBTU-24-400280, '!default']
    conflicts: [pwquality/composition]
  pwquality/stig-ocredit:
    title: New passwords need no special character
    fact: auth.pwquality
    when: {"/auth/pam/~1etc~1pam.d~1common-password": {not: {contains: {allOf: [*called, {required: [arguments], properties: {arguments: {contains: {pattern: "^ocredit="}}}}]}}}}
    expect: {required: [ocredit], properties: {ocredit: {type: integer, maximum: -1}}}
    severity: info
    score: 1.0
    message: "pwquality.conf leaves ocredit unset (0) or above -1, so a new password needs no special character"
    fix: set “ocredit = -1” in “/etc/security/pwquality.conf”
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/pwquality.conf.5.html
    tags: [auth, pwquality, stig-ubuntu-26.04:UBTU-24-400330, '!default']
    conflicts: [pwquality/composition]
  pwquality/difok:
    title: A new password may repeat most of the old one
    fact: auth.pwquality
    when: {"/auth/pam/~1etc~1pam.d~1common-password": {not: {contains: {allOf: [*called, {required: [arguments], properties: {arguments: {contains: {pattern: "^difok="}}}}]}}}}
    expect: {required: [difok], properties: {difok: {type: integer, minimum: "${pwquality-difok}"}}}
    severity: info
    score: 1.0
    message: "pwquality.conf leaves difok unset (1) or below ${pwquality-difok}, so a new password may differ from the old one in a single character"
    fix: set “difok = ${pwquality-difok}” in “/etc/security/pwquality.conf.d/50-pwdifok.conf”
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/pwquality.conf.5.html
    tags: [auth, pwquality, cis-ubuntu-26.04:5.3.3.2.1, '!default']
  pwquality/stig-difok:
    title: A new password may repeat most of the old one
    fact: auth.pwquality
    when: {"/auth/pam/~1etc~1pam.d~1common-password": {not: {contains: {allOf: [*called, {required: [arguments], properties: {arguments: {contains: {pattern: "^difok="}}}}]}}}}
    expect: {required: [difok], properties: {difok: {type: integer, minimum: "${pwquality-stig-difok}"}}}
    severity: info
    score: 1.0
    message: "pwquality.conf leaves difok unset (1) or below ${pwquality-stig-difok}, so a new password may keep most characters of the old one"
    fix: set “difok = ${pwquality-stig-difok}” in “/etc/security/pwquality.conf”
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/pwquality.conf.5.html
    tags: [auth, pwquality, stig-ubuntu-26.04:UBTU-24-400290, '!default']
  pwquality/maxrepeat:
    title: New passwords may repeat one character without limit
    fact: auth.pwquality
    when: {"/auth/pam/~1etc~1pam.d~1common-password": {not: {contains: {allOf: [*called, {required: [arguments], properties: {arguments: {contains: {pattern: "^maxrepeat="}}}}]}}}}
    expect: {required: [maxrepeat], properties: {maxrepeat: {type: integer, minimum: 1, maximum: "${pwquality-maxrepeat}"}}}
    severity: info
    score: 1.0
    message: "pwquality.conf leaves maxrepeat unset or outside 1 to ${pwquality-maxrepeat}, so a new password may run one character many times over"
    fix: set “maxrepeat = ${pwquality-maxrepeat}” in “/etc/security/pwquality.conf.d/50-pwrepeat.conf”
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/pwquality.conf.5.html
    tags: [auth, pwquality, cis-ubuntu-26.04:5.3.3.2.4, '!default']
  pwquality/maxsequence:
    title: New passwords may hold a long run of sequential characters
    fact: auth.pwquality
    when: {"/auth/pam/~1etc~1pam.d~1common-password": {not: {contains: {allOf: [*called, {required: [arguments], properties: {arguments: {contains: {pattern: "^maxsequence="}}}}]}}}}
    expect: {required: [maxsequence], properties: {maxsequence: {type: integer, minimum: 1, maximum: "${pwquality-maxsequence}"}}}
    severity: info
    score: 1.0
    message: "pwquality.conf leaves maxsequence unset or outside 1 to ${pwquality-maxsequence}, so a new password may hold a run such as 12345 or abcde"
    fix: set “maxsequence = ${pwquality-maxsequence}” in “/etc/security/pwquality.conf.d/50-pwmaxsequence.conf”
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/pwquality.conf.5.html
    tags: [auth, pwquality, cis-ubuntu-26.04:5.3.3.2.5, '!default']
  pwquality/dictcheck:
    title: New passwords are not checked against a dictionary
    fact: auth
    expect:
      anyOf:
        - {properties: {pam: {properties: {/etc/pam.d/common-password: {contains: {allOf: [*called, {required: [arguments], properties: {arguments: {contains: {pattern: "^dictcheck=0*[1-9]"}}}}]}}}}}}
        - allOf:
            - {properties: {pam: {properties: {/etc/pam.d/common-password: {not: {contains: {allOf: [*called, {required: [arguments], properties: {arguments: {contains: {pattern: "^dictcheck="}}}}]}}}}}}}
            - {properties: {pwquality: {properties: {dictcheck: &off {not: {anyOf: [{const: 0}, {type: string, pattern: "^0+$"}]}}}}}}
    severity: warning
    score: 4.0
    message: "pwquality.conf or the pam_pwquality line of /etc/pam.d/common-password sets dictcheck to 0, so a new password that is a dictionary word is accepted"
    fix: remove “dictcheck = 0” from “/etc/security/pwquality.conf” and its “conf.d” files, and “dictcheck=0” from the “pam_pwquality” line
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/pwquality.conf.5.html
    references:
      - {title: NIST SP 800-63B-4 3.1.1.2, url: "https://pages.nist.gov/800-63-4/sp800-63b.html#passwordver"}
    tags: [auth, pwquality, cis-ubuntu-26.04:5.3.3.2.6, nist-sp-800-63b-4:3.1.1.2, stig-ubuntu-26.04:UBTU-24-300014]
  pwquality/enforcing:
    title: pam_pwquality only warns about a weak password
    fact: auth
    expect:
      anyOf:
        - {properties: {pam: {properties: {/etc/pam.d/common-password: {contains: {allOf: [*called, {required: [arguments], properties: {arguments: {contains: {pattern: "^enforcing=0*[1-9]"}}}}]}}}}}}
        - allOf:
            - {properties: {pam: {properties: {/etc/pam.d/common-password: {not: {contains: {allOf: [*called, {required: [arguments], properties: {arguments: {contains: {pattern: "^enforcing="}}}}]}}}}}}}
            - {properties: {pwquality: {properties: {enforcing: *off}}}}
    severity: warning
    score: 4.0
    message: "pwquality.conf or the pam_pwquality line of /etc/pam.d/common-password sets enforcing to 0, so pam_pwquality prints its objection and accepts the weak password anyway"
    fix: remove “enforcing = 0” from “/etc/security/pwquality.conf” and its “conf.d” files, and “enforcing=0” from the “pam_pwquality” line
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/pwquality.conf.5.html
    tags: [auth, pwquality, cis-ubuntu-26.04:5.3.3.2.7]
  pwquality/root:
    title: root may set a password pam_pwquality rejects
    facts:
      any:
        - {fact: auth.pwquality, expect: {required: [enforce_for_root], properties: {enforce_for_root: {const: true}}}}
        - {fact: "/auth/pam/~1etc~1pam.d~1common-password", expect: {contains: {allOf: [*called, {required: [arguments], properties: {arguments: {contains: {const: enforce_for_root}}}}]}}}
    severity: info
    score: 2.0
    message: "neither pwquality.conf nor the pam_pwquality line sets enforce_for_root, so root changing a password is only warned about a weak one"
    fix: add “enforce_for_root” to “/etc/security/pwquality.conf.d/50-pwroot.conf”
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/pam_pwquality.8.html
    tags: [auth, pwquality, cis-ubuntu-26.04:5.3.3.2.8, '!default']
