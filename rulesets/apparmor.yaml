description: AppArmor missing from disk, not loaded or not started at boot, or a profile that only logs what it should deny
topic: Boot and kernel
tags: [default]
rules:
  apparmor/not-installed:
    title: AppArmor is not installed
    fact: apparmor.binary
    expect: {minProperties: 1}
    severity: info
    score: 3.0
    message: "no apparmor_parser program is in /usr/sbin, /sbin or /usr/local/sbin, so no AppArmor profile can be loaded"
    rationale: no program on the host can load confinement profiles, so a hijacked service keeps full access to everything its user can reach
    fix: install apparmor and apparmor-utils (“apt install apparmor apparmor-utils” on Ubuntu)
    docs: https://manpages.ubuntu.com/manpages/resolute/man7/apparmor.7.html
    tags: [mac, cis-ubuntu-26.04:1.3.1.1, stig-ubuntu-26.04:UBTU-24-100500]
  apparmor/no-profiles:
    title: AppArmor is installed but confines nothing
    fact: apparmor.profiles
    when: {apparmor.binary: {minProperties: 1}}
    expect: {minProperties: 1}
    severity: info
    score: 4.0
    message: "the kernel lists no loaded AppArmor profile, so AppArmor is off (apparmor=0, another LSM) or apparmor.service loaded nothing, and every program runs unconfined"
    rationale: a hijacked service keeps full access to everything its user can reach, because nothing limits what a program may touch
    fix:
      - Remove “apparmor=0” or “security=” from “GRUB_CMDLINE_LINUX” in “/etc/default/grub” and “/etc/default/grub.d/”.
      - 'Then run:'
      - run: update-grub
      - Then reboot.
      - 'After the reboot, enable and start the service:'
      - run: systemctl enable --now apparmor.service
    docs: https://manpages.ubuntu.com/manpages/resolute/man7/apparmor.7.html
    references:
      - {title: Lynis MACF-6208, url: "https://cisofy.com/lynis/controls/MACF-6208/"}
    tags: [mac, lynis, cis-ubuntu-26.04:1.3.1.2, stig-ubuntu-26.04:UBTU-24-100510]
  apparmor/service-off:
    title: AppArmor profiles are not loaded at boot
    fact: systemd.state
    when: {apparmor.binary: {minProperties: 1}}
    expect:
      required: [apparmor.service]
      properties:
        apparmor.service: {required: [enabled], properties: {enabled: {const: true}, active: {const: active}}}
    severity: info
    score: 3.0
    message: "apparmor.service is missing, not enabled or not active, so after the next boot the profiles in /etc/apparmor.d are not loaded"
    rationale: after the next reboot the host runs with no confinement, so a hijacked service can reach everything its user can
    fix:
      - 'Let the service start again:'
      - run: systemctl unmask apparmor.service
      - 'Then enable and start it:'
      - run: systemctl enable --now apparmor.service
    docs: https://manpages.ubuntu.com/manpages/resolute/man7/apparmor.7.html
    tags: [mac, cis-ubuntu-26.04:1.3.1.2, stig-ubuntu-26.04:UBTU-24-100510]
  apparmor/not-enforcing:
    title: An AppArmor profile is not enforced
    fact: apparmor.profiles.*.mode
    expect: {const: enforce}
    severity: info
    score: 2.0
    message: "{subject} is in {got} mode, so AppArmor lets the program do what the profile would deny"
    rationale: a hijacked program can still do the things its profile was written to forbid, because violations are only logged or not checked at all
    fix: once the profile allows what the program needs, run “aa-enforce” on it; a stub profile from “/etc/apparmor.d” needs its rules written first
    docs: https://manpages.ubuntu.com/manpages/resolute/man8/aa-enforce.8.html
    references:
      - {title: Lynis MACF-6290, url: "https://cisofy.com/lynis/controls/MACF-6290/"}
    tags: [mac, lynis, cis-ubuntu-26.04:1.3.1.3]
