description: host trust files an installed rsh or rlogin server honours
topic: Accounts and authentication
tags: [default]
when: {rhosts.readers: {minProperties: 1}}
rules:
  rhosts/hosts-equiv:
    title: /etc/hosts.equiv trusts other hosts
    fact: rhosts.system.*.size
    when: {rhosts.system.*.kind: file}
    expect: {maximum: 0}
    severity: error
    score: 8.0
    message: "{subject} names hosts, so the installed rsh or rlogin server lets their users in as the same local user with no password"
    fix:
      - Empty or remove “/etc/hosts.equiv”.
      - Remove the rsh server if nothing needs it.
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/hosts.equiv.5.html
    tags: [accounts, dev-sec-linux-baseline:os-01]
  rhosts/user-file:
    title: A ~/.rhosts trusts other hosts
    fact: rhosts.users.*.size
    when: {rhosts.users.*.kind: file}
    expect: {maximum: 0}
    severity: error
    score: 8.0
    message: "{subject} names hosts, so the installed rsh or rlogin server lets the users it lists log in as its owner with no password"
    fix:
      - Remove the file.
      - Remove the rsh server if nothing needs it.
    docs: https://manpages.ubuntu.com/manpages/resolute/man5/hosts.equiv.5.html
    tags: [accounts, dev-sec-linux-baseline:os-09]
