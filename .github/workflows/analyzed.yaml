        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: vars.CI_SKIP_ANALYZED != 'true' && vars.CI_SKIP_CARGO_MUTANTS != 'true'
        with:
          path: ${{ runner.temp }}/ci-cache/cargo-git
