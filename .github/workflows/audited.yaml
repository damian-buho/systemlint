          version: ${{ env.M6E_TAG }}
          run: auto-osv-scanner --offline-vulnerabilities
          env: |-
            OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY=/app/.cache/osv
            CI_IGNORE_VULNERABILITIES=${{ vars.CI_IGNORE_VULNERABILITIES }}
            M6E_SHARED_CACHE=N
          mounts: ${{ runner.temp }}/ci-cache/osv-db:/app/.cache/osv:rw
      - name: save osv-db
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: ((!cancelled()) && vars.CI_SKIP_SOURCE_IS_SECURE != 'true' && vars.CI_SKIP_OSV_SCANNER_SCAN_SOURCE != 'true') && steps.restore-osv-db.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ci-cache/osv-db
          key: ci-cache-osv-db-${{ steps.stamp-osv-db.outputs.stamp }}
      - name: stamp trivy-db
        id: stamp-trivy-db
        if: (!cancelled()) && vars.CI_SKIP_SOURCE_IS_SECURE != 'true' && vars.CI_SKIP_TRIVY_SCAN_SOURCE != 'true'
        run: echo "stamp=$(( $(date -u +%s) / 28800 ))" >> "$GITHUB_OUTPUT"
      - name: restore trivy-db
        id: restore-trivy-db
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: (!cancelled()) && vars.CI_SKIP_SOURCE_IS_SECURE != 'true' && vars.CI_SKIP_TRIVY_SCAN_SOURCE != 'true'
        with:
          path: ${{ runner.temp }}/ci-cache/trivy-db
          key: ci-cache-trivy-db-${{ steps.stamp-trivy-db.outputs.stamp }}
          restore-keys: |
            ci-cache-trivy-db-
      - name: trivy-scan-source
        if: (!cancelled()) && vars.CI_SKIP_SOURCE_IS_SECURE != 'true' && vars.CI_SKIP_TRIVY_SCAN_SOURCE != 'true'
        uses: projectfile-org/actions/run-tool@e66aa32ef07dc2e4a8e18dfdc92fa49e0f71baea # v1
        with:
          image: ${{ vars.D9T_GO_TOOLS_IMAGE || format('{0}/d9t/go-tools', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho') }}
          version: ${{ env.M6E_TAG }}
          run: auto-trivy fs
          env: |-
            CI_IGNORE_VULNERABILITIES=${{ vars.CI_IGNORE_VULNERABILITIES }}
            M6E_SHARED_CACHE=N
            TRIVY_CACHE_BACKEND
          mounts: ${{ runner.temp }}/ci-cache/trivy-db:/app/.cache/trivy:rw
      - name: save trivy-db
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: ((!cancelled()) && vars.CI_SKIP_SOURCE_IS_SECURE != 'true' && vars.CI_SKIP_TRIVY_SCAN_SOURCE != 'true') && steps.restore-trivy-db.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ci-cache/trivy-db
          key: ci-cache-trivy-db-${{ steps.stamp-trivy-db.outputs.stamp }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: reports-source-is-secure-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          overwrite: true
