[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://kiota.ch/damian-buho/systemlint"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
cel = { version = "=0.16.0", default-features = false, features = ["json", "regex"] }
clap = { version = "=4.6.7", features = ["derive"] }
env_logger = { version = "=0.11.11", default-features = false }
hickory-proto = { version = "=0.26.3", default-features = false, features = ["std"] }
hmac = "=0.13.0"
jsonschema = { version = "=0.61.1", default-features = false }
libc = "=0.2.191"
log = "=0.4.35"
num-format = { version = "=0.4.4", default-features = false, features = ["std"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
regex = { version = "=1.13.1", default-features = false, features = ["std", "unicode"] }
rustix = { version = "=1.1.6", features = ["fs", "process", "rand", "system", "thread"] }
rustls = { version = "=0.23.46", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-native-certs = "=0.8.5"
seccompiler = { version = "=0.5.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde-saphyr = "=2.1.1"
serde_json = "=1.0.154"
sha2 = { version = "=0.11.1", default-features = false }
signal-hook = { version = "=0.4.6", default-features = false, features = ["iterator"] }
systemlint-apt = { path = "crates/systemlint-apt" }
systemlint-env = { path = "crates/systemlint-env" }
systemlint-firewall = { path = "crates/systemlint-firewall" }
systemlint-formats = { path = "crates/systemlint-formats" }
systemlint-proc = { path = "crates/systemlint-proc" }
systemlint-protocol = { path = "crates/systemlint-protocol" }
systemlint-sshd = { path = "crates/systemlint-sshd" }
systemlint-systemd = { path = "crates/systemlint-systemd" }
toml = { version = "=1.2.1", default-features = false, features = ["std", "serde", "parse"] }
url = "=2.5.8"
wait-timeout = "=0.2.1"
x509-parser = "=0.18.1"

[profile.release]
strip = true
lto = true
