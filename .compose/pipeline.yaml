---
name: ${M6E_COMPOSE_PROJECT_NAME}
services:
  damian-buho-systemlint:
    container_name: ${M6E_CONTAINER_INSTANCE}
    image: ${M6E_IMAGE_FULLNAME}
    # Preset: large (2c, 4g) — CI build/test container
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
    command:
      - sleep
      - infinity
    networks:
      - dev-network
    environment:
      - LANG
      - TZ
networks:
  dev-network:
    name: ${M6E_COMPOSE_PROJECT_NAME}-network
